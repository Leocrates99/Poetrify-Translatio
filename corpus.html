<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Poetrify · Corpus dei testi antichi</title>
<!-- Anti-flash tema (D2): imposta [data-theme] prima del paint -->
<script>(function(){try{var t=localStorage.getItem('poetrify-theme');if(t!=='dark'&&t!=='light'){t=matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';}document.documentElement.setAttribute('data-theme',t);}catch(e){}})();</script>
<!-- Font self-hosted (vendor/fonts/) — GreekTimes copre il greco POLITONICO -->
<link rel="stylesheet" href="vendor/fonts/fonts.css">
<!-- Token condivisi (fonte unica del design system · shared/) -->
<link rel="stylesheet" href="shared/poetrify-tokens.css">
<style>
/* I token vivono in shared/poetrify-tokens.css (armonizzazione strutturale).
   Qui restano solo le regole specifiche del Corpus. */
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  font-family: var(--font-read);
  color: var(--ink);
  background: var(--ivory);
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
}
body { display: flex; flex-direction: column; }
button { font-family: inherit; cursor: pointer; }
/* colore=lingua del lettore: in shared/poetrify-tokens.css (body[data-lang]). */

/* ── Accessibilità: selezione, fuoco, altezza della testata ───────
   La selezione segue tema E lingua: era un indaco fisso al 14%, che sul fondo
   scuro spariva (1,02:1) e nel ramo latino restava blu mentre tutto il resto
   era rosso. `--head-h` la misura JS: la colonna si agganciava a 132 px contro
   una testata che ne occupa 158, lasciando una fessura in cui il testo scorreva. */
:root { --select-bg: rgba(24,0,172,.20); --head-h: 158px; --hit-bg: rgba(251,227,138,.5); }
:root[data-theme="dark"] { --select-bg: rgba(169,156,255,.34); --hit-bg: rgba(240,198,116,.15); }
body[data-lang="la"] { --select-bg: rgba(162,46,55,.22); }
:root[data-theme="dark"] body[data-lang="la"] { --select-bg: rgba(229,138,144,.32); }
::selection { background: var(--select-bg); }

/* Un solo indicatore di fuoco per tutta la pagina, sull'accento della lingua.
   Prima due campi lo toglievano con `outline: none` senza rimpiazzarlo: chi
   naviga da tastiera perdeva del tutto il segno di dov'era. */
:where(a, button, input, [tabindex]):focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
  border-radius: var(--radius-sm);
}

/* ── Masthead ─────────────────────────────────────────────────── */
.topbar {
  display: flex; align-items: center; gap: 20px;
  padding: 14px clamp(16px, 4vw, 40px);
  border-bottom: 1px solid var(--rule-soft);
  background: var(--paper);
  position: sticky; top: 0; z-index: 20;
}
.home {
  display: inline-flex; align-items: center; gap: 6px;
  font-family: var(--font-ui); font-size: 13px; font-weight: 600;
  color: var(--sepia); text-decoration: none; white-space: nowrap;
  padding: 6px 10px; border-radius: 8px; transition: background .15s, color .15s;
}
.home:hover { background: var(--cream); color: var(--primary); }
.brand { display: flex; flex-direction: column; line-height: 1.05; }
.brand .mark {
  font-family: var(--font-display); font-size: 24px; font-weight: 700;
  color: var(--primary); letter-spacing: -.01em;
}
.brand .sub {
  font-family: var(--font-ui); font-size: 10.5px; font-weight: 600;
  text-transform: uppercase; letter-spacing: .18em; color: var(--sepia); margin-top: 3px;
}

/* ── Barra di ricerca ─────────────────────────────────────────── */
.searchwrap { padding: 18px clamp(16px, 4vw, 40px) 6px; background: var(--paper); }
.searchbox { position: relative; max-width: 760px; margin: 0 auto; }
.searchbox svg { position: absolute; left: 16px; top: 50%; transform: translateY(-50%); width: 19px; height: 19px; color: var(--sepia); pointer-events: none; }
#q {
  width: 100%; font-family: var(--font-read); font-size: 17px; color: var(--ink);
  padding: 13px 16px 13px 46px; border: 1.5px solid var(--rule);
  border-radius: 12px; background: var(--ivory); transition: border-color .15s, box-shadow .15s;
}
/* Anello esplicito sui campi: `:focus-visible` dipende da un'euristica del
   browser, e su un campo di ricerca non deve esserci dubbio su dove sia il fuoco. */
#q:focus, #authorfilter:focus { outline: 2px solid var(--accent); outline-offset: 2px; }
#q:focus { border-color: var(--primary); box-shadow: 0 0 0 4px var(--primary-pale); }
#q::placeholder { color: var(--sepia); }
.searchhint {
  max-width: 760px; margin: 6px auto 0; text-align: center;
  font-family: var(--font-ui); font-size: 11.5px; color: var(--sepia);
}
.searchhint b { color: var(--primary); font-weight: 700; }
.searchhint .recog {
  font: inherit; font-weight: 700; color: var(--accent); background: none;
  border: none; padding: 0 0 0 6px; text-decoration: underline; text-underline-offset: 3px;
}

/* ── Riconoscimento di un brano ───────────────────────────────── */
.recog-head { margin-bottom: 4px; }
.recog-head h1 { font-family: var(--font-display); font-size: clamp(25px, 3.6vw, 34px); font-weight: 700; letter-spacing: -.015em; }
.recog-head p { max-width: 60ch; margin-top: 10px; font-size: 16px; color: var(--sepia); line-height: 1.55; }
#brano {
  width: 100%; min-height: 168px; margin-top: 18px; resize: vertical;
  font-family: var(--font-read); font-size: 17px; line-height: 1.65; color: var(--ink);
  padding: 16px 18px; border: 1.5px solid var(--rule); border-radius: var(--radius-lg);
  background: var(--parchment);
}
#brano:focus { outline: 2px solid var(--accent); outline-offset: 2px; border-color: var(--accent); }
#brano::placeholder { color: var(--sepia); }
.recog-bar { display: flex; gap: 12px; align-items: center; margin-top: 12px; flex-wrap: wrap; }
.btn-primary {
  font-family: var(--font-ui); font-size: 14px; font-weight: 700; color: var(--on-primary);
  background: var(--accent); border: none; border-radius: var(--radius-md); padding: 10px 20px;
  transition: filter .13s;
}
.btn-primary:hover { filter: brightness(1.08); }
.btn-primary[disabled] { opacity: .5; cursor: default; }
.recog-note { font-family: var(--font-ui); font-size: 12px; color: var(--sepia); }

.match {
  width: 100%; text-align: left; background: var(--paper); border: 1px solid var(--rule-soft);
  border-left: 4px solid var(--rule); border-radius: var(--radius-lg);
  padding: 15px 18px; margin: 12px 0; transition: box-shadow .13s, border-color .13s;
}
.match:hover { box-shadow: var(--shadow); }
.match.la { --accent: var(--accent-lat); } .match.grc { --accent: var(--accent-gr); }
.match.top { border-left-color: var(--accent); border-color: var(--accent); }
.match-top { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.score {
  font-family: var(--font-display); font-size: 26px; font-weight: 700; color: var(--accent);
  font-variant-numeric: tabular-nums; line-height: 1;
}
.score small { font-size: 13px; font-weight: 600; }
.match-who { font-family: var(--font-display); font-size: 18px; font-weight: 700; }
.match-loc { font-family: var(--font-mono); font-size: 11.5px; color: var(--sepia); margin-left: auto; }
.meter { height: 5px; background: var(--cream); border-radius: 3px; margin-top: 10px; overflow: hidden; }
.meter i { display: block; height: 100%; background: var(--accent); border-radius: 3px; }
.match-snip { font-family: var(--font-read); font-size: 15.5px; line-height: 1.55; color: var(--ink-soft); margin-top: 10px; }
.match.grc .match-snip { font-family: var(--font-classical); font-size: 16.5px; }
.match-why { font-family: var(--font-ui); font-size: 11.5px; color: var(--sepia); margin-top: 9px; }
.match-why b { color: var(--accent); }

/* ── Layout a due pannelli ────────────────────────────────────── */
.layout {
  display: grid; grid-template-columns: 300px minmax(0, 1fr);
  gap: 0; flex: 1; min-height: 0;
}
.browser {
  border-right: 1px solid var(--rule-soft); background: var(--paper);
  padding: 20px 16px 60px; overflow-y: auto; max-height: calc(100vh - var(--head-h));
  position: sticky; top: var(--head-h);
}
.browser h2 {
  font-family: var(--font-ui); font-size: 10.5px; font-weight: 700;
  text-transform: uppercase; letter-spacing: .1em; color: var(--sepia);
  margin: 0 6px 10px; display: flex; align-items: baseline; gap: 6px;
}
.browser h2 .n { margin-left: auto; font-family: var(--font-mono); font-size: 10px; color: var(--sepia); }
#authorfilter {
  width: 100%; font-family: var(--font-ui); font-size: 13px; color: var(--ink);
  padding: 7px 11px; border: 1px solid var(--rule); border-radius: 8px;
  background: var(--ivory); margin-bottom: 10px;
}
#authorfilter:focus { border-color: var(--primary); }
#authorfilter::placeholder { color: var(--sepia); }
.arow {
  display: flex; align-items: baseline; gap: 8px; width: 100%; text-align: left;
  background: none; border: none; padding: 6px 9px; border-radius: 8px;
  color: var(--ink); transition: background .12s;
}
.arow:hover { background: var(--cream); }
.arow[aria-current="true"] { background: var(--cream); box-shadow: inset 3px 0 0 var(--accent); }
.arow .aname { font-family: var(--font-display); font-size: 15px; font-weight: 600; }
.arow.la .aname { color: var(--accent-lat); }
.arow.grc .aname { color: var(--accent-gr); }
.arow .an { margin-left: auto; font-family: var(--font-mono); font-size: 10px; color: var(--sepia); }

/* ── Stage ────────────────────────────────────────────────────── */
.stage { padding: clamp(20px, 3vw, 40px) clamp(16px, 4vw, 48px) 80px; overflow-x: hidden; }
.stage-inner { max-width: 900px; margin: 0 auto; }

.welcome-hero { text-align: center; padding: 18px 0 6px; }
.welcome-hero h1 { font-family: var(--font-display); font-size: clamp(30px, 5vw, 44px); font-weight: 700; color: var(--ink); letter-spacing: -.015em; }
.welcome-hero p { max-width: 32rem; margin: 14px auto 0; font-size: 17px; line-height: 1.6; color: var(--sepia); }
.stats-row { display: flex; justify-content: center; flex-wrap: wrap; gap: 10px; margin: 24px 0 8px; }
.stat { background: var(--paper); border: 1px solid var(--rule-soft); border-radius: var(--radius-lg); padding: 10px 18px; text-align: center; }
.stat .n { font-family: var(--font-display); font-size: 23px; font-weight: 700; color: var(--primary); font-variant-numeric: tabular-nums; }
.stat .l { font-family: var(--font-ui); font-size: 10.5px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; color: var(--sepia); margin-top: 1px; }

/* ── Faccette ─────────────────────────────────────────────────── */
.facetbar { display: flex; gap: 7px; flex-wrap: wrap; align-items: center; margin-top: 14px; }
.facetbar + .facetbar { margin-top: 8px; }
.facet-lbl {
  font-family: var(--font-ui); font-size: 10px; font-weight: 700; letter-spacing: .09em;
  text-transform: uppercase; color: var(--sepia); margin-right: 2px; min-width: 52px;
}
.facet {
  font-family: var(--font-ui); font-size: 11.5px; font-weight: 600; padding: 5px 11px;
  border-radius: var(--radius-pill); border: 1px solid var(--rule); color: var(--ink-soft);
  background: var(--paper); transition: all .13s;
}
.facet:hover { border-color: var(--accent); color: var(--accent); }
.facet .c { color: var(--sepia); font-variant-numeric: tabular-nums; font-size: 10px; margin-left: 5px; }
.facet[aria-pressed="true"] { background: var(--primary); border-color: var(--primary); color: var(--on-primary); }
.facet[aria-pressed="true"] .c { color: var(--on-primary); opacity: .75; }
.resultline {
  font-family: var(--font-ui); font-size: 12.5px; color: var(--sepia);
  margin: 20px 0 12px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
}
.resultline b { color: var(--ink); }
.clearf {
  font-family: var(--font-ui); font-size: 11px; font-weight: 600; color: var(--accent);
  background: none; border: none; text-decoration: underline; padding: 0;
}

/* ── Griglia opere ────────────────────────────────────────────── */
.catalog { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 14px; }
.catcard {
  text-align: left; background: var(--paper); border: 1px solid var(--rule-soft);
  border-radius: var(--radius-lg); padding: 16px 16px 14px; border-left: 4px solid var(--rule);
  transition: border-color .15s, box-shadow .15s, transform .15s;
}
.catcard:hover { box-shadow: var(--shadow-lift); transform: translateY(-2px); }
.catcard.la  { border-left-color: var(--accent-lat); }
.catcard.grc { border-left-color: var(--accent-gr); }
/* ── Card dell'opera · TRE FASCE ────────────────────────────────
   1ª titolo d'uso italiano · 2ª titolo in lingua originale · 3ª autore.
   La seconda compare solo quando dice qualcosa di diverso dalla prima: se
   l'uso italiano È il titolo originale (De rerum natura, Satyricon) ripeterla
   sarebbe rumore. Il font classico va sulla fascia che porta davvero il greco,
   non sul titolo italiano. */
.catcard .ctitle { font-family: var(--font-display); font-size: 18.5px; font-weight: 700; color: var(--ink); line-height: 1.15; }
.catcard .ctitle.orig { font-family: var(--font-classical); }
.catcard .corig { font-family: var(--font-read); font-size: 14px; font-style: italic; color: var(--ink-soft); margin-top: 3px; line-height: 1.3; }
.catcard .corig.gr { font-family: var(--font-classical); font-style: normal; font-size: 15px; }
.catcard .corig .en {
  font-family: var(--font-ui); font-size: 8.5px; font-weight: 700; letter-spacing: .05em;
  text-transform: uppercase; border: 1px dashed var(--rule); border-radius: var(--radius-pill);
  padding: 1px 6px; color: var(--sepia); margin-left: 5px; vertical-align: 1px; font-style: normal;
}
.catcard .cauthor {
  font-family: var(--font-ui); font-size: 12px; font-weight: 600; color: var(--sepia);
  margin-top: 7px; padding-top: 7px; border-top: 1px solid var(--rule-soft);
}
.catcard .cmeta { font-family: var(--font-ui); font-size: 10.5px; color: var(--sepia); margin-top: 9px; display: flex; gap: 5px; flex-wrap: wrap; }
.catcard .cmeta span { padding: 2px 8px; border-radius: var(--radius-pill); background: var(--cream); }
.catcard .cmeta span.inf { border: 1px dashed var(--rule); background: transparent; }
.sentinel { height: 1px; }
.moreline {
  text-align: center; font-family: var(--font-ui); font-size: 12px; color: var(--sepia);
  padding: 18px 0; display: flex; gap: 12px; align-items: center; justify-content: center; flex-wrap: wrap;
}
/* Comando esplicito accanto allo scorrimento automatico: un caricamento che si
   attiva SOLO scorrendo è inoperabile da tastiera e con lo screen reader. */
.btn-more {
  font-family: var(--font-ui); font-size: 12.5px; font-weight: 700; color: var(--accent);
  background: var(--paper); border: 1.5px solid var(--rule); border-radius: var(--radius-pill);
  padding: 6px 16px; transition: border-color .13s;
}
.btn-more:hover { border-color: var(--accent); }

/* ── Pagina autore ────────────────────────────────────────────── */
.author-head { border-bottom: 2px solid var(--accent); padding-bottom: 14px; margin-bottom: 6px; }
.author-head .rk { font-family: var(--font-ui); font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .1em; color: var(--accent); }
.author-head h1 { font-family: var(--font-display); font-size: clamp(26px, 4vw, 36px); font-weight: 700; line-height: 1.1; margin-top: 5px; }
.author-head .byline { font-family: var(--font-ui); font-size: 13px; color: var(--sepia); margin-top: 7px; }
.backlink {
  font-family: var(--font-ui); font-size: 12px; font-weight: 600; color: var(--sepia);
  background: none; border: none; padding: 4px 0; margin-bottom: 12px;
}
.backlink:hover { color: var(--accent); }

/* ── Risultati ricerca ────────────────────────────────────────── */
.results-head { display: flex; align-items: baseline; gap: 10px; margin-bottom: 4px; flex-wrap: wrap; }
.results-head h1 { font-family: var(--font-display); font-size: 24px; font-weight: 700; }
.results-head .count { font-family: var(--font-ui); font-size: 13px; color: var(--sepia); }
.sect-lbl {
  font-family: var(--font-ui); font-size: 10.5px; font-weight: 700; letter-spacing: .1em;
  text-transform: uppercase; color: var(--sepia); margin: 26px 0 10px;
  display: flex; align-items: center; gap: 9px;
}
.sect-lbl::after { content: ""; flex: 1; height: 1px; background: var(--rule-soft); }
.stageline {
  font-family: var(--font-ui); font-size: 12px; color: var(--sepia);
  display: flex; align-items: center; gap: 9px; padding: 9px 13px; background: var(--cream);
  border-radius: var(--radius-md); flex-wrap: wrap; margin-bottom: 4px;
}
.stageline b { color: var(--ink); }
.prog { height: 3px; background: var(--rule-soft); border-radius: 2px; flex: 1; min-width: 60px; overflow: hidden; }
.prog i { display: block; height: 100%; background: var(--accent); border-radius: 2px; transition: width .2s; }
.res {
  width: 100%; text-align: left; background: var(--paper); border: 1px solid var(--rule-soft);
  border-left: 3px solid var(--rule); border-radius: var(--radius-md); padding: 12px 15px; margin: 9px 0;
  transition: border-color .13s, box-shadow .13s;
}
.res:hover { box-shadow: var(--shadow-sm); border-left-color: var(--accent); }
.res.la  { --accent: var(--accent-lat); }
.res.grc { --accent: var(--accent-gr); }
.res .rref { font-family: var(--font-ui); font-size: 11.5px; font-weight: 600; color: var(--sepia); margin-bottom: 5px; }
.res .rref b { color: var(--accent); }
.res .rtext { font-family: var(--font-read); font-size: 16px; line-height: 1.5; color: var(--ink); }
.res.grc .rtext { font-family: var(--font-classical); font-size: 17px; }
mark { background: var(--mark); color: inherit; border-radius: 3px; padding: 0 1px; }

/* ── Lettore ──────────────────────────────────────────────────── */
.reader-head { border-bottom: 2px solid var(--accent); padding-bottom: 16px; margin-bottom: 4px; }
.reader-head .rk { font-family: var(--font-ui); font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .1em; color: var(--accent); }
.reader-head h1 { font-family: var(--font-display); font-size: clamp(28px, 4vw, 38px); font-weight: 700; color: var(--ink); line-height: 1.1; margin-top: 6px; }
/* Il carattere classico va SOLO sulla riga che porta davvero l'antico: se in
   testa c'è il titolo italiano, deve restare nel font da display. */
body[data-lang="grc"] .reader-head h1.antico { font-family: var(--font-classical); font-weight: 700; }
.reader-head .rtitle-orig { font-family: var(--font-read); font-size: 19px; font-style: italic; color: var(--ink-soft); margin-top: 4px; }
body[data-lang="grc"] .reader-head .rtitle-orig { font-family: var(--font-classical); font-style: normal; font-size: 20px; }
.reader-head .byline { font-family: var(--font-read); font-size: 17px; font-style: italic; color: var(--sepia); margin-top: 6px; }
.reader-head .byline button { font: inherit; color: inherit; background: none; border: none; text-decoration: underline; text-underline-offset: 3px; padding: 0; }
.reader-head .byline button:hover { color: var(--accent); }
.reader-head .src { font-family: var(--font-mono); font-size: 10.5px; color: var(--sepia); margin-top: 10px; word-break: break-all; }
.reader-head .src a { color: var(--accent); text-decoration: none; }
.book-nav { display: flex; flex-wrap: wrap; gap: 6px; margin: 18px 0 8px; }
.book-nav .blabel { font-family: var(--font-ui); font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; color: var(--sepia); align-self: center; margin-right: 4px; }
.book-nav button {
  font-family: var(--font-ui); font-size: 13px; font-weight: 600; min-width: 34px;
  padding: 5px 11px; border-radius: var(--radius-md); border: 1.5px solid var(--rule); background: transparent; color: var(--ink); transition: all .13s;
}
.book-nav button:hover { border-color: var(--accent); }
.book-nav button[aria-current="true"] { background: var(--accent); border-color: var(--accent); color: #fff; }

.scroll {
  background: var(--parchment); border: 1px solid var(--parchment-edge);
  border-radius: 14px; padding: clamp(20px, 3vw, 40px) clamp(18px, 3vw, 44px);
  margin-top: 12px; box-shadow: inset 0 1px 0 rgba(255,255,255,.5);
}
.para { position: relative; margin: 0 0 14px; padding-left: 8px; }
.para .loc {
  font-family: var(--font-mono); font-size: 10.5px; color: var(--sepia);
  user-select: none; margin-right: 8px; font-weight: 500;
}
.para .txt { font-family: var(--font-read); font-size: 18px; line-height: 1.72; color: var(--ink); }
body[data-lang="grc"] .para .txt { font-family: var(--font-classical); font-size: 20px; line-height: 1.85; }
.verse { display: flex; align-items: baseline; gap: 14px; padding: 1px 0; }
.verse .ln { flex: 0 0 34px; text-align: right; font-family: var(--font-mono); font-size: 10.5px; color: var(--sepia); user-select: none; }
.verse .vt { font-family: var(--font-read); font-size: 18px; line-height: 1.62; color: var(--ink); }
body[data-lang="grc"] .verse .vt { font-family: var(--font-classical); font-size: 20px; line-height: 1.72; }
/* Il passo raggiunto dalla ricerca si segnala su DUE canali: un fondo tenue e un
   filetto d'accento. Col solo fondo è impossibile soddisfare insieme i due
   vincoli nel tema scuro — distinguersi dalla pergamena (≥3:1) e lasciare
   leggibile il testo che ci sta sopra (≥4,5:1): schiarendolo si perde il testo,
   scurendolo si perde il segnale. Il filetto porta il «sei qui», il fondo resta
   discreto, e il colore segue la lingua. */
.verse:target, .para:target, .unit.flash {
  background: var(--hit-bg);
  box-shadow: inset 3px 0 0 var(--accent);
  border-radius: 6px;
}
.unit.flash { animation: flash 1.8s ease; }
@keyframes flash {
  0%, 45% { background: var(--hit-bg); box-shadow: inset 3px 0 0 var(--accent); }
  100%    { background: transparent;   box-shadow: inset 3px 0 0 transparent; }
}

.unit { border-radius: 6px; }
.unit .acts { display: inline-flex; gap: 4px; margin-left: 8px; opacity: 0; transition: opacity .12s; vertical-align: middle; }
/* `:focus-within` non è un di più: senza, in un libro dell'Iliade restavano
   centinaia di fermate di tabulazione su bottoni invisibili — chi naviga da
   tastiera attraversava il testo a vuoto senza sapere dove si trovava. */
.unit:hover .acts, .unit:focus-within .acts { opacity: 1; }
.acts button {
  font-family: var(--font-ui); font-size: 10.5px; font-weight: 600; color: var(--sepia);
  border: 1px solid var(--rule-soft); background: var(--paper); border-radius: 6px; padding: 2px 7px;
  transition: all .12s;
}
.acts button:hover { color: var(--accent); border-color: var(--accent); }

.loading, .empty { text-align: center; color: var(--sepia); padding: 60px 20px; font-size: 15px; }
.spinner { width: 26px; height: 26px; border: 3px solid var(--rule-soft); border-top-color: var(--accent); border-radius: 50%; margin: 0 auto 14px; animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

.toast { position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%) translateY(20px); background: var(--ink); color: var(--paper); font-family: var(--font-ui); font-size: 13px; padding: 9px 16px; border-radius: var(--radius-pill); opacity: 0; transition: all .2s; pointer-events: none; z-index: 60; }
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
.mobtoggle { display: none; }

@media (max-width: 860px) {
  .layout { grid-template-columns: 1fr; }
  .browser { position: static; max-height: none; border-right: none; border-bottom: 1px solid var(--rule-soft); display: none; }
  .browser.open { display: block; }
  .mobtoggle { display: inline-flex; align-items: center; gap: 6px; font-family: var(--font-ui); font-size: 12px; font-weight: 700; color: var(--primary); background: var(--cream); border: 1px solid var(--rule-soft); border-radius: var(--radius-md); padding: 8px 14px; margin: 12px auto 0; }
}
@media (max-width: 560px) { .brand .sub { display: none; } .facet-lbl { min-width: 0; } }

/* Dark (D2): token in shared/ [data-theme]. Qui solo le regole del Corpus. */
:root[data-theme="dark"] { --parchment: #24242c; --parchment-edge: #34343f; --mark: #6b5a1e; }
:root[data-theme="dark"] #q:focus { box-shadow: 0 0 0 4px rgba(139,125,255,.16); }
:root[data-theme="dark"] .catcard:hover, :root[data-theme="dark"] .res:hover { box-shadow: var(--shadow-lift); }
:root[data-theme="dark"] mark { color: #fff; }
:root[data-theme="dark"] .book-nav button[aria-current="true"] { color: var(--on-primary); }
</style>
</head>
<body>

<header class="topbar">
  <a class="home" href="app.html" title="Torna alla home di Poetrify">
    <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
    Poetrify
  </a>
  <div class="brand"><span class="mark">Corpus</span><span class="sub">biblioteca dei testi antichi</span></div>
</header>

<div class="searchwrap">
  <div class="searchbox">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.35-4.35"/></svg>
    <input id="q" type="search" autocomplete="off" spellcheck="false"
           placeholder="Cerca un autore, un'opera o una parola nei testi…" aria-label="Cerca nel corpus">
  </div>
  <p class="searchhint">La ricerca ignora accenti e spiriti: cerca <b>μηνιν</b> e trovi <b>μῆνιν</b>; <b>vita</b> trova anche <b>uita</b>.
    <button class="recog" id="openrecog" type="button">Hai una versione? Scopri da dove viene</button></p>
</div>

<main class="layout">
  <button class="mobtoggle" id="mobtoggle" aria-expanded="false">☰ Sfoglia gli autori</button>
  <aside class="browser" id="browser" aria-label="Sfoglia per autore">
    <h2>Autori <span class="n" id="acount"></span></h2>
    <input id="authorfilter" type="search" autocomplete="off" placeholder="Filtra gli autori…" aria-label="Filtra gli autori">
    <div id="authors"></div>
  </aside>
  <section class="stage"><div class="stage-inner" id="stage"><div class="loading"><div class="spinner"></div>Carico il catalogo…</div></div></section>
</main>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
'use strict';
// ───────────────────────────────────────────────────────────────────────────
// Poetrify · Corpus — biblioteca dei testi antichi (local-first, senza build)
//
// ARCHITETTURA DELLA RICERCA (fase C5 di _build/CORPUS_SPEC.md)
// Con 1.157 opere e ~16 milioni di parole non si può più scandire tutto: si
// interroga un INDICE INVERSO (forma → opere) diviso a spicchi, si restringe il
// campo alle poche opere candidate e solo QUELLE si scaricano e si scandiscono
// per trovare il passo esatto. Il costo dipende da quanto è rara la parola
// cercata, non da quanto è grande il corpus.
// ───────────────────────────────────────────────────────────────────────────
const BASE = 'data/corpus';
const PAGE = 60;              // opere disegnate per volta nel catalogo
const MAX_WORKS_SCAN = 60;    // tetto di opere aperte per una ricerca
const MAX_HITS = 200;         // tetto di passi mostrati

const state = {
  lang: 'all', index: null, docs: {},
  manifest: null, shards: {},
  view: 'welcome', work: null, book: null, author: null,
  facets: { genre: null, epoch: null },
  shown: 0, filtered: [],
};

const el = (t, c, txt) => { const e = document.createElement(t); if (c) e.className = c; if (txt != null) e.textContent = txt; return e; };
const $stage = document.getElementById('stage');
const $authors = document.getElementById('authors');
const langName = { la: 'Latino', grc: 'Greco' };
const nf = new Intl.NumberFormat('it-IT');

// Folding accent/case-insensitive con MAPPA verso gli indici originali, per
// evidenziare la porzione esatta anche saltando i diacritici. Deve restare
// IDENTICA a fold() in _build/build_corpus_index.py, o l'indice non combacia.
const COMBINING = /[̀-ͯ]/g;
/* L'apostrofo di elisione (ʼ U+02BC e simili) è per Unicode una LETTERA
   modificatrice: `\p{L}` lo tiene dentro la parola, così «μυρίʼ» non combaciava
   mai con «μυρι». Nella ricerca il danno restava nascosto — il confronto per
   prefisso li trovava lo stesso — ma il riconoscimento confronta insiemi esatti
   e perdeva proprio le parole elise, frequentissime in poesia. Va tolto QUI e
   nello stesso punto di build_corpus_index.py, o indice e ricerca divergono. */
const ELISION = /[ʼ’ʹ᾽᾿῾´'’]/g;
const SWAP = (s) => s.toLowerCase().replace(ELISION, '')
  .replace(/ς/g, 'σ').replace(/v/g, 'u').replace(/j/g, 'i');

/* fold() lavora sull'INTERA stringa: chiamare normalize() una volta per carattere
   costava secondi di CPU su un'opera intera, e rendeva il riconoscimento — che
   normalizza ogni unità di dieci opere — semplicemente inutilizzabile. */
const fold = (s) => SWAP(s.normalize('NFD').replace(COMBINING, ''));

/* foldMap() serve solo dove occorre risalire alla posizione ORIGINALE (per
   evidenziare la forma accentata nei risultati), quindi mantiene la mappa —
   ma salta normalize() sui caratteri ASCII, che normalizzano a sé stessi.
   Deve restare d'accordo con fold(): stesse sostituzioni, stesso ordine. */
function foldMap(s) {
  const out = []; const map = [];
  for (let i = 0; i < s.length; i++) {
    const ch = s[i];
    let f = ch.charCodeAt(0) < 128 ? ch : ch.normalize('NFD').replace(COMBINING, '');
    f = SWAP(f);
    for (const c of f) { out.push(c); map.push(i); }
  }
  return { norm: out.join(''), map };
}
const escapeHtml = (s) => s.replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' }[m]));

let toastTimer;
function toast(msg) {
  const t = document.getElementById('toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 1600);
}

// ── Dati ───────────────────────────────────────────────────────────────────
async function loadIndex() {
  const r = await fetch(`${BASE}/_index.json`);
  if (!r.ok) throw new Error('catalogo non trovato');
  state.index = await r.json();
}
async function loadWork(id) {
  if (state.docs[id]) return state.docs[id];
  const meta = state.index.works.find(w => w.id === id);
  if (!meta) throw new Error('opera sconosciuta: ' + id);
  const r = await fetch(`${BASE}/${meta.lang}/${id}.json`);
  if (!r.ok) throw new Error('opera non caricata: ' + id);
  const doc = await r.json();
  state.docs[id] = doc;
  return doc;
}
/* Si mette in cache SOLO l'esito buono e il 404 (spicchio che davvero non esiste).
   Un errore di rete o un 5xx transitorio NON va memorizzato: memorizzandolo, una
   connessione caduta a metà di uno spicchio da 3 MB faceva rispondere «nessuna
   opera contiene questa forma» — una bugia autorevole — per tutto il resto della
   sessione, anche a rete tornata perfetta. Le richieste in volo si condividono,
   così digitare «ε», «ελ», «ελε» non scarica tre volte lo stesso spicchio. */
const inflight = new Map();

async function loadManifest() {
  if (state.manifest) return state.manifest;
  try {
    const r = await fetch(`${BASE}/_idx/_manifest.json`);
    if (!r.ok) return r.status === 404 ? (state.manifest = false) : false;
    state.manifest = await r.json();
  } catch { return false; }           // transitorio: si ritenta alla prossima ricerca
  return state.manifest;
}

async function loadShard(ch) {
  const key = ch.codePointAt(0).toString(16).padStart(4, '0');
  if (key in state.shards) return state.shards[key];
  if (inflight.has(key)) return inflight.get(key);
  const p = (async () => {
    const r = await fetch(`${BASE}/_idx/${key}.json`);
    if (!r.ok) {
      if (r.status === 404) { state.shards[key] = null; return null; }
      throw new Error('spicchio non raggiungibile: ' + r.status);
    }
    const data = await r.json();
    state.shards[key] = data;
    return data;
  })();
  inflight.set(key, p);
  try { return await p; }
  finally { inflight.delete(key); }
}

// ── Selezione corrente ─────────────────────────────────────────────────────
function inBranch(w) { return state.lang === 'all' || w.lang === state.lang; }
function currentWorks() {
  return state.index.works.filter(w =>
    inBranch(w) &&
    (!state.facets.genre || w.genre === state.facets.genre) &&
    (!state.facets.epoch || w.epoch === state.facets.epoch));
}

// ── Colonna autori ─────────────────────────────────────────────────────────
function renderAuthors(filter) {
  const f = fold(filter || '');
  const authors = state.index.authors
    .filter(a => (state.lang === 'all' || a.lang === state.lang) && (!f || fold(a.name).includes(f)));
  document.getElementById('acount').textContent = authors.length;
  $authors.innerHTML = '';
  const frag = document.createDocumentFragment();
  for (const a of authors) {
    const b = el('button', `arow ${a.lang}`);
    if (state.author === a.id) b.setAttribute('aria-current', 'true');
    b.appendChild(el('span', 'aname', a.name));
    b.appendChild(el('span', 'an', a.works));
    b.onclick = () => openAuthor(a.id);
    frag.appendChild(b);
  }
  if (!authors.length) {
    const e = el('div', 'moreline', 'Nessun autore con questo nome.');
    frag.appendChild(e);
  }
  $authors.appendChild(frag);
}

// ── Biblioteca (catalogo a faccette) ───────────────────────────────────────
function renderWelcome() {
  state.view = 'welcome'; state.work = null; state.author = null;
  if (state.lang === 'la' || state.lang === 'grc') document.body.dataset.lang = state.lang;
  else document.body.removeAttribute('data-lang');

  const wrap = el('div');
  const hero = el('div', 'welcome-hero');
  hero.appendChild(el('h1', null, 'La biblioteca dei classici'));
  hero.appendChild(el('p', null, 'Il testo originale, greco e latino: da sfogliare per autore, restringere per genere ed epoca, o cercare parola per parola in tutto il corpus.'));
  wrap.appendChild(hero);

  const base = state.index.works.filter(inBranch);
  const stats = el('div', 'stats-row');
  const mk = (n, l) => { const s = el('div', 'stat'); s.appendChild(el('div', 'n', n)); s.appendChild(el('div', 'l', l)); return s; };
  stats.appendChild(mk(nf.format(base.length), 'opere'));
  stats.appendChild(mk(nf.format(new Set(base.map(w => w.authorId)).size), 'autori'));
  stats.appendChild(mk(nf.format(base.reduce((s, w) => s + w.words, 0)), 'parole'));
  wrap.appendChild(stats);

  wrap.appendChild(buildFacets('genre', 'Genere'));
  wrap.appendChild(buildFacets('epoch', 'Epoca'));

  const list = el('div');
  list.id = 'worklist';
  wrap.appendChild(list);

  $stage.innerHTML = ''; $stage.appendChild(wrap);
  paintWorks();
  renderAuthors(document.getElementById('authorfilter').value);
}

// Le faccette mostrano quante opere restano, calcolate sulla selezione
// dell'ALTRA faccetta: così i conteggi dicono il vero invece di promettere
// risultati che il filtro incrociato azzererebbe.
function buildFacets(field, label) {
  const other = field === 'genre' ? 'epoch' : 'genre';
  const pool = state.index.works.filter(w =>
    inBranch(w) && (!state.facets[other] || w[other] === state.facets[other]));
  const tally = {};
  for (const w of pool) tally[w[field]] = (tally[w[field]] || 0) + 1;
  const entries = Object.entries(tally).sort((a, b) => b[1] - a[1]);

  const bar = el('div', 'facetbar');
  bar.appendChild(el('span', 'facet-lbl', label));
  for (const [val, n] of entries) {
    const b = el('button', 'facet');
    b.setAttribute('aria-pressed', String(state.facets[field] === val));
    b.appendChild(document.createTextNode(val));
    b.appendChild(el('span', 'c', n));
    b.onclick = () => {
      state.facets[field] = state.facets[field] === val ? null : val;
      state.shown = 0;
      renderWelcome();
    };
    bar.appendChild(b);
  }
  return bar;
}

// Disegno INCREMENTALE: oltre mille schede in un colpo sono migliaia di nodi. Si
// disegna a blocchi e si prosegue quando la sentinella entra nel viewport.
let catalogIO = null;
function paintWorks() {
  const host = document.getElementById('worklist');
  if (!host) return;
  host.innerHTML = '';
  state.filtered = currentWorks();
  state.shown = 0;

  const line = el('div', 'resultline');
  const strong = el('b', null, `${nf.format(state.filtered.length)} oper${state.filtered.length === 1 ? 'a' : 'e'}`);
  line.appendChild(strong);
  const active = ['genre', 'epoch'].filter(k => state.facets[k]).map(k => state.facets[k]);
  if (active.length) {
    line.appendChild(el('span', null, '· ' + active.join(' · ')));
    const clr = el('button', 'clearf', 'azzera i filtri');
    clr.onclick = () => { state.facets = { genre: null, epoch: null }; renderWelcome(); };
    line.appendChild(clr);
  }
  host.appendChild(line);

  const grid = el('div', 'catalog'); grid.id = 'catgrid';
  host.appendChild(grid);
  const more = el('div', 'moreline'); more.id = 'moreline';
  const moreTxt = el('span'); moreTxt.id = 'moretxt';
  const moreBtn = el('button', 'btn-more', 'Mostra le altre'); moreBtn.id = 'morebtn';
  moreBtn.onclick = () => appendChunk();
  more.appendChild(moreTxt); more.appendChild(moreBtn);
  host.appendChild(more);
  appendChunk();

  const sentinel = el('div', 'sentinel'); host.appendChild(sentinel);
  if (window.IntersectionObserver) {
    // Si disconnette quello precedente: ogni cambio di faccetta ridisegna il
    // catalogo, e senza questo restavano appesi tanti osservatori quante erano
    // state le selezioni, tutti a spiare sentinelle ormai staccate dal documento.
    if (catalogIO) catalogIO.disconnect();
    catalogIO = new IntersectionObserver((ents) => {
      if (ents.some(e => e.isIntersecting)) {
        if (state.shown >= state.filtered.length) { catalogIO.disconnect(); return; }
        appendChunk();
      }
    }, { rootMargin: '400px' });
    catalogIO.observe(sentinel);
  }
}

function appendChunk() {
  const grid = document.getElementById('catgrid');
  if (!grid) return;
  const slice = state.filtered.slice(state.shown, state.shown + PAGE);
  const frag = document.createDocumentFragment();
  for (const w of slice) frag.appendChild(workCard(w));
  grid.appendChild(frag);
  state.shown += slice.length;
  const txt = document.getElementById('moretxt');
  const btn = document.getElementById('morebtn');
  if (txt && btn) {
    const left = state.filtered.length - state.shown;
    txt.textContent = left ? `${nf.format(state.shown)} di ${nf.format(state.filtered.length)}` : '';
    btn.hidden = !left;
    btn.textContent = left > PAGE ? `Mostra altre ${PAGE}` : 'Mostra le ultime';
  }
}

/* Tre stati, tre rese (contratto in _build/corpus_titles.py):
     'it'      titolo italiano in testa, originale sotto
     'orig'    l'uso italiano È l'originale → una fascia sola, niente ripetizione
     'assente' non curato: originale in testa, inglese sotto marcato «en»       */
function workCard(w) {
  const card = el('button', `catcard ${w.lang}`);
  const st = w.titleState || 'assente';
  const anticoInTesta = (st !== 'it');

  const t1 = el('div', 'ctitle' + (anticoInTesta ? ' orig' : ''), w.title);
  if (anticoInTesta) t1.lang = w.lang;
  card.appendChild(t1);

  if (w.titleOrig) {
    const secondaGreca = (st === 'it' && w.lang === 'grc');
    const t2 = el('div', 'corig' + (secondaGreca ? ' gr' : ''));
    t2.appendChild(document.createTextNode(w.titleOrig));
    if (st === 'it') {
      t2.lang = w.lang;                          // è davvero l'originale
    } else {
      /* Non è l'originale ed è un ripiego, ma NON è detto che sia inglese: nel
         catalogo Perseus il campo «titolo inglese» porta spesso il titolo
         convenzionale LATINO (Galeno: «De naturalibus facultatibus»). Marcarlo
         «en» sarebbe un'affermazione falsa: si dice che è convenzionale e basta. */
      const tag = el('span', 'en', 'conv.');
      tag.title = 'Titolo convenzionale dal catalogo della fonte, non il titolo originale';
      t2.appendChild(tag);
    }
    card.appendChild(t2);
  }

  card.appendChild(el('div', 'cauthor', w.author));
  const meta = el('div', 'cmeta');
  const g = el('span', w.inferred ? 'inf' : null, w.genre);
  if (w.inferred) g.title = 'Genere ed epoca dedotti dall’autore, non curati opera per opera';
  meta.appendChild(g);
  meta.appendChild(el('span', null, w.epoch));
  meta.appendChild(el('span', null, w.kind === 'versi' ? `${nf.format(w.units)} versi` : `${nf.format(w.units)} passi`));
  card.appendChild(meta);
  card.onclick = () => openWork(w.id);
  return card;
}

// ── Pagina autore ──────────────────────────────────────────────────────────
function openAuthor(id) {
  const a = state.index.authors.find(x => x.id === id);
  if (!a) return;
  state.view = 'author'; state.author = id; state.work = null;
  document.body.dataset.lang = a.lang;
  closeMobileBrowser();

  const works = state.index.works.filter(w => w.authorId === id);
  const wrap = el('div');
  const back = el('button', 'backlink', '← Tutta la biblioteca');
  back.onclick = () => { state.author = null; renderWelcome(); };
  wrap.appendChild(back);

  const head = el('div', 'author-head');
  const genres = [...new Set(works.map(w => w.genre))];
  head.appendChild(el('div', 'rk', `${langName[a.lang]} · ${genres.slice(0, 3).join(' · ')}`));
  head.appendChild(el('h1', null, a.name));
  head.appendChild(el('div', 'byline',
    `${nf.format(works.length)} oper${works.length === 1 ? 'a' : 'e'} · ${nf.format(a.words)} parole · ${works[0] ? works[0].epoch : ''}`));
  wrap.appendChild(head);

  const line = el('div', 'resultline');
  line.appendChild(el('b', null, 'Le opere'));
  wrap.appendChild(line);

  const grid = el('div', 'catalog');
  for (const w of works) grid.appendChild(workCard(w));
  wrap.appendChild(grid);

  $stage.innerHTML = ''; $stage.appendChild(wrap);
  window.scrollTo({ top: 0 });
  renderAuthors(document.getElementById('authorfilter').value);
}

// ── Lettore ────────────────────────────────────────────────────────────────
function booksOf(doc) {
  const map = new Map();
  for (const u of doc.units) {
    const key = u.loc.includes('.') ? u.loc.split('.')[0] : '·';
    if (!map.has(key)) map.set(key, []);
    map.get(key).push(u);
  }
  return map;
}
function lastSeg(loc) { const p = loc.split('.'); return p[p.length - 1]; }
function closeMobileBrowser() {
  document.getElementById('browser').classList.remove('open');
  document.getElementById('mobtoggle').setAttribute('aria-expanded', 'false');
}

async function openWork(id, targetLoc) {
  closeMobileBrowser();
  $stage.innerHTML = '<div class="loading"><div class="spinner"></div>Apro l\'opera…</div>';
  let doc;
  try { doc = await loadWork(id); }
  catch (e) { $stage.innerHTML = `<div class="empty">Non riesco ad aprire quest’opera.<br><small>${escapeHtml(String(e))}</small></div>`; return; }
  state.view = 'reader'; state.work = doc; state.author = doc.authorId;
  document.body.dataset.lang = doc.lang;
  const books = booksOf(doc);
  const keys = [...books.keys()];
  let book = state.book;
  if (targetLoc) book = targetLoc.includes('.') ? targetLoc.split('.')[0] : '·';
  if (!keys.includes(book)) book = keys[0];
  state.book = book;
  renderReader(doc, books, book, targetLoc);
  renderAuthors(document.getElementById('authorfilter').value);
}

let readerIO = null;
function renderReader(doc, books, bookKey, targetLoc) {
  const keys = [...books.keys()];
  const wrap = el('div');

  const back = el('button', 'backlink', '← ' + doc.author);
  back.onclick = () => openAuthor(doc.authorId);
  wrap.appendChild(back);

  const head = el('div', 'reader-head');
  head.appendChild(el('div', 'rk', `${langName[doc.lang]} · ${doc.genre} · ${doc.epoch}`));
  const st = doc.titleState || 'assente';
  const h1 = el('h1', st !== 'it' ? 'antico' : null, doc.title);
  if (st !== 'it') h1.lang = doc.lang;
  head.appendChild(h1);
  if (doc.titleOrig && st === 'it') {
    const orig = el('div', 'rtitle-orig', doc.titleOrig);
    orig.lang = doc.lang;
    head.appendChild(orig);
  }
  const by = el('div', 'byline');
  const abtn = el('button', null, doc.author);
  abtn.onclick = () => openAuthor(doc.authorId);
  by.appendChild(abtn);
  head.appendChild(by);
  const src = el('div', 'src');
  src.innerHTML = `Fonte: <a href="https://scaife.perseus.org/library/${encodeURIComponent(doc.source.urn)}/" target="_blank" rel="noopener">${escapeHtml(doc.source.urn)}</a> · ${escapeHtml(doc.source.license)}`
    + (doc.source.edition ? `<br>Edizione: ${escapeHtml(doc.source.edition)}` : '');
  head.appendChild(src);
  wrap.appendChild(head);

  if (keys.length > 1) {
    const nav = el('div', 'book-nav');
    nav.appendChild(el('span', 'blabel', 'Libro'));
    for (const k of keys) {
      const b = el('button', null, k);
      if (k === bookKey) b.setAttribute('aria-current', 'true');
      b.onclick = () => { state.book = k; renderReader(doc, books, k); window.scrollTo({ top: 0, behavior: 'smooth' }); };
      nav.appendChild(b);
    }
    wrap.appendChild(nav);
  }

  const scroll = el('div', 'scroll');
  // La pagina dichiara lang="it": senza questo, uno screen reader legge l'Iliade
  // con la pronuncia italiana. Marca il ramo di lettura con la lingua vera.
  scroll.lang = doc.lang === 'grc' ? 'grc' : 'la';
  const units = books.get(bookKey);
  const byLoc = Object.create(null);
  for (const u of units) byLoc[u.loc] = u.t;

  /* Anche la lettura è INCREMENTALE: un libro di Livio sono migliaia di unità,
     e disegnarle tutte a ogni clic bloccava la pagina per secondi. Si disegna a
     blocchi; se si arriva da una ricerca, si disegna comunque fin dove sta il
     passo cercato, altrimenti non ci si potrebbe saltare. */
  const READ_CHUNK = 300;
  const sentinel = el('div', 'sentinel');
  const tail = el('div', 'moreline');
  const tailTxt = el('span');
  const tailBtn = el('button', 'btn-more', 'Mostra le altre');
  tail.appendChild(tailTxt); tail.appendChild(tailBtn);
  let drawn = 0;
  const drawUpTo = (n) => {
    const end = Math.min(n, units.length);
    if (end <= drawn) return;
    const frag = document.createDocumentFragment();
    for (let i = drawn; i < end; i++) frag.appendChild(renderUnit(doc, units[i]));
    scroll.insertBefore(frag, sentinel);
    drawn = end;
    const left = units.length - drawn;
    tailTxt.textContent = left ? `${nf.format(drawn)} di ${nf.format(units.length)}` : '';
    tailBtn.hidden = !left;
    tailBtn.textContent = left > READ_CHUNK ? `Mostra altre ${nf.format(READ_CHUNK)}` : 'Mostra le ultime';
  };
  tailBtn.onclick = () => drawUpTo(drawn + READ_CHUNK);
  scroll.appendChild(sentinel);
  const targetIdx = targetLoc ? units.findIndex(u => u.loc === targetLoc) : -1;
  drawUpTo(Math.max(READ_CHUNK, targetIdx >= 0 ? targetIdx + 30 : 0));

  // DELEGA (un solo handler per l'intero libro, non uno per parola/bottone):
  // doppio-click su una parola → dizionario; click sulle azioni copia/traduci.
  scroll.addEventListener('dblclick', () => {
    const w = (window.getSelection ? String(window.getSelection()) : '').trim();
    if (w && !/\s/.test(w)) toDictionary(w, doc.lang);
  });
  scroll.addEventListener('click', (e) => {
    const b = e.target.closest('button[data-act]'); if (!b) return;
    const unit = b.closest('.unit'); const t = unit && byLoc[unit.dataset.loc];
    if (!t) return;
    if (b.dataset.act === 'copy') navigator.clipboard.writeText(t).then(() => toast('Passo copiato'));
    else toTranslator(doc, unit.dataset.loc, t);
  });
  wrap.appendChild(scroll);
  wrap.appendChild(tail);
  $stage.innerHTML = ''; $stage.appendChild(wrap);

  if (readerIO) readerIO.disconnect();
  if (window.IntersectionObserver && drawn < units.length) {
    readerIO = new IntersectionObserver((ents) => {
      if (!ents.some(e => e.isIntersecting)) return;
      drawUpTo(drawn + READ_CHUNK);
      if (drawn >= units.length) readerIO.disconnect();
    }, { rootMargin: '600px' });
    readerIO.observe(sentinel);
  }

  if (targetLoc) {
    const node = scroll.querySelector(`[data-loc="${CSS.escape(targetLoc)}"]`);
    if (node) { node.scrollIntoView({ block: 'center' }); node.classList.add('flash'); }
  }
}

function renderUnit(doc, u) {
  const isVerse = doc.kind === 'versi';
  const unit = el('div', 'unit'); unit.dataset.loc = u.loc; unit.id = 'l' + u.loc.replace(/\./g, '-');
  if (isVerse) {
    unit.classList.add('verse');
    const n = lastSeg(u.loc);
    const showN = (parseInt(n, 10) % 5 === 0) || n === '1';
    unit.appendChild(el('span', 'ln', showN ? n : ''));
    unit.appendChild(el('span', 'vt', u.t));
  } else {
    unit.classList.add('para');
    unit.appendChild(el('span', 'loc', u.loc));
    unit.appendChild(el('span', 'txt', u.t));
  }
  unit.appendChild(buildActs());
  return unit;
}

function buildActs() {
  const acts = el('span', 'acts');
  const copy = el('button', null, 'copia'); copy.dataset.act = 'copy';
  const tr = el('button', null, '→ traduci'); tr.dataset.act = 'tr'; tr.title = 'Porta il passo nel Translator';
  acts.appendChild(copy); acts.appendChild(tr);
  return acts;
}

// ── Cuciture verso gli altri rami (URL-seam) ───────────────────────────────
/* Il passo viaggia COMPLETO della sua provenienza: il solo locus non basterebbe
   al Translator per riempire autore e opera, che qui abbiamo già in memoria.
   `tipo` distingue prosa e versi, così di là il brano nasce impaginato giusto. */
function toTranslator(doc, loc, text) {
  const q = new URLSearchParams({
    lang:   doc.lang,
    src:    `${doc.source.urn}:${loc}`,
    text:   text,
    autore: doc.author || '',
    opera:  doc.title || '',
    loc:    loc || '',
    tipo:   doc.kind === 'versi' ? 'poesia' : 'prosa',
  });
  window.open('translator.html?' + q.toString(), '_blank');
}
function toDictionary(word, lang) {
  const clean = word.replace(/[.,;:···!?'"«»()\[\]—–]/g, '').replace(/[·;]/g, '').trim();
  if (!clean) return;
  window.open(`dictionary.html?lang=${lang}&lemma=${encodeURIComponent(clean)}`, '_blank');
}

// ══════════════════════════════════════════════════════════════════════════
// RICERCA A DUE STADI
// ══════════════════════════════════════════════════════════════════════════
/* Stadio 1 — l'indice dice IN QUALI opere compare la forma cercata.
   Si cerca per PREFISSO dentro un solo spicchio, così «virtut» continua a
   trovare «virtute» come faceva la vecchia ricerca a scansione.
   Con più parole si intersecano gli insiemi partendo dalla più RARA: in
   «Gallia est omnis», «est» sta ovunque e «Gallia» in poche opere. */
const NO_INDEX = Symbol('indice non disponibile');
const NO_WORDS = Symbol('la ricerca non contiene parole');

async function candidateWorks(query) {
  // Tre esiti DISTINTI, perché meritano tre messaggi diversi: cercare «1.1» non
  // significa che l'indice sia rotto, e dirlo mentre i 67 spicchi sono integri
  // rende poi impossibile riconoscere il guasto vero.
  const toks = fold(query).split(/[^\p{L}]+/u).filter(Boolean);
  if (!toks.length) return NO_WORDS;
  const man = await loadManifest();
  if (!man) return NO_INDEX;

  const sets = [];
  for (const t of toks) {
    const shard = await loadShard(t[0]);
    if (!shard) return [];                     // spicchio assente = nessuna occorrenza
    const s = new Set();
    if (shard[t]) for (const wi of shard[t]) s.add(wi);
    for (const form in shard) {                // prefisso: virtut → virtute, virtutis…
      if (form.length > t.length && form.startsWith(t)) {
        for (const wi of shard[form]) s.add(wi);
      }
    }
    if (!s.size) return [];
    sets.push(s);
  }
  sets.sort((a, b) => a.size - b.size);        // si parte dalla parola più rara
  let acc = sets[0];
  for (let i = 1; i < sets.length; i++) {
    const next = new Set();
    for (const wi of acc) if (sets[i].has(wi)) next.add(wi);
    acc = next;
    if (!acc.size) break;
  }
  return [...acc].map(i => man.works[i]).filter(Boolean);
}

/* Ordine dei candidati: NON alfabetico.
   Quando l'indice restringe a più opere di quante se ne possano aprire, chi
   resta fuori dal taglio conta. In ordine alfabetico per autore, cercando
   «virtus» il primo risultato era Agostino e Cicerone rischiava di non entrare.
   Si mette davanti il canone scolastico — l'età classica per il greco, l'età
   di Cesare e Augusto per il latino — e in coda tarda antichità e cristiani.
   È una preferenza didattica dichiarata, non un giudizio di valore: la riga di
   stato dice sempre quante opere sono state escluse dal taglio. */
const CANON_RANK = {
  classica: 0, repubblicana: 0, augustea: 1, arcaica: 2,
  ellenistica: 3, imperiale: 4, tarda: 5,
};
function byCanon(a, b) {
  const ra = CANON_RANK[a.epoch] ?? 9, rb = CANON_RANK[b.epoch] ?? 9;
  if (ra !== rb) return ra - rb;
  return b.words - a.words;          // a parità d'epoca, prima le opere maggiori
}

let searchSeq = 0;
async function runSearch(raw) {
  const q = raw.trim();
  if (q.length < 2) { if (state.view === 'results') renderWelcome(); return; }
  const seq = ++searchSeq;
  state.view = 'results'; state.work = null;
  if (state.lang === 'la' || state.lang === 'grc') document.body.dataset.lang = state.lang;
  else document.body.removeAttribute('data-lang');

  // ── Stadio 0: catalogo (istantaneo, è già in memoria) ────────────────────
  const nq = fold(q);
  const catHits = state.index.works.filter(w => inBranch(w) &&
    (fold(w.title).includes(nq) || fold(w.author).includes(nq) ||
     (w.titleEn && fold(w.titleEn).includes(nq))));

  const wrap = el('div');
  const head = el('div', 'results-head');
  head.appendChild(el('h1', null, '“' + q + '”'));
  const countEl = el('span', 'count', 'cerco nei testi…');
  head.appendChild(countEl);
  wrap.appendChild(head);

  if (catHits.length) {
    wrap.appendChild(el('div', 'sect-lbl', `Opere e autori · ${catHits.length}`));
    const grid = el('div', 'catalog');
    for (const w of catHits.slice(0, 12)) grid.appendChild(workCard(w));
    wrap.appendChild(grid);
  }

  wrap.appendChild(el('div', 'sect-lbl', 'Passi nei testi'));
  const stageLine = el('div', 'stageline');
  const stageTxt = el('span', null, 'Consulto l’indice…');
  const prog = el('span', 'prog'); const progBar = el('i'); prog.appendChild(progBar);
  stageLine.appendChild(stageTxt); stageLine.appendChild(prog);
  wrap.appendChild(stageLine);
  const hits = el('div'); wrap.appendChild(hits);
  $stage.innerHTML = ''; $stage.appendChild(wrap);

  // ── Stadio 1: l'indice restringe il campo ────────────────────────────────
  let cand, netErr = null;
  try { cand = await candidateWorks(q); }
  catch (e) { netErr = e; cand = NO_INDEX; }
  if (seq !== searchSeq) return;

  if (cand === NO_WORDS || cand === NO_INDEX) {
    progBar.style.width = '100%';
    stageTxt.textContent = cand === NO_WORDS
      ? 'Questa ricerca non contiene parole da cercare nei testi: mostro solo il catalogo.'
      : (netErr ? 'Non ho potuto consultare l’indice (rete): riprova fra un istante.'
                : 'Indice di ricerca non disponibile: cerco solo nel catalogo.');
    countEl.textContent = catHits.length ? `${catHits.length} nel catalogo` : 'nessun risultato';
    if (!catHits.length) hits.appendChild(el('div', 'empty', 'Nessuna opera con questo nome.'));
    return;
  }

  let pool = cand.map(id => state.index.works.find(w => w.id === id)).filter(w => w && inBranch(w));
  pool.sort(byCanon);
  const total = pool.length;
  if (!total) {
    stageTxt.textContent = 'Nessuna opera contiene questa forma.';
    progBar.style.width = '100%';
    countEl.textContent = catHits.length ? `${catHits.length} nel catalogo · nessun passo` : 'nessun passo trovato';
    hits.appendChild(el('div', 'empty', 'Nessun passo contiene questa sequenza. Prova con una sola parola, o con la sua radice.'));
    return;
  }
  const capped = pool.slice(0, MAX_WORKS_SCAN);

  // ── Stadio 2: si aprono SOLO le opere candidate ──────────────────────────
  let found = 0, scanned = 0, stop = false;
  for (let i = 0; i < capped.length && !stop; i += 10) {
    const batch = capped.slice(i, i + 10);
    const docs = await Promise.all(batch.map(w => loadWork(w.id).catch(() => null)));
    if (seq !== searchSeq) return;
    for (const doc of docs) {
      scanned++;
      if (!doc) continue;
      // Due velocità: la normalizzazione RAPIDA (intera stringa) decide se
      // l'unità contiene la sequenza; la mappa posizionale — cara, e sul greco
      // senza scorciatoie ASCII — si costruisce solo per le poche unità che un
      // riscontro ce l'hanno davvero. Prima si pagava su tutte.
      if (!doc._fold) doc._fold = doc.units.map(u => fold(u.t));
      for (let ui = 0; ui < doc.units.length; ui++) {
        if (doc._fold[ui].indexOf(nq) < 0) continue;
        const u = doc.units[ui];
        const fm = foldMap(u.t);
        const at = fm.norm.indexOf(nq);
        if (at < 0) continue;
        const os = fm.map[at];
        const oe = fm.map[Math.min(at + nq.length - 1, fm.map.length - 1)] + 1;
        hits.appendChild(hitRow(doc, u, os, oe));
        found++;
        if (found >= MAX_HITS) { stop = true; break; }
      }
      if (stop) break;
    }
    progBar.style.width = Math.round(100 * scanned / capped.length) + '%';
    stageTxt.innerHTML = `L’indice ha ristretto a <b>${nf.format(total)}</b> oper${total === 1 ? 'a' : 'e'} · aperte <b>${nf.format(Math.min(scanned, capped.length))}</b> · <b>${nf.format(found)}</b> passi`;
    countEl.textContent = `${nf.format(found)}${stop ? '+' : ''} pass${found === 1 ? 'o' : 'i'}`;
  }

  if (!found) {
    hits.appendChild(el('div', 'empty', 'La forma esiste nel corpus, ma non come sequenza esatta in questi passi.'));
  }
  if (total > capped.length) {
    hits.appendChild(el('div', 'moreline',
      `Mostrate le prime ${nf.format(capped.length)} opere di ${nf.format(total)}: restringi con una parola più rara o una radice più lunga.`));
  } else if (stop) {
    hits.appendChild(el('div', 'moreline', `Fermato a ${MAX_HITS} passi: la forma è molto frequente.`));
  }
}

function hitRow(doc, u, os, oe) {
  const btn = el('button', `res ${doc.lang}`);
  const ref = el('div', 'rref');
  // niente opacity sul locus: attenuava un testo già tenue fino a 3:1
  ref.innerHTML = `<b>${escapeHtml(doc.author)}</b> · ${escapeHtml(doc.title)} <span class="loc">${escapeHtml(u.loc)}</span>`;
  btn.appendChild(ref);
  const txt = el('div', 'rtext'); txt.lang = doc.lang === 'grc' ? 'grc' : 'la';
  txt.innerHTML = snip(u.t, os, oe);
  btn.appendChild(txt);
  btn.onclick = () => openWork(doc.id, u.loc);
  return btn;
}

// estrae un frammento centrato sul match, con la porzione evidenziata
function snip(text, os, oe, ctx = 90) {
  const a = Math.max(0, os - ctx), b = Math.min(text.length, oe + ctx);
  const pre = (a > 0 ? '… ' : '') + text.slice(a, os);
  const hit = text.slice(os, oe);
  const post = text.slice(oe, b) + (b < text.length ? ' …' : '');
  return escapeHtml(pre) + '<mark>' + escapeHtml(hit) + '</mark>' + escapeHtml(post);
}

// ══════════════════════════════════════════════════════════════════════════
// RICONOSCIMENTO DI UN BRANO
// ══════════════════════════════════════════════════════════════════════════
/* Data una versione — ritrascritta, fotocopiata, magari presa da un'edizione
   diversa — si cerca da dove viene. La corrispondenza esatta quasi mai esiste,
   quindi la risposta non è «trovato / non trovato» ma QUANTA parte del brano si
   ritrova, e su quale intervallo di loci.

   Il peso di ogni parola è il suo `idf`, ricavato dall'indice: una forma che
   compare in poche opere vale molto, una che compare ovunque vale quasi nulla.
   In un passo di Cesare «et» ed «est» sono rumore, «Helvetii» e «Garumna» sono
   un'impronta digitale. */

const RECOG_WORKS = 10;      // opere aperte per il confronto ravvicinato
const RECOG_MIN_TOKENS = 4;

function tokenize(text) {
  return fold(text).split(/[^\p{L}]+/u).filter(t => t.length > 1);
}

async function recognize(text, onProgress) {
  const toks = tokenize(text);
  if (toks.length < RECOG_MIN_TOKENS) return { error: 'troppo-corto' };
  const man = await loadManifest();
  if (!man) return { error: 'indice' };

  // 1 · peso di ogni forma distinta (idf dalla lunghezza delle sue postings)
  const uniq = [...new Set(toks)];
  const weight = new Map(), postings = new Map();
  const N = man.works.length;
  for (const t of uniq) {
    const shard = await loadShard(t[0]).catch(() => null);
    const post = shard && shard[t];
    if (!post || !post.length) continue;             // forma assente dal corpus
    postings.set(t, post);
    weight.set(t, Math.log(N / post.length) + 0.25);
  }
  if (!weight.size) return { error: 'nessuna-forma' };
  const totalW = toks.reduce((s, t) => s + (weight.get(t) || 0), 0);
  if (!totalW) return { error: 'nessuna-forma' };

  // 2 · quali opere valgono la pena di essere aperte
  const perWork = new Map();
  for (const [t, post] of postings) {
    const w = weight.get(t);
    for (const wi of post) perWork.set(wi, (perWork.get(wi) || 0) + w);
  }
  const shortlist = [...perWork.entries()]
    .sort((a, b) => b[1] - a[1]).slice(0, RECOG_WORKS)
    .map(([wi]) => man.works[wi])
    .map(id => state.index.works.find(w => w.id === id))
    .filter(w => w && inBranch(w));
  if (!shortlist.length) return { error: 'nessuna-opera' };

  // 3 · dentro ogni opera, la finestra di unità che copre meglio il brano
  const wanted = new Set(uniq.filter(t => weight.has(t)));
  const out = [];
  for (let i = 0; i < shortlist.length; i++) {
    if (onProgress) onProgress(i, shortlist.length);
    const doc = await loadWork(shortlist[i].id).catch(() => null);
    if (!doc) continue;
    const best = bestWindow(doc, wanted, weight, totalW);
    if (best && best.score > 0.08) out.push({ doc, ...best });
  }
  /* A PARITÀ di riconoscimento vince l'autore più antico. Non è un vezzo: un
     brano famoso lo contiene sia chi l'ha scritto sia chi lo cita — l'incipit
     dell'Iliade sta al 100% in Omero e al 100% in Dione Crisostomo, che lo
     riporta. Chi cerca la provenienza di una versione vuole la fonte, non il
     testimone; e le due letture restano comunque entrambe in elenco. */
  out.sort((a, b) => (b.score - a.score) ||
    ((CANON_RANK[a.doc.epoch] ?? 9) - (CANON_RANK[b.doc.epoch] ?? 9)));
  return { matches: out.slice(0, 6), totalW, wanted };
}

/* La finestra migliore: si valuta ogni unità, si parte dalla più ricca e si
   allarga finché le unità vicine continuano a portare parole del brano. Senza
   questo, una versione che occupa cinque capitoli verrebbe attribuita a uno solo. */
function bestWindow(doc, wanted, weight, totalW) {
  // La scomposizione in parole di un'opera si fa UNA VOLTA e resta attaccata al
  // documento: un secondo riconoscimento sulle stesse opere candidate non la
  // rifà da capo.
  if (!doc._toks) doc._toks = doc.units.map(u => tokenize(u.t));
  const hits = doc._toks.map(list => {
    const found = new Set();
    for (const t of list) if (wanted.has(t)) found.add(t);
    let w = 0; for (const t of found) w += weight.get(t);
    return { found, w };
  });
  let seed = 0;
  for (let i = 1; i < hits.length; i++) if (hits[i].w > hits[seed].w) seed = i;
  if (!hits.length || hits[seed].w === 0) return null;

  let lo = seed, hi = seed;
  const acc = new Set(hits[seed].found);
  const MAX_SPAN = 60;
  for (let step = 0; step < MAX_SPAN; step++) {
    const before = lo > 0 ? countNew(hits[lo - 1].found, acc, weight) : -1;
    const after = hi < hits.length - 1 ? countNew(hits[hi + 1].found, acc, weight) : -1;
    if (before <= 0 && after <= 0) break;
    if (before >= after) { lo--; for (const t of hits[lo].found) acc.add(t); }
    else { hi++; for (const t of hits[hi].found) acc.add(t); }
  }
  let matched = 0; for (const t of acc) matched += weight.get(t);
  return {
    score: matched / totalW,
    from: doc.units[lo].loc, to: doc.units[hi].loc,
    lo, hi, units: hi - lo + 1,
    snippet: doc.units[lo].t,
    hitTokens: acc,
  };
}
function countNew(found, acc, weight) {
  let w = 0; for (const t of found) if (!acc.has(t)) w += weight.get(t);
  return w;
}

function renderRecognizeView(preset) {
  state.view = 'recognize'; state.work = null; state.author = null;
  if (state.lang === 'la' || state.lang === 'grc') document.body.dataset.lang = state.lang;
  const wrap = el('div');
  const head = el('div', 'recog-head');
  head.appendChild(el('h1', null, 'Da dove viene questo brano?'));
  head.appendChild(el('p', null, 'Incolla una versione — anche ritrascritta, anche da un’edizione diversa — e la confronto con tutto il corpus. Ti dico l’autore, l’opera, i loci e quanta parte del brano ho ritrovato.'));
  wrap.appendChild(head);

  const ta = el('textarea'); ta.id = 'brano';
  ta.placeholder = 'Gallia est omnis divisa in partes tres…';
  ta.setAttribute('aria-label', 'Il brano da riconoscere');
  if (preset) ta.value = preset;
  wrap.appendChild(ta);

  const bar = el('div', 'recog-bar');
  const go = el('button', 'btn-primary', 'Riconosci il brano');
  const note = el('span', 'recog-note', 'Bastano una decina di parole; più ne dai, più il riconoscimento è sicuro.');
  bar.appendChild(go); bar.appendChild(note);
  wrap.appendChild(bar);

  const res = el('div'); res.id = 'recogres';
  wrap.appendChild(res);

  go.onclick = () => runRecognize(ta.value, go, note, res);
  ta.addEventListener('keydown', (e) => {
    if ((e.metaKey || e.ctrlKey) && e.key === 'Enter') go.click();
  });

  $stage.innerHTML = ''; $stage.appendChild(wrap);
  ta.focus();
  if (preset) go.click();
}

async function runRecognize(text, go, note, res) {
  go.disabled = true;
  note.textContent = 'Consulto l’indice…';
  res.innerHTML = '';
  let r;
  try {
    r = await recognize(text, (i, n) => { note.textContent = `Confronto con le opere candidate… ${i + 1} di ${n}`; });
  } catch (e) {
    r = { error: 'rete' };
  }
  go.disabled = false;

  const msg = {
    'troppo-corto': 'Servono almeno quattro parole per tentare un riconoscimento.',
    'indice': 'L’indice non è raggiungibile in questo momento: riprova fra un istante.',
    'nessuna-forma': 'Nessuna di queste parole compare nel corpus: controlla la lingua del brano.',
    'nessuna-opera': 'Nessuna opera del ramo scelto contiene queste parole.',
    'rete': 'Qualcosa è andato storto nella lettura dei dati: riprova.',
  };
  if (r.error) {
    note.textContent = '';
    res.appendChild(el('div', 'empty', msg[r.error] || 'Riconoscimento non riuscito.'));
    return;
  }
  if (!r.matches.length) {
    note.textContent = '';
    res.appendChild(el('div', 'empty', 'Non ho trovato un passo che corrisponda. Può essere un autore fuori dal corpus, oppure un testo troppo rimaneggiato.'));
    return;
  }
  note.textContent = 'Le corrispondenze migliori, dalla più probabile.';
  r.matches.forEach((m, i) => res.appendChild(matchCard(m, i === 0)));
}

function matchCard(m, isTop) {
  const pct = Math.round(m.score * 100);
  const card = el('button', `match ${m.doc.lang}${isTop ? ' top' : ''}`);
  const top = el('div', 'match-top');
  const s = el('div', 'score', String(pct));
  s.appendChild(el('small', null, '%'));
  top.appendChild(s);
  const who = el('div');
  who.appendChild(el('div', 'match-who', m.doc.author));
  const t = el('div', 'match-snip', m.doc.title);
  t.style.margin = '2px 0 0'; t.lang = m.doc.lang === 'grc' ? 'grc' : 'la';
  who.appendChild(t);
  top.appendChild(who);
  top.appendChild(el('div', 'match-loc', m.from === m.to ? m.from : `${m.from} – ${m.to}`));
  card.appendChild(top);

  const meter = el('div', 'meter'); const fill = el('i');
  fill.style.width = Math.max(3, pct) + '%'; meter.appendChild(fill);
  card.appendChild(meter);

  const snip = el('div', 'match-snip', m.snippet.slice(0, 220) + (m.snippet.length > 220 ? ' …' : ''));
  snip.lang = m.doc.lang === 'grc' ? 'grc' : 'la';
  card.appendChild(snip);

  card.appendChild(el('div', 'match-why',
    `${m.units} unit${m.units === 1 ? 'à' : 'à'} · ${m.hitTokens.size} parole del brano ritrovate · ${pct >= 60 ? 'corrispondenza forte' : pct >= 30 ? 'corrispondenza parziale' : 'indizio debole'}`));

  card.onclick = () => openWork(m.doc.id, m.from);
  return card;
}

// ── Controlli ──────────────────────────────────────────────────────────────
let debTimer;
document.getElementById('q').addEventListener('input', (e) => {
  clearTimeout(debTimer);
  const v = e.target.value;
  debTimer = setTimeout(() => runSearch(v), 260);
});
let afTimer;
document.getElementById('authorfilter').addEventListener('input', (e) => {
  clearTimeout(afTimer);
  const v = e.target.value;
  afTimer = setTimeout(() => renderAuthors(v), 140);
});
document.getElementById('mobtoggle').onclick = (e) => {
  const b = document.getElementById('browser'); const open = b.classList.toggle('open');
  e.currentTarget.setAttribute('aria-expanded', String(open));
};

/* L'aggancio della colonna autori si MISURA, non si indovina: era scritto a mano
   a 132 px mentre la testata ne occupa 158, e in quella fessura il testo scorreva
   sotto la barra di ricerca. Si ricalcola anche al ridimensionamento, perché
   l'altezza cambia quando il suggerimento va a capo. */
function syncHeadHeight() {
  const bottom = document.querySelector('.searchwrap').getBoundingClientRect().bottom
               + window.scrollY;
  document.documentElement.style.setProperty('--head-h', Math.round(bottom) + 'px');
}
addEventListener('resize', syncHeadHeight);
syncHeadHeight();

document.getElementById('openrecog').onclick = () => {
  document.getElementById('q').value = '';
  renderRecognizeView();
};

// ── Avvio ──────────────────────────────────────────────────────────────────
(async function init() {
  try {
    await loadIndex();
    // Cucitura dalla pagina-lingua (?lang=la|grc): il ramo è già scelto a monte,
    // quindi il corpus entra direttamente in quella lingua (niente filtro interno).
    const p = new URLSearchParams(location.search);
    const ul = (p.get('lang') || '').toLowerCase();
    const branch = (ul === 'la' || ul === 'latino') ? 'la' : (ul === 'grc' || ul === 'greco') ? 'grc' : null;
    if (branch) state.lang = branch;
    const work = p.get('opera') || p.get('work');
    // Cucitura d'ingresso per il RICONOSCIMENTO: ?riconosci=<testo> apre il
    // brano già incollato e avvia il confronto. È il ponte che il Translator
    // userà per chiedere «da dove viene la versione su cui sto lavorando?».
    const brano = p.get('riconosci') || p.get('text');
    if (brano && p.has('riconosci')) {
      renderAuthors('');
      renderRecognizeView(brano);
    } else if (work && state.index.works.some(w => w.id === work)) {
      renderAuthors('');
      await openWork(work, p.get('loc') || undefined);
    } else {
      renderWelcome();
    }
    loadManifest();                         // si scalda l'indice senza bloccare
  } catch (err) {
    $stage.innerHTML = `<div class="empty">Non riesco a caricare il catalogo del corpus.<br><small>${escapeHtml(String(err))}</small><br><br>Apri la pagina tramite un server locale (es. <code>python -m http.server</code>): i <code>fetch</code> dei dati non funzionano da <code>file://</code>.</div>`;
    console.error(err);
  }
})();
</script>
