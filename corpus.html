/* I nomi estesi arrivano dai dati con il grassetto marcato a doppi asterischi.
   Si passa da HTML e non da textContent, quindi il testo va prima neutralizzato:
   la sorgente è nostra, ma una tabella di dati non deve MAI poter iniettare
   markup — è la sola regola che rende sicuro un innerHTML. */
function grassetta(s) {
  const esc = String(s).replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));
  return esc.replace(/\*\*(.+?)\*\*/g, '<b>$1</b>');
}

function labelFor(axis, k) {
  if (axis === 'lang') return LANG_LABEL[k] || k;
  if (axis === 'authorId') {
    const a = state.index.authors.find(x => x.id === k);
    return a ? a.name : k;
  }
  return k.charAt(0).toUpperCase() + k.slice(1);
}
function langOfAuthor(id) {
  const a = state.index.authors.find(x => x.id === id);
  return a ? a.lang : null;
}

// ══════════════════════════════════════════════════════════════════════════
// SFOGLIO RAMIFICATO — letteratura › epoca › autore › opere
// ══════════════════════════════════════════════════════════════════════════
/* La ramificazione segue il modo in cui la letteratura si insegna, non
   l'ordine alfabetico di un archivio: prima la lingua, poi il tempo, poi
   l'autore, infine le opere. Chi arriva da una card di categoria salta
   direttamente all'elenco filtrato: è la stessa vista con un contesto diverso. */
function openBrowse(ctx) {
  state.browse = Object.assign({ lang: null, epoch: null, author: null, genre: null }, ctx);
  if (state.lang !== 'all') state.browse.lang = state.lang;   // ramo deciso a monte
  state.view = 'browse'; segnaVistaCorpus();
  closeMobileBrowser();
  renderBrowse();
  window.scrollTo({ top: 0 });
}

function browsePool() {
  const b = state.browse;
  return state.index.works.filter(w => inBranch(w) &&
    (!b.lang || w.lang === b.lang) &&
    (!b.epoch || w.epoch === b.epoch) &&
    (!b.author || w.authorId === b.author) &&
    (!b.genre || w.genre === b.genre));
}

function renderBrowse() {
  const b = state.browse;
  document.body.dataset.lang = b.lang || (state.lang !== 'all' ? state.lang : '');
  if (!b.lang && state.lang === 'all') document.body.removeAttribute('data-lang');

  const wrap = el('div');
  wrap.appendChild(buildCrumb());

  // livello raggiunto: le opere si mostrano quando il campo è ristretto davvero
  const mostraOpere = !!(b.author || b.genre);
  let daDisegnare = null;
  if (mostraOpere) daDisegnare = renderLivelloOpere(wrap);
  else if (!b.lang) renderLivelloLetterature(wrap);
  else if (!b.epoch) renderLivelloEpoche(wrap);
  else renderLivelloAutori(wrap);

  $stage.innerHTML = ''; $stage.appendChild(wrap);
  if (daDisegnare) paintWorks(daDisegnare);      // ora `#worklist` è nel documento
  renderAuthors(document.getElementById('authorfilter').value);
}

function buildCrumb() {
  const b = state.browse;
  const c = el('div', 'crumb');
  const passo = (testo, azione, corrente) => {
    if (corrente) { c.appendChild(el('span', 'cur', testo)); return; }
    const btn = el('button', null, testo); btn.onclick = azione; c.appendChild(btn);
    c.appendChild(el('span', 'sep', '›'));
  };
  passo('Catalogo', () => openBrowse({}), !b.lang && !b.genre);
  if (b.genre) passo(labelFor('genre', b.genre), null, true);
  if (b.lang) {
    passo(b.lang === 'la' ? 'Latina' : 'Greca', () => openBrowse({ lang: b.lang }), !b.epoch && !b.author);
    if (b.epoch) passo(labelFor('epoch', b.epoch),
      () => openBrowse({ lang: b.lang, epoch: b.epoch }), !b.author);
    if (b.author) passo(labelFor('authorId', b.author), null, true);
  }
  const n = browsePool().length;
  c.appendChild(el('span', 'cnt', `${nf.format(n)} oper${n === 1 ? 'a' : 'e'}`));
  return c;
}

function renderLivelloLetterature(wrap) {
  const h = el('div', 'band-h'); h.appendChild(el('span', null, 'Scegli la letteratura'));
  wrap.appendChild(h);
  const grid = el('div', 'lits');
  for (const lg of ['la', 'grc']) {
    const ws = state.index.works.filter(w => w.lang === lg);
    if (!ws.length) continue;
    const card = el('button', `lit ${lg}`);
    card.appendChild(el('div', 'ln', lg === 'la' ? 'Letteratura latina' : 'Letteratura greca'));
    const o = el('div', 'lo', lg === 'la' ? 'Litterae Latinae' : 'Ἑλληνικὰ γράμματα');
    o.lang = lg; card.appendChild(o);
    card.appendChild(el('div', 'lc',
      `${nf.format(ws.length)} opere · ${nf.format(new Set(ws.map(w => w.authorId)).size)} autori`));
    const ep = el('div', 'le');
    const viste = [...new Set(ws.map(w => w.epoch))].sort((a, c) => (EPOCH_ORDER[a] ?? 9) - (EPOCH_ORDER[c] ?? 9));
    for (const e of viste) ep.appendChild(el('span', null, e));
    card.appendChild(ep);
    card.onclick = () => openBrowse({ lang: lg });
    grid.appendChild(card);
  }
  wrap.appendChild(grid);
}

function renderLivelloEpoche(wrap) {
  const b = state.browse;
  const h = el('div', 'band-h'); h.appendChild(el('span', null, "Scegli l'epoca"));
  const tutte = el('button', 'more', 'tutte le opere di questa letteratura →');
  tutte.onclick = () => openBrowse({ lang: b.lang, genre: null, author: '*' });
  wrap.appendChild(h);

  const pool = state.index.works.filter(w => inBranch(w) && w.lang === b.lang);
  const tally = {};
  for (const w of pool) tally[w.epoch] = (tally[w.epoch] || 0) + 1;
  /* Ordine CRONOLOGICO, non per numerosità: un asse del tempo si legge dal
     principio, e «imperiale» in testa solo perché è la più ricca disorienta. */
  const voci = Object.entries(tally).sort((a, c) => (EPOCH_ORDER[a[0]] ?? 9) - (EPOCH_ORDER[c[0]] ?? 9));
  const max = Math.max(...voci.map(v => v[1]), 1);

  const grid = el('div', 'epochs');
  for (const [k, n] of voci) {
    const c = el('button', 'ep');
    c.appendChild(el('div', 'ew', EPOCH_WHEN[k] || ''));
    c.appendChild(el('div', 'en', labelFor('epoch', k)));
    /* La didascalia porta il contesto: senza, «ellenistica» è solo un'etichetta.
       Va in HTML perché contiene corsivi e qualche parola in lingua originale. */
    const nota = (EPOCA_NOTA[b.lang] || {})[k];
    if (nota) { const d = el('div', 'ed'); d.innerHTML = nota; c.appendChild(d); }
    c.appendChild(el('div', 'ec', `${nf.format(n)} oper${n === 1 ? 'a' : 'e'}`));
    const bar = el('div', 'eb'); const i = el('i');
    i.style.width = Math.round(100 * n / max) + '%'; bar.appendChild(i);
    c.appendChild(bar);
    c.onclick = () => openBrowse({ lang: b.lang, epoch: k });
    grid.appendChild(c);
  }
  wrap.appendChild(grid);
}

function renderLivelloAutori(wrap) {
  const b = state.browse;
  const pool = browsePool();
  const mappa = new Map();
  for (const w of pool) {
    if (!mappa.has(w.authorId)) {
      const a = state.index.authors.find(x => x.id === w.authorId);
      mappa.set(w.authorId, {
        id: w.authorId, name: w.author, n: 0,
        year: a ? a.year : 9999, full: a ? a.full : null,
      });
    }
    mappa.get(w.authorId).n++;
  }
  /* CRONOLOGICO di default: dentro un'epoca gli autori si affrontano per tempo,
     non per alfabeto — Erodoto prima di Demostene, e nessuna lista alfabetica lo
     direbbe. L'alfabetico resta a un clic, perché serve quando il nome si sa già. */
  const autori = [...mappa.values()].sort(state.autOrd === 'alfa'
    ? (a, c) => a.name.localeCompare(c.name, 'it')
    : (a, c) => (a.year - c.year) || a.name.localeCompare(c.name, 'it'));

  const h = el('div', 'band-h');
  h.appendChild(el('span', null, `Scegli l'autore · ${autori.length}`));
  wrap.appendChild(h);

  const bar = el('div', 'sortbar');
  bar.appendChild(el('span', 'sl', 'Ordina'));
  for (const [k, lab, tip] of [
    ['crono', 'Cronologico', 'Nell’ordine in cui gli autori si affrontano: per tempo'],
    ['alfa', 'Alfabetico', 'Per nome, quando l’autore lo si sa già'],
  ]) {
    const btn = el('button', null, lab);
    btn.title = tip;
    btn.setAttribute('aria-pressed', String(state.autOrd === k));
    btn.onclick = () => { state.autOrd = k; state.alpha = null; renderBrowse(); };
    bar.appendChild(btn);
  }
  wrap.appendChild(bar);

  /* La striscia delle iniziali compare SOLO in ordine alfabetico: su una lista
     cronologica salterebbe avanti e indietro nel tempo a ogni lettera. */
  if (state.autOrd === 'alfa') {
    const presenti = new Set(autori.map(a => (a.name[0] || '').toUpperCase()));
    const strip = el('div', 'alpha');
    for (const L of 'ABCDEFGHILMNOPQRSTUVZ') {
      const btn = el('button', null, L);
      btn.disabled = !presenti.has(L);
      btn.setAttribute('aria-pressed', String(state.alpha === L));
      btn.onclick = () => { state.alpha = (state.alpha === L ? null : L); renderBrowse(); };
      strip.appendChild(btn);
    }
    wrap.appendChild(strip);
  }

  const grid = el('div', 'auths');
  for (const a of autori) {
    if (state.alpha && (a.name[0] || '').toUpperCase() !== state.alpha) continue;
    const btn = el('button', 'auth');
    const riga = el('div', 'ar');
    riga.appendChild(el('span', 'an', a.name));
    riga.appendChild(el('span', 'ac', a.n));
    btn.appendChild(riga);
    /* Il nome per esteso, con in evidenza l'elemento con cui l'autore si chiama
       davvero: «Publius <b>Vergilius</b> Maro». Ricorda che i romani hanno tre
       nomi senza far perdere di vista quale dei tre è quello d'uso. Manca per
       raccolte e pseudo-autori, e allora la riga non compare. */
    if (a.full) {
      const f = el('div', 'af');
      f.innerHTML = grassetta(a.full);
      f.lang = (b.lang === 'grc' && /[Ͱ-Ͽἀ-῿]/.test(a.full)) ? 'grc' : 'la';
      btn.appendChild(f);
    }
    btn.onclick = () => openBrowse({ lang: b.lang, epoch: b.epoch, author: a.id });
    grid.appendChild(btn);
  }
  wrap.appendChild(grid);
}

/* Ordinamenti delle opere.
   A lungo qui c'è stato solo l'ordine TRADIZIONALE — la successione in cui il
   catalogo della fonte dispone le opere di un autore — e la nota diceva che
   «cronologico» non si poteva chiamare, perché per gli antichi la data della
   singola opera è quasi sempre una ricostruzione discussa e non un dato.
   Resta vero. La differenza è che ora le date ci sono per il canone liceale,
   curate una per una e ciascuna con dichiarato COME la si conosce: documentata
   («certa»), convergenza della critica («circa»), oppure semplice posto in una
   successione relativa («fase»). Su quella base l'ordine cronologico si può
   offrire senza promettere nulla di falso — e infatti la scheda mostra l'anno
   solo quando è dell'uno o dell'altro dei primi due tipi. */
const perId = (a, b) => a.id.localeCompare(b.id, 'en', { numeric: true });
const SORTS = {
  /* Cronologico · c'è solo dove le date sono state curate a mano (canone
     liceale). Le opere senza data finiscono in coda nell'ordine tradizionale,
     invece di essere sparpagliate a caso da un anno inventato. */
  crono: { label: 'Cronologico', cmp: (a, b) => (a.year ?? 9e4) - (b.year ?? 9e4) || perId(a, b) },
  trad:  { label: 'Tradizionale', cmp: perId },
  alfa:  { label: 'Alfabetico',   cmp: (a, b) => a.title.localeCompare(b.title, 'it') },
  ampio: { label: 'Per ampiezza', cmp: (a, b) => b.words - a.words },
};

/* Quante opere del gruppo hanno una data curata, e di che tipo. Serve a due
   cose: decidere se offrire l'ordine cronologico, e dichiarare al lettore su
   che cosa si regge l'ordine che sta guardando. */
function censimentoDate(pool) {
  const c = { tot: pool.length, datate: 0, certa: 0, circa: 0, fase: 0 };
  for (const w of pool) {
    if (w.year == null) continue;
    c.datate++; c[w.yearKind || 'circa']++;
  }
  return c;
}

/* L'ordine di default è una scelta, non un ripiego: se le date ci sono per la
   maggioranza del gruppo, il tempo è il criterio giusto — è quello con cui un
   autore si studia. Sotto la metà si torna alla successione tradizionale, che
   almeno non finge un ordine che i dati non reggono. */
function ordineDefault(pool) {
  const c = censimentoDate(pool);
  return (c.datate && c.datate * 2 >= c.tot) ? 'crono' : 'trad';
}

function renderLivelloOpere(wrap) {
  const b = state.browse;
  const pool = browsePool();

  const censo = censimentoDate(pool);
  /* L'ordine attivo si ricalcola sul gruppo che si sta guardando: passando da
     un autore datato a uno senza date, tenere «cronologico» lascerebbe una
     lista in ordine casuale sotto un'etichetta che promette il tempo. */
  const attivo = (state.sort && (state.sort !== 'crono' || censo.datate)) ? state.sort : ordineDefault(pool);

  const bar = el('div', 'sortbar');
  bar.appendChild(el('span', 'sl', 'Ordina'));
  for (const [k, s] of Object.entries(SORTS)) {
    if (k === 'crono' && !censo.datate) continue;   // niente date, niente bottone
    const btn = el('button', null, s.label);
    btn.setAttribute('aria-pressed', String(attivo === k));
    if (k === 'trad') btn.title = "Ordine in cui la tradizione dispone le opere dell'autore";
    if (k === 'crono') btn.title = 'Per data di composizione, dove è stata curata a mano';
    btn.onclick = () => { state.sort = k; renderBrowse(); };
    bar.appendChild(btn);
  }
  wrap.appendChild(bar);

  /* Su che cosa si regge l'ordine · un ordinamento cronologico parziale che
     non dichiara la propria parzialità si legge come completo, e mente. Qui si
     dice quante opere hanno una data e quante sono soltanto collocate. */
  if (attivo === 'crono') {
    const parti = [];
    const pl = (n, una, molte) => `${n} ${n === 1 ? una : molte}`;
    if (censo.certa) parti.push(pl(censo.certa, 'con data documentata', 'con data documentata'));
    if (censo.circa) parti.push(pl(censo.circa, 'per convergenza della critica', 'per convergenza della critica'));
    if (censo.fase) parti.push(pl(censo.fase, 'collocata per fase, senza data', 'collocate per fase, senza data'));
    const senza = censo.tot - censo.datate;
    if (senza) parti.push(pl(senza, 'non databile, in coda', 'non databili, in coda'));
    const nota = el('div', 'sortnote', parti.join(' · '));
    wrap.appendChild(nota);
  }

  const list = el('div'); list.id = 'worklist';
  wrap.appendChild(list);

  /* Separatori di GENERE · valgono solo dentro l'opera omnia di UN autore che
     ne abbia scritti più d'uno. Seneca è il caso limite: filosofia, tragedie,
     satira ed epistolario in un elenco unico si mescolano senza che si capisca
     dove finisce il filosofo e comincia il tragediografo. Su un catalogo di più
     autori la stessa riga sarebbe rumore, e infatti non compare.
     I generi vanno in ordine di consistenza — quello in cui l'autore ha lasciato
     di più apre l'elenco — e dentro ciascuno resta l'ordine scelto qui sopra. */
  const generi = [...new Set(pool.map(w => w.genre))];
  const unAutore = b.author && b.author !== '*';
  state.perGenere = Boolean(unAutore && generi.length > 1);

  const cmp = SORTS[attivo].cmp;
  if (!state.perGenere) return pool.slice().sort(cmp);

  const peso = {};
  for (const w of pool) peso[w.genre] = (peso[w.genre] || 0) + 1;
  const rango = Object.fromEntries(
    generi.sort((g, h) => (peso[h] - peso[g]) || g.localeCompare(h, 'it')).map((g, i) => [g, i]));
  return pool.slice().sort((a, c) => (rango[a.genre] - rango[c.genre]) || cmp(a, c));
}

// Disegno INCREMENTALE: oltre mille schede in un colpo sono migliaia di nodi. Si
// disegna a blocchi e si prosegue quando la sentinella entra nel viewport.
let catalogIO = null;
function paintWorks(list) {
  const host = document.getElementById('worklist');
  if (!host) return;
  host.innerHTML = '';
  state.filtered = list || state.index.works.filter(inBranch);
  state.shown = 0;

  const grid = el('div', 'catalog'); grid.id = 'catgrid';
  host.appendChild(grid);
  const more = el('div', 'moreline'); more.id = 'moreline';
  const moreTxt = el('span'); moreTxt.id = 'moretxt';
  const moreBtn = el('button', 'btn-more', 'Mostra le altre'); moreBtn.id = 'morebtn';
  moreBtn.onclick = () => appendChunk();
  more.appendChild(moreTxt); more.appendChild(moreBtn);
  host.appendChild(more);
  appendChunk();

  const sentinel = el('div', 'sentinel'); host.appendChild(sentinel);
  if (window.IntersectionObserver) {
    // Si disconnette quello precedente: ogni cambio di faccetta ridisegna il
    // catalogo, e senza questo restavano appesi tanti osservatori quante erano
    // state le selezioni, tutti a spiare sentinelle ormai staccate dal documento.
    if (catalogIO) catalogIO.disconnect();
    catalogIO = new IntersectionObserver((ents) => {
      if (ents.some(e => e.isIntersecting)) {
        if (state.shown >= state.filtered.length) { catalogIO.disconnect(); return; }
        appendChunk();
      }
    }, { rootMargin: '400px' });
    catalogIO.observe(sentinel);
  }
}

function appendChunk() {
  const grid = document.getElementById('catgrid');
  if (!grid) return;
  const slice = state.filtered.slice(state.shown, state.shown + PAGE);
  const frag = document.createDocumentFragment();
  /* Il genere dell'ultima scheda già disegnata: il confronto deve reggere anche
     fra un blocco e il successivo, non solo dentro lo stesso. */
  let genere = state.shown ? state.filtered[state.shown - 1].genre : null;
  for (const w of slice) {
    if (state.perGenere && w.genre !== genere) {
      const sep = el('div', 'gsep');
      sep.appendChild(el('span', null, labelFor('genre', w.genre)));
      frag.appendChild(sep);
      genere = w.genre;
    }
    frag.appendChild(workCard(w));
  }
  grid.appendChild(frag);
  state.shown += slice.length;
  const txt = document.getElementById('moretxt');
  const btn = document.getElementById('morebtn');
  if (txt && btn) {
    const left = state.filtered.length - state.shown;
    txt.textContent = left ? `${nf.format(state.shown)} di ${nf.format(state.filtered.length)}` : '';
    btn.hidden = !left;
    btn.textContent = left > PAGE ? `Mostra altre ${PAGE}` : 'Mostra le ultime';
  }
}

/* Tre stati, tre rese (contratto in _build/corpus_titles.py):
     'it'      titolo italiano in testa, originale sotto
     'orig'    l'uso italiano È l'originale → una fascia sola, niente ripetizione
     'assente' non curato: originale in testa, inglese sotto marcato «en»       */
function workCard(w) {
  const card = el('button', `catcard ${w.lang}`);
  const st = w.titleState || 'assente';
  const anticoInTesta = (st !== 'it');

  const t1 = el('div', 'ctitle' + (anticoInTesta ? ' orig' : ''), w.title);
  if (anticoInTesta) t1.lang = w.lang;
  card.appendChild(t1);

  if (w.titleOrig) {
    const secondaGreca = (st === 'it' && w.lang === 'grc');
    const t2 = el('div', 'corig' + (secondaGreca ? ' gr' : ''));
    t2.appendChild(document.createTextNode(w.titleOrig));
    if (st === 'it') {
      t2.lang = w.lang;                          // è davvero l'originale
    } else {
      /* Non è l'originale ed è un ripiego, ma NON è detto che sia inglese: nel
         catalogo Perseus il campo «titolo inglese» porta spesso il titolo
         convenzionale LATINO (Galeno: «De naturalibus facultatibus»). Marcarlo
         «en» sarebbe un'affermazione falsa: si dice che è convenzionale e basta. */
      const tag = el('span', 'en', 'conv.');
      tag.title = 'Titolo convenzionale dal catalogo della fonte, non il titolo originale';
      t2.appendChild(tag);
    }
    card.appendChild(t2);
  }

  card.appendChild(el('div', 'cauthor', w.author));
  const meta = el('div', 'cmeta');
  const g = el('span', w.inferred ? 'inf' : null, w.genre);
  if (w.inferred) g.title = 'Genere ed epoca dedotti dall’autore, non curati opera per opera';
  meta.appendChild(g);
  meta.appendChild(el('span', null, w.epoch));
  /* L'anno compare SOLO se lo si conosce come anno. Per le opere collocate in
     una successione relativa il numero esiste — serve a ordinare — ma stamparlo
     lo farebbe passare per una data, ed è il tipo di bugia che un manuale non
     perdona. Quelle portano la targhetta tratteggiata «datazione incerta», che
     nel resto del catalogo significa già «dato non curato uno per uno». */
  if (w.year != null) {
    if (w.yearKind === 'fase') {
      const p = el('span', 'inf', 'datazione incerta');
      p.title = w.yearNote || 'Collocata in una successione relativa, senza data';
      meta.appendChild(p);
    } else {
      const era = w.year < 0 ? 'a.C.' : 'd.C.';
      const p = el('span', 'yr', `${w.yearKind === 'circa' ? 'ca. ' : ''}${Math.abs(w.year)} ${era}`);
      p.title = w.yearNote || '';
      meta.appendChild(p);
    }
  }
  meta.appendChild(el('span', null, w.kind === 'versi' ? `${nf.format(w.units)} versi` : `${nf.format(w.units)} passi`));
  card.appendChild(meta);
  card.onclick = () => openWork(w.id);
  return card;
}

// ── Pagina autore ──────────────────────────────────────────────────────────
/* L'autore non ha più una vista propria: È il quarto livello dello sfoglio.
   Tenerne due, con briciole diverse e ordinamenti diversi, avrebbe significato
   due posti da cui la stessa domanda riceve risposte disallineate. */
function openAuthor(id) {
  const a = state.index.authors.find(x => x.id === id);
  if (!a) return;
  const prima = state.index.works.find(w => w.authorId === id);
  openBrowse({ lang: a.lang, epoch: prima ? prima.epoch : null, author: id });
}

// ── Lettore ────────────────────────────────────────────────────────────────
function booksOf(doc) {
  const map = new Map();
  for (const u of doc.units) {
    const key = u.loc.includes('.') ? u.loc.split('.')[0] : '·';
    if (!map.has(key)) map.set(key, []);
    map.get(key).push(u);
  }
  return map;
}
function lastSeg(loc) { const p = loc.split('.'); return p[p.length - 1]; }
function closeMobileBrowser() {
  document.getElementById('browser').classList.remove('open');
  document.getElementById('mobtoggle').setAttribute('aria-expanded', 'false');
}

async function openWork(id, targetLoc) {
  closeMobileBrowser();
  $stage.innerHTML = '<div class="loading"><div class="spinner"></div>Apro l\'opera…</div>';
  let doc;
  try { doc = await loadWork(id); }
  catch (e) { $stage.innerHTML = `<div class="empty">Non riesco ad aprire quest’opera.<br><small>${escapeHtml(String(e))}</small></div>`; return; }
  state.view = 'reader'; state.work = doc; state.author = doc.authorId; segnaVistaCorpus();
  document.body.dataset.lang = doc.lang;
  const books = booksOf(doc);
  const keys = [...books.keys()];
  let book = state.book;
  if (targetLoc) book = targetLoc.includes('.') ? targetLoc.split('.')[0] : '·';
  if (!keys.includes(book)) book = keys[0];
  state.book = book;
  renderReader(doc, books, book, targetLoc);
  // Il segnalibro si posa all'apertura e si aggiorna a ogni cambio di libro:
  // l'unica cosa che una biblioteca deve ricordare al posto di chi legge.
  const idx = targetLoc ? doc.units.findIndex(u => u.loc === targetLoc) : 0;
  segnaLettura(doc, book, doc.units.length, idx > 0 ? idx + 1 : 0);
  renderAuthors(document.getElementById('authorfilter').value);
}

let readerIO = null;
function renderReader(doc, books, bookKey, targetLoc) {
  const keys = [...books.keys()];
  const wrap = el('div');

  const back = el('button', 'backlink', '← ' + doc.author);
  back.onclick = () => openAuthor(doc.authorId);
  wrap.appendChild(back);

  const head = el('div', 'reader-head');
  /* Il kicker porta anche l'anno, con la stessa regola della scheda: si stampa
     solo dove è una data, non dove è un posto in una successione. Chi apre un
     testo vuole sapere quando è stato scritto — e l'armonizzazione vuole che lo
     dica qui come lo dice nel catalogo. */
  const kick = [langName[doc.lang], doc.genre, doc.epoch];
  if (doc.year != null && doc.yearKind !== 'fase') {
    kick.push(`${doc.yearKind === 'circa' ? 'ca. ' : ''}${Math.abs(doc.year)} ${doc.year < 0 ? 'a.C.' : 'd.C.'}`);
  }
  const rk = el('div', 'rk', kick.join(' · '));
  if (doc.yearNote) rk.title = doc.yearNote;
  head.appendChild(rk);
  const st = doc.titleState || 'assente';
  const h1 = el('h1', st !== 'it' ? 'antico' : null, doc.title);
  if (st !== 'it') h1.lang = doc.lang;
  head.appendChild(h1);
  if (doc.titleOrig && st === 'it') {
    const orig = el('div', 'rtitle-orig', doc.titleOrig);
    orig.lang = doc.lang;
    head.appendChild(orig);
  }
  const by = el('div', 'byline');
  const abtn = el('button', null, doc.author);
  abtn.onclick = () => openAuthor(doc.authorId);
  by.appendChild(abtn);
  head.appendChild(by);
  const src = el('div', 'src');
  src.innerHTML = `Fonte: <a href="https://scaife.perseus.org/library/${encodeURIComponent(doc.source.urn)}/" target="_blank" rel="noopener">${escapeHtml(doc.source.urn)}</a> · ${escapeHtml(doc.source.license)}`
    + (doc.source.edition ? `<br>Edizione: ${escapeHtml(doc.source.edition)}` : '');
  head.appendChild(src);
  wrap.appendChild(head);

  if (keys.length > 1) {
    const nav = el('div', 'book-nav');
    nav.appendChild(el('span', 'blabel', 'Libro'));
    for (const k of keys) {
      const b = el('button', null, k);
      if (k === bookKey) b.setAttribute('aria-current', 'true');
      b.onclick = () => {
        state.book = k; renderReader(doc, books, k);
        segnaLettura(doc, k, doc.units.length, 0);
        window.scrollTo({ top: 0, behavior: 'smooth' });
      };
      nav.appendChild(b);
    }
    wrap.appendChild(nav);
  }

  const scroll = el('div', 'scroll');
  // La pagina dichiara lang="it": senza questo, uno screen reader legge l'Iliade
  // con la pronuncia italiana. Marca il ramo di lettura con la lingua vera.
  scroll.lang = doc.lang === 'grc' ? 'grc' : 'la';
  const units = books.get(bookKey);
  const byLoc = Object.create(null);
  for (const u of units) byLoc[u.loc] = u.t;

  /* Anche la lettura è INCREMENTALE: un libro di Livio sono migliaia di unità,
     e disegnarle tutte a ogni clic bloccava la pagina per secondi. Si disegna a
     blocchi; se si arriva da una ricerca, si disegna comunque fin dove sta il
     passo cercato, altrimenti non ci si potrebbe saltare. */
  const READ_CHUNK = 300;
  const sentinel = el('div', 'sentinel');
  const tail = el('div', 'moreline');
  const tailTxt = el('span');
  const tailBtn = el('button', 'btn-more', 'Mostra le altre');
  tail.appendChild(tailTxt); tail.appendChild(tailBtn);
  let drawn = 0;
  const drawUpTo = (n) => {
    const end = Math.min(n, units.length);
    if (end <= drawn) return;
    const frag = document.createDocumentFragment();
    for (let i = drawn; i < end; i++) frag.appendChild(renderUnit(doc, units[i]));
    scroll.insertBefore(frag, sentinel);
    drawn = end;
    const left = units.length - drawn;
    tailTxt.textContent = left ? `${nf.format(drawn)} di ${nf.format(units.length)}` : '';
    tailBtn.hidden = !left;
    tailBtn.textContent = left > READ_CHUNK ? `Mostra altre ${nf.format(READ_CHUNK)}` : 'Mostra le ultime';
  };
  tailBtn.onclick = () => drawUpTo(drawn + READ_CHUNK);
  scroll.appendChild(sentinel);
  const targetIdx = targetLoc ? units.findIndex(u => u.loc === targetLoc) : -1;
  drawUpTo(Math.max(READ_CHUNK, targetIdx >= 0 ? targetIdx + 30 : 0));

  // DELEGA (un solo handler per l'intero libro, non uno per parola/bottone):
  // doppio-click su una parola → dizionario; click sulle azioni copia/traduci.
  scroll.addEventListener('dblclick', () => {
    const w = (window.getSelection ? String(window.getSelection()) : '').trim();
    if (w && !/\s/.test(w)) toDictionary(w, doc.lang);
  });
  scroll.addEventListener('click', (e) => {
    const b = e.target.closest('button[data-act]'); if (!b) return;
    const unit = b.closest('.unit'); const t = unit && byLoc[unit.dataset.loc];
    if (!t) return;
    const loc = unit.dataset.loc;
    if (b.dataset.act === 'copy') navigator.clipboard.writeText(t).then(() => toast('Passo copiato'));
    else if (b.dataset.act === 'pick') {
      const ora = raccogli(doc, { loc, t });
      b.setAttribute('aria-pressed', String(ora));
      b.textContent = ora ? '✓ sul tavolo' : '+ raccogli';
    }
    else toTranslator(doc, loc, t);
  });
  wrap.appendChild(scroll);
  wrap.appendChild(tail);
  $stage.innerHTML = ''; $stage.appendChild(wrap);

  if (readerIO) readerIO.disconnect();
  if (window.IntersectionObserver && drawn < units.length) {
    readerIO = new IntersectionObserver((ents) => {
      if (!ents.some(e => e.isIntersecting)) return;
      drawUpTo(drawn + READ_CHUNK);
      if (drawn >= units.length) readerIO.disconnect();
    }, { rootMargin: '600px' });
    readerIO.observe(sentinel);
  }

  if (targetLoc) {
    const node = scroll.querySelector(`[data-loc="${CSS.escape(targetLoc)}"]`);
    if (node) { node.scrollIntoView({ block: 'center' }); node.classList.add('flash'); }
  }
}

function renderUnit(doc, u) {
  const isVerse = doc.kind === 'versi';
  const unit = el('div', 'unit'); unit.dataset.loc = u.loc; unit.id = 'l' + u.loc.replace(/\./g, '-');
  if (isVerse) {
    unit.classList.add('verse');
    const n = lastSeg(u.loc);
    const showN = (parseInt(n, 10) % 5 === 0) || n === '1';
    unit.appendChild(el('span', 'ln', showN ? n : ''));
    unit.appendChild(el('span', 'vt', u.t));
  } else {
    unit.classList.add('para');
    unit.appendChild(el('span', 'loc', u.loc));
    unit.appendChild(el('span', 'txt', u.t));
  }
  unit.appendChild(buildActs(doc, u));
  return unit;
}

function buildActs(doc, u) {
  const acts = el('span', 'acts');
  const dentro = nelTavolo(doc.id, u.loc);
  const pick = el('button', null, dentro ? '✓ sul tavolo' : '+ raccogli');
  pick.dataset.act = 'pick';
  pick.setAttribute('aria-pressed', String(dentro));
  const copy = el('button', null, 'copia'); copy.dataset.act = 'copy';
  const tr = el('button', null, '→ traduci'); tr.dataset.act = 'tr'; tr.title = 'Porta il passo nel Translator';
  acts.appendChild(pick); acts.appendChild(copy); acts.appendChild(tr);
  return acts;
}

// ── Cuciture verso gli altri rami (URL-seam) ───────────────────────────────
/* Il passo viaggia COMPLETO della sua provenienza: il solo locus non basterebbe
   al Translator per riempire autore e opera, che qui abbiamo già in memoria.
   `tipo` distingue prosa e versi, così di là il brano nasce impaginato giusto. */
function toTranslator(doc, loc, text) {
  const q = new URLSearchParams({
    lang:   doc.lang,
    src:    `${doc.source.urn}:${loc}`,
    text:   text,
    autore: doc.author || '',
    opera:  doc.title || '',
    loc:    loc || '',
    tipo:   doc.kind === 'versi' ? 'poesia' : 'prosa',
  });
  window.open('translator.html?' + q.toString(), '_blank');
}
function toDictionary(word, lang) {
  const clean = word.replace(/[.,;:···!?'"«»()\[\]—–]/g, '').replace(/[·;]/g, '').trim();
  if (!clean) return;
  window.open(`dictionary.html?lang=${lang}&lemma=${encodeURIComponent(clean)}`, '_blank');
}

// ══════════════════════════════════════════════════════════════════════════
// RICERCA A DUE STADI
// ══════════════════════════════════════════════════════════════════════════
/* Stadio 1 — l'indice dice IN QUALI opere compare la forma cercata.
   Si cerca per PREFISSO dentro un solo spicchio, così «virtut» continua a
   trovare «virtute» come faceva la vecchia ricerca a scansione.
   Con più parole si intersecano gli insiemi partendo dalla più RARA: in
   «Gallia est omnis», «est» sta ovunque e «Gallia» in poche opere. */
const NO_INDEX = Symbol('indice non disponibile');
const NO_WORDS = Symbol('la ricerca non contiene parole');

async function candidateWorks(query) {
  // Tre esiti DISTINTI, perché meritano tre messaggi diversi: cercare «1.1» non
  // significa che l'indice sia rotto, e dirlo mentre i 67 spicchi sono integri
  // rende poi impossibile riconoscere il guasto vero.
  const toks = fold(query).split(/[^\p{L}]+/u).filter(Boolean);
  if (!toks.length) return NO_WORDS;
  const man = await loadManifest();
  if (!man) return NO_INDEX;

  const sets = [];
  for (const t of toks) {
    const shard = await loadShard(t[0]);
    if (!shard) return [];                     // spicchio assente = nessuna occorrenza
    const s = new Set();
    if (shard[t]) for (const wi of shard[t]) s.add(wi);
    for (const form in shard) {                // prefisso: virtut → virtute, virtutis…
      if (form.length > t.length && form.startsWith(t)) {
        for (const wi of shard[form]) s.add(wi);
      }
    }
    if (!s.size) return [];
    sets.push(s);
  }
  sets.sort((a, b) => a.size - b.size);        // si parte dalla parola più rara
  let acc = sets[0];
  for (let i = 1; i < sets.length; i++) {
    const next = new Set();
    for (const wi of acc) if (sets[i].has(wi)) next.add(wi);
    acc = next;
    if (!acc.size) break;
  }
  return [...acc].map(i => man.works[i]).filter(Boolean);
}

/* Ordine dei candidati: NON alfabetico.
   Quando l'indice restringe a più opere di quante se ne possano aprire, chi
   resta fuori dal taglio conta. In ordine alfabetico per autore, cercando
   «virtus» il primo risultato era Agostino e Cicerone rischiava di non entrare.
   Si mette davanti il canone scolastico — l'età classica per il greco, l'età
   di Cesare e Augusto per il latino — e in coda tarda antichità e cristiani.
   È una preferenza didattica dichiarata, non un giudizio di valore: la riga di
   stato dice sempre quante opere sono state escluse dal taglio. */
const CANON_RANK = {
  classica: 0, repubblicana: 0, augustea: 1, arcaica: 2,
  ellenistica: 3, imperiale: 4, tarda: 5,
};
function byCanon(a, b) {
  const ra = CANON_RANK[a.epoch] ?? 9, rb = CANON_RANK[b.epoch] ?? 9;
  if (ra !== rb) return ra - rb;
  return b.words - a.words;          // a parità d'epoca, prima le opere maggiori
}

let searchSeq = 0;
async function runSearch(raw) {
  const q = raw.trim();
  if (q.length < 2) { if (state.view === 'results') renderWelcome(); return; }
  const seq = ++searchSeq;
  state.view = 'results'; state.work = null; segnaVistaCorpus();
  state.lastHits = []; state.searchTail = null;
  if (state.lang === 'la' || state.lang === 'grc') document.body.dataset.lang = state.lang;
  else document.body.removeAttribute('data-lang');

  // ── Stadio 0: catalogo (istantaneo, è già in memoria) ────────────────────
  const nq = fold(q);
  const catHits = state.index.works.filter(w => inBranch(w) &&
    (fold(w.title).includes(nq) || fold(w.author).includes(nq) ||
     (w.titleEn && fold(w.titleEn).includes(nq))));

  const wrap = el('div');
  const head = el('div', 'results-head');
  head.appendChild(el('h1', null, '“' + q + '”'));
  const countEl = el('span', 'count', 'cerco nei testi…');
  head.appendChild(countEl);
  wrap.appendChild(head);

  if (catHits.length) {
    wrap.appendChild(el('div', 'sect-lbl', `Opere e autori · ${catHits.length}`));
    const grid = el('div', 'catalog');
    for (const w of catHits.slice(0, 12)) grid.appendChild(workCard(w));
    wrap.appendChild(grid);
  }

  /* Vista dei passi. Il default si adatta alla domanda: una parola sola si
     legge meglio incolonnata (concordanza), una frase no — sarebbe quasi tutta
     evidenziata, senza contesto ai lati. Una scelta esplicita dell'utente
     però vince e resta per la sessione. */
  const unaParola = nq.split(/[^\p{L}]+/u).filter(Boolean).length === 1;
  if (!state.modeForced) state.searchMode = unaParola ? 'kwic' : 'estesi';

  const sect = el('div', 'sect-lbl');
  sect.appendChild(el('span', null, 'Passi nei testi'));
  const modes = el('div', 'modes');
  for (const [k, lab] of [['kwic', 'concordanza'], ['estesi', 'passi estesi']]) {
    const b = el('button', null, lab);
    b.setAttribute('aria-pressed', String(state.searchMode === k));
    b.onclick = () => {
      state.searchMode = k; state.modeForced = true;
      paintHits(); [...modes.children].forEach(c => c.setAttribute('aria-pressed', String(c === b)));
    };
    modes.appendChild(b);
  }
  sect.appendChild(modes);
  wrap.appendChild(sect);

  const stageLine = el('div', 'stageline');
  const stageTxt = el('span', null, 'Consulto l’indice…');
  const prog = el('span', 'prog'); const progBar = el('i'); prog.appendChild(progBar);
  stageLine.appendChild(stageTxt); stageLine.appendChild(prog);
  wrap.appendChild(stageLine);
  const dist = el('div'); dist.id = 'dist'; wrap.appendChild(dist);
  const hits = el('div'); hits.id = 'hits'; wrap.appendChild(hits);
  state.lastHits = [];
  $stage.innerHTML = ''; $stage.appendChild(wrap);

  // ── Stadio 1: l'indice restringe il campo ────────────────────────────────
  let cand, netErr = null;
  try { cand = await candidateWorks(q); }
  catch (e) { netErr = e; cand = NO_INDEX; }
  if (seq !== searchSeq) return;

  if (cand === NO_WORDS || cand === NO_INDEX) {
    progBar.style.width = '100%';
    stageTxt.textContent = cand === NO_WORDS
      ? 'Questa ricerca non contiene parole da cercare nei testi: mostro solo il catalogo.'
      : (netErr ? 'Non ho potuto consultare l’indice (rete): riprova fra un istante.'
                : 'Indice di ricerca non disponibile: cerco solo nel catalogo.');
    countEl.textContent = catHits.length ? `${catHits.length} nel catalogo` : 'nessun risultato';
    if (!catHits.length) hits.appendChild(el('div', 'empty', 'Nessuna opera con questo nome.'));
    return;
  }

  let pool = cand.map(id => state.index.works.find(w => w.id === id)).filter(w => w && inBranch(w));
  pool.sort(byCanon);
  const total = pool.length;
  if (!total) {
    stageTxt.textContent = 'Nessuna opera contiene questa forma.';
    progBar.style.width = '100%';
    countEl.textContent = catHits.length ? `${catHits.length} nel catalogo · nessun passo` : 'nessun passo trovato';
    hits.appendChild(el('div', 'empty', 'Nessun passo contiene questa sequenza. Prova con una sola parola, o con la sua radice.'));
    return;
  }
  const capped = pool.slice(0, MAX_WORKS_SCAN);

  // ── Stadio 2: si aprono SOLO le opere candidate ──────────────────────────
  let found = 0, scanned = 0, stop = false;
  for (let i = 0; i < capped.length && !stop; i += 10) {
    const batch = capped.slice(i, i + 10);
    const docs = await Promise.all(batch.map(w => loadWork(w.id).catch(() => null)));
    if (seq !== searchSeq) return;
    for (const doc of docs) {
      scanned++;
      if (!doc) continue;
      // Due velocità: la normalizzazione RAPIDA (intera stringa) decide se
      // l'unità contiene la sequenza; la mappa posizionale — cara, e sul greco
      // senza scorciatoie ASCII — si costruisce solo per le poche unità che un
      // riscontro ce l'hanno davvero. Prima si pagava su tutte.
      if (!doc._fold) doc._fold = doc.units.map(u => fold(u.t));
      for (let ui = 0; ui < doc.units.length; ui++) {
        if (doc._fold[ui].indexOf(nq) < 0) continue;
        const u = doc.units[ui];
        const fm = foldMap(u.t);
        const at = fm.norm.indexOf(nq);
        if (at < 0) continue;
        const os = fm.map[at];
        const oe = fm.map[Math.min(at + nq.length - 1, fm.map.length - 1)] + 1;
        state.lastHits.push({ doc, u, os, oe });
        found++;
        if (found >= MAX_HITS) { stop = true; break; }
      }
      if (stop) break;
    }
    paintHits();          // si ridisegna a ogni lotto: i passi compaiono man mano
    progBar.style.width = Math.round(100 * scanned / capped.length) + '%';
    stageTxt.innerHTML = `L’indice ha ristretto a <b>${nf.format(total)}</b> oper${total === 1 ? 'a' : 'e'} · aperte <b>${nf.format(Math.min(scanned, capped.length))}</b> · <b>${nf.format(found)}</b> passi`;
    countEl.textContent = `${nf.format(found)}${stop ? '+' : ''} pass${found === 1 ? 'o' : 'i'}`;
  }

  /* La coda si disegna DOPO l'ultimo ridisegno dei passi: paintHits() rifà
     `#hits` da capo, e un avviso appeso prima sparirebbe al lotto successivo. */
  state.searchTail = !found
    ? { tipo: 'empty', testo: 'La forma esiste nel corpus, ma non come sequenza esatta in questi passi.' }
    : total > capped.length
      ? { tipo: 'moreline', testo: `Mostrate le prime ${nf.format(capped.length)} opere di ${nf.format(total)}: restringi con una parola più rara o una radice più lunga.` }
      : stop
        ? { tipo: 'moreline', testo: `Fermato a ${MAX_HITS} passi: la forma è molto frequente.` }
        : null;
  paintHits();
  paintDistribution();
}

// ══════════════════════════════════════════════════════════════════════════
// IL TAVOLO DEI PASSI
// ══════════════════════════════════════════════════════════════════════════
/* Preparare una versione o una lezione sul lessico non è cercare UN passo: è
   raccoglierne sei o sette, da autori diversi, e poi metterli insieme. Finora
   quel lavoro non esisteva nell'interfaccia e si supiliva con appunti fuori
   dall'applicazione, perdendo per strada la provenienza. */
const TAVOLO_KEY = 'poetrify-corpus-tavolo';
const CONSEGNA_KEY = 'poetrify-tavolo-consegna';

function tavolo() {
  try { return JSON.parse(localStorage.getItem(TAVOLO_KEY) || '[]'); } catch { return []; }
}
function salvaTavolo(list) {
  try { localStorage.setItem(TAVOLO_KEY, JSON.stringify(list)); } catch {}
  renderTavolo();
}
const chiaveP = (id, loc) => id + '|' + loc;
function nelTavolo(id, loc) { return tavolo().some(p => chiaveP(p.id, p.loc) === chiaveP(id, loc)); }

function raccogli(doc, u) {
  const list = tavolo();
  const k = chiaveP(doc.id, u.loc);
  const i = list.findIndex(p => chiaveP(p.id, p.loc) === k);
  if (i >= 0) { list.splice(i, 1); salvaTavolo(list); toast('Tolto dal tavolo'); return false; }
  list.push({ id: doc.id, loc: u.loc, t: u.t, autore: doc.author, opera: doc.title,
              lang: doc.lang, urn: doc.source ? doc.source.urn : '', kind: doc.kind });
  salvaTavolo(list);
  toast(`Sul tavolo · ${list.length} pass${list.length === 1 ? 'o' : 'i'}`);
  return true;
}

function bottonePick(doc, u) {
  const b = el('button', 'pick', '+');
  const dentro = nelTavolo(doc.id, u.loc);
  b.setAttribute('aria-pressed', String(dentro));
  b.title = dentro ? 'Togli dal tavolo' : 'Raccogli sul tavolo';
  if (dentro) b.textContent = '✓';
  b.onclick = (e) => {
    e.stopPropagation();
    const ora = raccogli(doc, u);
    b.setAttribute('aria-pressed', String(ora));
    b.textContent = ora ? '✓' : '+';
    b.title = ora ? 'Togli dal tavolo' : 'Raccogli sul tavolo';
  };
  return b;
}

function renderTavolo() {
  const box = document.getElementById('tavolo');
  const list = tavolo();
  box.hidden = !list.length;
  document.body.classList.toggle('con-tavolo', !!list.length);
  if (!list.length) return;
  document.getElementById('tvcnt').textContent = list.length;
  const autori = new Set(list.map(p => p.autore));
  const parole = list.reduce((s, p) => s + p.t.split(/\s+/).length, 0);
  document.getElementById('tvsub').textContent =
    `· ${autori.size} autor${autori.size === 1 ? 'e' : 'i'} · ${nf.format(parole)} parole`;

  const host = document.getElementById('tvlist');
  host.innerHTML = '';
  for (const p of list) {
    const c = el('div', `tv-card ${p.lang}`);
    c.appendChild(el('div', 'tr', `${p.autore} · ${p.opera} ${p.loc}`));
    const s = el('div', 'ts', p.t);
    s.lang = p.lang === 'grc' ? 'grc' : 'la';
    c.appendChild(s);
    const x = el('button', 'tx', '×');
    x.title = 'Togli dal tavolo';
    x.onclick = () => salvaTavolo(tavolo().filter(q => chiaveP(q.id, q.loc) !== chiaveP(p.id, p.loc)));
    c.appendChild(x);
    host.appendChild(c);
  }
}

/* L'esportazione porta i LOCI: è il foglio di riferimento, quello che si stampa
   o si allega. Il testo per il Translator invece viaggia pulito (vedi sotto). */
function esportaTavolo() {
  const list = tavolo();
  if (!list.length) return;
  const righe = list.map(p => `${p.autore}, ${p.opera} ${p.loc}\n${p.t}\n`);
  const testa = `Passi dal Corpus di Poetrify — ${list.length} passi\n` +
    `Testi di pubblico dominio · edizioni digitali Perseus Digital Library, CC BY-SA\n\n`;
  const blob = new Blob([testa + righe.join('\n')], { type: 'text/plain;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'passi-corpus.txt';
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  toast('Foglio esportato');
}

/* Verso il Translator la raccolta NON passa dall'URL: sei o sette passi fanno
   una stringa di chilobyte, e i limiti dei browser sono diversi e silenziosi.
   Corpus e Translator stanno sulla stessa origine, quindi condividono
   localStorage: la raccolta si deposita lì e l'indirizzo porta solo il segnale.
   Il testo arriva PULITO, senza i loci intercalati: là dentro si traduce, e una
   citazione in mezzo al latino verrebbe scomposta come se fosse testo d'autore. */
function inviaTavolo() {
  const list = tavolo();
  if (!list.length) return;
  const lingue = new Set(list.map(p => p.lang));
  if (lingue.size > 1) {
    toast('Il tavolo mescola greco e latino: il Translator lavora su una lingua sola');
    return;
  }
  const opere = new Set(list.map(p => p.id));
  const unaSola = opere.size === 1;
  const consegna = {
    lang: list[0].lang,
    testo: list.map(p => p.t).join('\n\n'),
    autore: unaSola ? list[0].autore : 'Raccolta di passi',
    opera: unaSola ? list[0].opera : `${list.length} passi da ${new Set(list.map(p => p.autore)).size} autori`,
    loc: unaSola ? list[0].loc : '',
    src: unaSola && list[0].urn ? `${list[0].urn}:${list[0].loc}` : '',
    tipo: list.every(p => p.kind === 'versi') ? 'poesia' : 'prosa',
    passi: list.map(p => ({ autore: p.autore, opera: p.opera, loc: p.loc })),
  };
  try { localStorage.setItem(CONSEGNA_KEY, JSON.stringify(consegna)); }
  catch { toast('Non riesco a preparare la consegna'); return; }
  window.open('translator.html?dalTavolo=1&lang=' + consegna.lang, '_blank');
}

// ══════════════════════════════════════════════════════════════════════════
// LA CITAZIONE COME INPUT — «Caes. Gall. 1,1» apre il passo
// ══════════════════════════════════════════════════════════════════════════
/* Un classicista non naviga: CITA. Ha in mente «Cesare, Gallico I 1» e finora
   doveva tradurlo in una sequenza di clic. Qui la stessa casella riconosce
   l'intento e lo DICHIARA con un'etichetta — un campo che indovina in silenzio
   è magico finché non sbaglia; uno che dice come ti ha capito resta prevedibile
   anche quando sbaglia.

   Le sigle d'AUTORE non si possono dedurre («Caes.» non è prefisso di «Cesare»):
   servono tabulate. Quelle d'OPERA quasi sempre sì, confrontandole con ogni
   parola del titolo — italiano o originale: «Gall.» sta in «De Bello Gallico»,
   «Il.» in «Iliade». */
const SIGLA_AUTORI = {
  // latini
  caes: 'phi0448', cic: 'phi0474', verg: 'phi0690', virg: 'phi0690', hor: 'phi0893',
  ov: 'phi0959', ovid: 'phi0959', liv: 'phi0914', sall: 'phi0631', tac: 'phi1351',
  sen: 'phi1017', lucr: 'phi0550', catull: 'phi0472', cat: 'phi0472', prop: 'phi0620',
  tib: 'phi0660', quint: 'phi1002', suet: 'phi1348', iuv: 'phi1276', juv: 'phi1276',
  mart: 'phi1294', pers: 'phi0969', petron: 'phi0972', apul: 'phi1212',
  phaedr: 'phi0975', nep: 'phi0588', plaut: 'phi0119', ter: 'phi0134',
  lucan: 'phi0917', stat: 'phi1020', vitr: 'phi1056', gell: 'phi1254',
  amm: 'stoa0023', boeth: 'stoa0058', tert: 'stoa0275', colum: 'phi0845',
  // greci
  hom: 'tlg0012', hes: 'tlg0020', hdt: 'tlg0016', hrdt: 'tlg0016', thuc: 'tlg0003',
  xen: 'tlg0032', plat: 'tlg0059', pl: 'tlg0059', arist: 'tlg0086', aristot: 'tlg0086',
  aesch: 'tlg0085', soph: 'tlg0011', eur: 'tlg0006', aristoph: 'tlg0019', ar: 'tlg0019',
  dem: 'tlg0014', demosth: 'tlg0014', lys: 'tlg0540', isocr: 'tlg0010', isoc: 'tlg0010',
  aeschin: 'tlg0026', pind: 'tlg0033', bacchyl: 'tlg0199', plut: 'tlg0007',
  luc: 'tlg0062', lucian: 'tlg0062', polyb: 'tlg0543', apoll: 'tlg0001',
  theocr: 'tlg0005', callim: 'tlg0533', paus: 'tlg0525', strab: 'tlg0099',
  long: 'tlg0561', epict: 'tlg0557', diod: 'tlg0060', ath: 'tlg0008', gal: 'tlg0057',
};
/* Le poche sigle d'opera che nessuna parola del titolo può dare. */
const SIGLA_OPERE = {
  'tlg0059|resp': 'tlg0059.tlg030', 'tlg0059|r': 'tlg0059.tlg030',
  'tlg0032|an': 'tlg0032.tlg006', 'tlg0032|hell': 'tlg0032.tlg001',
  'tlg0032|mem': 'tlg0032.tlg002', 'tlg0032|cyr': 'tlg0032.tlg007',
  'phi0448|civ': 'phi0448.phi002', 'phi0474|off': 'phi0474.phi055',
  'phi0474|am': 'phi0474.phi052', 'phi0474|sen': 'phi0474.phi051',
  'phi0474|nat': 'phi0474.phi050', 'phi0474|tusc': 'phi0474.phi049',
  'phi0474|att': 'phi0474.phi057', 'phi0474|fam': 'phi0474.phi056',
  'phi0690|ecl': 'phi0690.phi001', 'phi0690|georg': 'phi0690.phi002',
  'phi0893|carm': 'phi0893.phi001', 'phi0893|sat': 'phi0893.phi004',
  'phi0893|epist': 'phi0893.phi005', 'phi1017|epist': 'phi1017.phi015',
  'phi0959|met': 'phi0959.phi006', 'phi1351|ann': 'phi1351.phi005',
  'phi1351|hist': 'phi1351.phi004', 'phi1351|germ': 'phi1351.phi002',
  'phi1351|agr': 'phi1351.phi001', 'tlg0012|il': 'tlg0012.tlg001',
  'tlg0012|od': 'tlg0012.tlg002',
};

const ROMANI = { i: 1, v: 5, x: 10, l: 50, c: 100, d: 500, m: 1000 };
function romanoANumero(s) {
  const t = s.toLowerCase();
  if (!/^[ivxlcdm]+$/.test(t)) return null;
  let tot = 0;
  for (let i = 0; i < t.length; i++) {
    const v = ROMANI[t[i]], next = ROMANI[t[i + 1]];
    tot += (next && v < next) ? -v : v;
  }
  return tot > 0 ? tot : null;
}
const sigla = (s) => fold(s).replace(/[.,;:]/g, '').trim();
/* Le chiavi delle tavole vanno passate per la STESSA normalizzazione della
   ricerca, che unifica v→u e j→i: senza, «Verg.» diventa «uerg» e non trova
   mai la voce scritta «verg». Funzionavano solo le sigle prive di v e di j —
   un guasto che si nascondeva dietro i casi che andavano. */
const SIGLA_AUTORI_N = Object.fromEntries(
  Object.entries(SIGLA_AUTORI).map(([k, v]) => [sigla(k), v]));
const SIGLA_OPERE_N = Object.fromEntries(
  Object.entries(SIGLA_OPERE).map(([k, v]) => {
    const [a, s] = k.split('|');
    return [a + '|' + sigla(s), v];
  }));

/* Riconosce «autore opera locus». Restituisce null se non è una citazione:
   il campo resta una ricerca testuale, e non si inventa un'intenzione. */
function parseCitation(raw) {
  /* Dove finisce il riferimento e comincia il locus non si decide con una
     regola sola: «Verg. Aen. VI 847» ha il libro in cifre romane separato da
     uno spazio, ma «Il.» dell'Iliade è fatto di lettere che SONO cifre romane
     (i + l) e verrebbe inghiottito. Si provano quindi i tagli possibili, dal
     più corto, e vince il primo che si risolve davvero in un'opera: è il testo
     a dire dove sta il confine, non una presunzione. */
  const q = raw.trim();
  const tok = q.split(/\s+/).filter(Boolean);
  if (tok.length < 2) return null;
  const numerico = (t) => /^\d+([.,]\d+)*$/.test(t) || romanoANumero(t.replace(/[.,]$/, '')) !== null;

  /* Si valutano TUTTI i tagli possibili e vince il meglio risolto, non il primo:
     «Hor. carm. I 11» col taglio corto lascia "carm i" e finisce sul Carme
     secolare per somiglianza; col taglio lungo lascia "carm", che la tavola
     conosce come le Odi. Il punteggio premia la corrispondenza tabulata. */
  let migliore = null;
  for (let k = 1; k <= Math.min(3, tok.length - 1); k++) {
    const coda = tok.slice(tok.length - k);
    if (!coda.every(numerico)) break;                 // non è più un locus: fermarsi
    const r = risolviCitazione(tok.slice(0, tok.length - k).join(' '), coda);
    if (!r) continue;
    if (!migliore || r.punti > migliore.punti) migliore = r;
  }
  return migliore;
}

function risolviCitazione(rif, coda) {
  const loc = coda.join('.').split(/[.,]/).map(p => {
    const t = p.trim().replace(/[.,]$/, '');
    if (!t) return null;
    return /^\d+$/.test(t) ? t : String(romanoANumero(t) || t);
  }).filter(Boolean).join('.');
  if (!rif || rif.length < 2 || !loc) return null;

  const parole = rif.split(/[\s.]+/).map(sigla).filter(Boolean);
  if (!parole.length) return null;

  // 1 · l'autore: sigla tabulata, oppure prefisso di una parola del suo nome
  let autore = null, consumate = 0, punti = 0;
  for (const n of [2, 1]) {                      // «M. Aur.» prima di «Aur.»
    if (parole.length < n) continue;
    const chiave = parole.slice(0, n).join('');
    if (SIGLA_AUTORI_N[chiave]) { autore = SIGLA_AUTORI_N[chiave]; consumate = n; punti += 3; break; }
  }
  if (!autore) {
    const p = parole[0];
    const cand = state.index.authors.filter(a =>
      fold(a.name).split(/\s+/).some(w => w.startsWith(p) && p.length >= 3));
    if (cand.length === 1) { autore = cand[0].id; consumate = 1; punti += 2; }
    else if (cand.length > 1) {
      const esatto = cand.find(a => fold(a.name) === p);
      if (esatto) { autore = esatto.id; consumate = 1; punti += 2; }
    }
  }
  if (!autore) return null;

  // 2 · l'opera: sigla tabulata, oppure prefisso di una parola del titolo
  const opere = state.index.works.filter(w => w.authorId === autore && inBranch(w));
  const resto = parole.slice(consumate);
  let opera = null;
  if (!resto.length) {
    if (opere.length === 1) { opera = opere[0]; punti += 3; }
    else {
      /* Alcuni autori si citano senza nominare l'opera perché ne hanno una che
         li rappresenta: «Liv. 21,1» è l'Ab urbe condita. Si accetta solo quando
         un'opera pesa da sola almeno il 40% dell'autore — vale per Livio, non
         per Cicerone, dove indovinare sarebbe arbitrario. Punteggio basso: una
         sigla esplicita vince sempre. */
      const tot = opere.reduce((s, w) => s + w.words, 0);
      const grande = opere.slice().sort((a, b) => b.words - a.words)[0];
      if (grande && tot && grande.words / tot >= 0.4) { opera = grande; punti += 1; }
    }
  } else {
    const k = autore + '|' + resto.join('');
    if (SIGLA_OPERE_N[k]) {
      opera = opere.find(w => w.id === SIGLA_OPERE_N[k]) || null;
      if (opera) punti += 5;                     // la tavola è la fonte più sicura
    }
    if (!opera) {
      const compatto = resto.join('');
      const parti = (w) => [w.title, w.titleOrig, w.titleEn].filter(Boolean)
        .flatMap(t => fold(t).split(/[\s,]+/));
      // prima chi combacia con TUTTO il resto, poi chi combacia con la sola sigla
      const pieno = opere.filter(w => parti(w).some(x => x.startsWith(compatto)));
      const parziale = opere.filter(w => parti(w).some(x => x.startsWith(resto[0])));
      if (pieno.length) { opera = pieno[0]; punti += 3; }
      else if (parziale.length) { opera = parziale[0]; punti += 1; }
    }
  }
  return { autore, opera, loc, opere, punti };
}

/* Pannello sotto la casella: dichiara come ha capito e offre le vie. Non
   sostituisce la ricerca testuale, che prosegue sotto: se l'interpretazione è
   sbagliata non si è perso nulla. */
function paintCitation(raw) {
  const host = document.getElementById('cite');
  if (!host) return;
  host.innerHTML = '';
  let c = null;
  try { c = parseCitation(raw); } catch { c = null; }
  if (!c || !c.opera) return;

  const w = c.opera;
  const box = el('div', 'citebox');
  const cap = el('div', 'cite-cap');
  cap.appendChild(el('span', 'cite-kind', `Citazione · ${langName[w.lang]}`));
  cap.appendChild(el('span', 'cite-who', `${w.author} · ${w.title}`));
  box.appendChild(cap);

  const vie = [];
  const doc = state.docs[w.id];
  vie.push({ k: c.loc, t: 'apri il passo', go: () => openWork(w.id, c.loc) });
  if (c.loc.includes('.')) {
    const libro = c.loc.split('.')[0];
    vie.push({ k: libro, t: 'apri il libro', go: () => { state.book = libro; openWork(w.id); } });
  }
  vie.push({ k: '↳', t: `tutte le opere di ${w.author}`, go: () => openAuthor(w.authorId) });

  for (const v of vie) {
    const r = el('button', 'cite-row');
    r.appendChild(el('span', 'ck', v.k));
    r.appendChild(el('span', 'cv', v.t));
    r.appendChild(el('span', 'cgo', 'apri →'));
    r.onclick = () => { document.getElementById('q').value = ''; host.innerHTML = ''; v.go(); };
    box.appendChild(r);
  }
  host.appendChild(box);
}

// ══════════════════════════════════════════════════════════════════════════
// RESA DEI PASSI — concordanza o passi estesi
// ══════════════════════════════════════════════════════════════════════════
const KWIC_CTX = 58;        // caratteri di contesto per lato

function paintHits() {
  const host = document.getElementById('hits');
  if (!host) return;
  host.innerHTML = '';
  const list = state.lastHits || [];

  if (state.searchMode === 'kwic' && list.length) {
    /* Il contesto si taglia in JS, non con l'ellissi CSS: su una colonna
       allineata a destra servirebbe `direction: rtl`, che sul greco sposta la
       punteggiatura e scombina i diacritici. Tagliare la stringa è esatto. */
    const wrapT = el('div', 'kwic-wrap');
    const tbl = el('table', 'kwic');
    const body = document.createElement('tbody');
    for (const h of list) {
      const t = h.u.t;
      const li = Math.max(0, h.os - KWIC_CTX);
      const ri = Math.min(t.length, h.oe + KWIC_CTX);
      const tr = el('tr', h.doc.lang);
      tr.tabIndex = 0;
      const pk = el('td', 'kw-pick');
      pk.appendChild(bottonePick(h.doc, h.u));
      tr.appendChild(pk);
      const ref = el('td', 'kw-ref');
      ref.innerHTML = `<b>${escapeHtml(shortAuthor(h.doc.author))}</b> ${escapeHtml(h.u.loc)}`;
      ref.title = `${h.doc.author} · ${h.doc.title} ${h.u.loc}`;
      tr.appendChild(ref);
      tr.appendChild(el('td', 'kw-l', (li > 0 ? '… ' : '') + t.slice(li, h.os)));
      tr.appendChild(el('td', 'kw-k', t.slice(h.os, h.oe)));
      tr.appendChild(el('td', 'kw-r', t.slice(h.oe, ri) + (ri < t.length ? ' …' : '')));
      const vai = () => openWork(h.doc.id, h.u.loc);
      tr.onclick = vai;
      tr.onkeydown = (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); vai(); } };
      body.appendChild(tr);
    }
    tbl.appendChild(body); wrapT.appendChild(tbl); host.appendChild(wrapT);
  } else {
    for (const h of list) host.appendChild(hitRow(h.doc, h.u, h.os, h.oe));
  }

  if (state.searchTail) host.appendChild(el('div', state.searchTail.tipo, state.searchTail.testo));
}

/* «Di chi è questa parola» è la domanda che viene prima di «dove sta»: la
   distribuzione per autore risponde in sei righe, e sta sopra l'elenco. */
function paintDistribution() {
  const host = document.getElementById('dist');
  if (!host) return;
  host.innerHTML = '';
  const list = state.lastHits || [];
  if (list.length < 4) return;                  // sotto, l'elenco basta a sé

  const per = new Map();
  for (const h of list) {
    const k = h.doc.authorId;
    if (!per.has(k)) per.set(k, { nome: h.doc.author, lang: h.doc.lang, n: 0 });
    per.get(k).n++;
  }
  const voci = [...per.values()].sort((a, b) => b.n - a.n);
  if (voci.length < 2) return;                  // un autore solo: niente da confrontare
  const mostrate = voci.slice(0, 6);
  const max = mostrate[0].n;

  const box = el('div', 'dist');
  for (const v of mostrate) {
    const row = el('div', 'dist-row');
    row.appendChild(el('span', 'dist-lab', v.nome));
    const track = el('span', 'dist-track');
    const fill = el('span', `dist-fill ${v.lang}`);
    fill.style.width = Math.max(2, Math.round(100 * v.n / max)) + '%';
    track.appendChild(fill); row.appendChild(track);
    row.appendChild(el('span', 'dist-val', nf.format(v.n)));
    box.appendChild(row);
  }
  host.appendChild(box);

  const leg = el('div', 'dist-leg');
  const seg = (cls, testo) => {
    const s = el('span'); const i = el('i');
    i.style.background = cls === 'la' ? 'var(--lat-chart)' : 'var(--grc-chart)';
    s.appendChild(i); s.appendChild(document.createTextNode(testo)); return s;
  };
  if (mostrate.some(v => v.lang === 'la')) leg.appendChild(seg('la', 'latino'));
  if (mostrate.some(v => v.lang === 'grc')) leg.appendChild(seg('grc', 'greco'));
  if (voci.length > mostrate.length) {
    leg.appendChild(el('span', null, `primi ${mostrate.length} di ${voci.length} autori`));
  }
  /* Un grafico invita a leggere i numeri come statistica del corpus. Qui non lo
     sono: la ricerca ha un tetto, e le opere si aprono in ordine di canone —
     quindi chi viene prima accumula piú occorrenze prima che il taglio scatti.
     Se il taglio è scattato, la legenda lo dice: le barre restano utili per
     vedere CHI usa la parola, non quante volte in assoluto. */
  const tagliata = !!(state.searchTail && state.searchTail.tipo === 'moreline');
  const nota = el('span', null, tagliata
    ? 'conteggio parziale: la ricerca si è fermata prima di esaurire il corpus'
    : 'sui passi trovati, non su tutto il corpus');
  if (tagliata) nota.style.color = 'var(--warning-ink)';
  leg.appendChild(nota);
  host.appendChild(leg);
}

/* Nella concordanza la colonna del riferimento è stretta: un nome lungo la
   allargherebbe togliendo spazio al contesto, che è la sostanza della vista. */
function shortAuthor(nome) {
  if (nome.length <= 14) return nome;
  const p = nome.split(/\s+/);
  return p.length > 1 ? p[p.length - 1].slice(0, 14) : nome.slice(0, 13) + '.';
}

function hitRow(doc, u, os, oe) {
  /* Non è più un <button>: deve contenere il pulsante «raccogli», e un bottone
     dentro un bottone è marcatura non valida (e il click interno diventa
     imprevedibile). Resta operabile da tastiera con ruolo e gestione dei tasti. */
  const row = el('div', `res ${doc.lang}`);
  row.setAttribute('role', 'button');
  row.tabIndex = 0;
  const ref = el('div', 'rref');
  // niente opacity sul locus: attenuava un testo già tenue fino a 3:1
  ref.innerHTML = `<b>${escapeHtml(doc.author)}</b> · ${escapeHtml(doc.title)} <span class="loc">${escapeHtml(u.loc)}</span> `;
  ref.appendChild(bottonePick(doc, u));
  row.appendChild(ref);
  const txt = el('div', 'rtext'); txt.lang = doc.lang === 'grc' ? 'grc' : 'la';
  txt.innerHTML = snip(u.t, os, oe);
  row.appendChild(txt);
  const vai = () => openWork(doc.id, u.loc);
  row.onclick = (e) => { if (!e.target.closest('.pick')) vai(); };
  row.onkeydown = (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); vai(); } };
  return row;
}

// estrae un frammento centrato sul match, con la porzione evidenziata
function snip(text, os, oe, ctx = 90) {
  const a = Math.max(0, os - ctx), b = Math.min(text.length, oe + ctx);
  const pre = (a > 0 ? '… ' : '') + text.slice(a, os);
  const hit = text.slice(os, oe);
  const post = text.slice(oe, b) + (b < text.length ? ' …' : '');
  return escapeHtml(pre) + '<mark>' + escapeHtml(hit) + '</mark>' + escapeHtml(post);
}

// ══════════════════════════════════════════════════════════════════════════
// RICONOSCIMENTO DI UN BRANO
// ══════════════════════════════════════════════════════════════════════════
/* Data una versione — ritrascritta, fotocopiata, magari presa da un'edizione
   diversa — si cerca da dove viene. La corrispondenza esatta quasi mai esiste,
   quindi la risposta non è «trovato / non trovato» ma QUANTA parte del brano si
   ritrova, e su quale intervallo di loci.

   Il peso di ogni parola è il suo `idf`, ricavato dall'indice: una forma che
   compare in poche opere vale molto, una che compare ovunque vale quasi nulla.
   In un passo di Cesare «et» ed «est» sono rumore, «Helvetii» e «Garumna» sono
   un'impronta digitale. */

const RECOG_WORKS = 10;      // opere aperte per il confronto ravvicinato
const RECOG_MIN_TOKENS = 4;

function tokenize(text) {
  return fold(text).split(/[^\p{L}]+/u).filter(t => t.length > 1);
}

async function recognize(text, onProgress) {
  const toks = tokenize(text);
  if (toks.length < RECOG_MIN_TOKENS) return { error: 'troppo-corto' };
  const man = await loadManifest();
  if (!man) return { error: 'indice' };

  // 1 · peso di ogni forma distinta (idf dalla lunghezza delle sue postings)
  const uniq = [...new Set(toks)];
  const weight = new Map(), postings = new Map();
  const N = man.works.length;
  for (const t of uniq) {
    const shard = await loadShard(t[0]).catch(() => null);
    const post = shard && shard[t];
    if (!post || !post.length) continue;             // forma assente dal corpus
    postings.set(t, post);
    weight.set(t, Math.log(N / post.length) + 0.25);
  }
  if (!weight.size) return { error: 'nessuna-forma' };
  const totalW = toks.reduce((s, t) => s + (weight.get(t) || 0), 0);
  if (!totalW) return { error: 'nessuna-forma' };

  // 2 · quali opere valgono la pena di essere aperte
  const perWork = new Map();
  for (const [t, post] of postings) {
    const w = weight.get(t);
    for (const wi of post) perWork.set(wi, (perWork.get(wi) || 0) + w);
  }
  const shortlist = [...perWork.entries()]
    .sort((a, b) => b[1] - a[1]).slice(0, RECOG_WORKS)
    .map(([wi]) => man.works[wi])
    .map(id => state.index.works.find(w => w.id === id))
    .filter(w => w && inBranch(w));
  if (!shortlist.length) return { error: 'nessuna-opera' };

  // 3 · dentro ogni opera, la finestra di unità che copre meglio il brano
  const wanted = new Set(uniq.filter(t => weight.has(t)));
  const out = [];
  for (let i = 0; i < shortlist.length; i++) {
    if (onProgress) onProgress(i, shortlist.length);
    const doc = await loadWork(shortlist[i].id).catch(() => null);
    if (!doc) continue;
    const best = bestWindow(doc, wanted, weight, totalW);
    if (best && best.score > 0.08) out.push({ doc, ...best });
  }
  /* A PARITÀ di riconoscimento vince l'autore più antico. Non è un vezzo: un
     brano famoso lo contiene sia chi l'ha scritto sia chi lo cita — l'incipit
     dell'Iliade sta al 100% in Omero e al 100% in Dione Crisostomo, che lo
     riporta. Chi cerca la provenienza di una versione vuole la fonte, non il
     testimone; e le due letture restano comunque entrambe in elenco. */
  out.sort((a, b) => (b.score - a.score) ||
    ((CANON_RANK[a.doc.epoch] ?? 9) - (CANON_RANK[b.doc.epoch] ?? 9)));
  return { matches: out.slice(0, 6), totalW, wanted };
}

/* La finestra migliore: si valuta ogni unità, si parte dalla più ricca e si
   allarga finché le unità vicine continuano a portare parole del brano. Senza
   questo, una versione che occupa cinque capitoli verrebbe attribuita a uno solo. */
function bestWindow(doc, wanted, weight, totalW) {
  // La scomposizione in parole di un'opera si fa UNA VOLTA e resta attaccata al
  // documento: un secondo riconoscimento sulle stesse opere candidate non la
  // rifà da capo.
  if (!doc._toks) doc._toks = doc.units.map(u => tokenize(u.t));
  const hits = doc._toks.map(list => {
    const found = new Set();
    for (const t of list) if (wanted.has(t)) found.add(t);
    let w = 0; for (const t of found) w += weight.get(t);
    return { found, w };
  });
  let seed = 0;
  for (let i = 1; i < hits.length; i++) if (hits[i].w > hits[seed].w) seed = i;
  if (!hits.length || hits[seed].w === 0) return null;

  let lo = seed, hi = seed;
  const acc = new Set(hits[seed].found);
  const MAX_SPAN = 60;
  for (let step = 0; step < MAX_SPAN; step++) {
    const before = lo > 0 ? countNew(hits[lo - 1].found, acc, weight) : -1;
    const after = hi < hits.length - 1 ? countNew(hits[hi + 1].found, acc, weight) : -1;
    if (before <= 0 && after <= 0) break;
    if (before >= after) { lo--; for (const t of hits[lo].found) acc.add(t); }
    else { hi++; for (const t of hits[hi].found) acc.add(t); }
  }
  let matched = 0; for (const t of acc) matched += weight.get(t);
  return {
    score: matched / totalW,
    from: doc.units[lo].loc, to: doc.units[hi].loc,
    lo, hi, units: hi - lo + 1,
    snippet: doc.units[lo].t,
    hitTokens: acc,
  };
}
function countNew(found, acc, weight) {
  let w = 0; for (const t of found) if (!acc.has(t)) w += weight.get(t);
  return w;
}

function renderRecognizeView(preset) {
  state.view = 'recognize'; state.work = null; state.author = null; segnaVistaCorpus();
  if (state.lang === 'la' || state.lang === 'grc') document.body.dataset.lang = state.lang;
  const wrap = el('div');
  const head = el('div', 'recog-head');
  head.appendChild(el('h1', null, 'Da dove viene questo brano?'));
  head.appendChild(el('p', null, 'Incolla una versione — anche ritrascritta, anche da un’edizione diversa — e la confronto con tutto il corpus. Ti dico l’autore, l’opera, i loci e quanta parte del brano ho ritrovato.'));
  wrap.appendChild(head);

  const ta = el('textarea'); ta.id = 'brano';
  ta.placeholder = 'Gallia est omnis divisa in partes tres…';
  ta.setAttribute('aria-label', 'Il brano da riconoscere');
  if (preset) ta.value = preset;
  wrap.appendChild(ta);

  const bar = el('div', 'recog-bar');
  const go = el('button', 'btn-primary', 'Riconosci il brano');
  const note = el('span', 'recog-note', 'Bastano una decina di parole; più ne dai, più il riconoscimento è sicuro.');
  bar.appendChild(go); bar.appendChild(note);
  wrap.appendChild(bar);

  const res = el('div'); res.id = 'recogres';
  wrap.appendChild(res);

  go.onclick = () => runRecognize(ta.value, go, note, res);
  ta.addEventListener('keydown', (e) => {
    if ((e.metaKey || e.ctrlKey) && e.key === 'Enter') go.click();
  });

  $stage.innerHTML = ''; $stage.appendChild(wrap);
  ta.focus();
  if (preset) go.click();
}

async function runRecognize(text, go, note, res) {
  go.disabled = true;
  note.textContent = 'Consulto l’indice…';
  res.innerHTML = '';
  let r;
  try {
    r = await recognize(text, (i, n) => { note.textContent = `Confronto con le opere candidate… ${i + 1} di ${n}`; });
  } catch (e) {
    r = { error: 'rete' };
  }
  go.disabled = false;

  const msg = {
    'troppo-corto': 'Servono almeno quattro parole per tentare un riconoscimento.',
    'indice': 'L’indice non è raggiungibile in questo momento: riprova fra un istante.',
    'nessuna-forma': 'Nessuna di queste parole compare nel corpus: controlla la lingua del brano.',
    'nessuna-opera': 'Nessuna opera del ramo scelto contiene queste parole.',
    'rete': 'Qualcosa è andato storto nella lettura dei dati: riprova.',
  };
  if (r.error) {
    note.textContent = '';
    res.appendChild(el('div', 'empty', msg[r.error] || 'Riconoscimento non riuscito.'));
    return;
  }
  if (!r.matches.length) {
    note.textContent = '';
    res.appendChild(el('div', 'empty', 'Non ho trovato un passo che corrisponda. Può essere un autore fuori dal corpus, oppure un testo troppo rimaneggiato.'));
    return;
  }
  note.textContent = 'Le corrispondenze migliori, dalla più probabile.';
  r.matches.forEach((m, i) => res.appendChild(matchCard(m, i === 0)));
}

function matchCard(m, isTop) {
  const pct = Math.round(m.score * 100);
  const card = el('button', `match ${m.doc.lang}${isTop ? ' top' : ''}`);
  const top = el('div', 'match-top');
  const s = el('div', 'score', String(pct));
  s.appendChild(el('small', null, '%'));
  top.appendChild(s);
  const who = el('div');
  who.appendChild(el('div', 'match-who', m.doc.author));
  const t = el('div', 'match-snip', m.doc.title);
  t.style.margin = '2px 0 0'; t.lang = m.doc.lang === 'grc' ? 'grc' : 'la';
  who.appendChild(t);
  top.appendChild(who);
  top.appendChild(el('div', 'match-loc', m.from === m.to ? m.from : `${m.from} – ${m.to}`));
  card.appendChild(top);

  const meter = el('div', 'meter'); const fill = el('i');
  fill.style.width = Math.max(3, pct) + '%'; meter.appendChild(fill);
  card.appendChild(meter);

  const snip = el('div', 'match-snip', m.snippet.slice(0, 220) + (m.snippet.length > 220 ? ' …' : ''));
  snip.lang = m.doc.lang === 'grc' ? 'grc' : 'la';
  card.appendChild(snip);

  card.appendChild(el('div', 'match-why',
    `${m.units} unit${m.units === 1 ? 'à' : 'à'} · ${m.hitTokens.size} parole del brano ritrovate · ${pct >= 60 ? 'corrispondenza forte' : pct >= 30 ? 'corrispondenza parziale' : 'indizio debole'}`));

  card.onclick = () => openWork(m.doc.id, m.from);
  return card;
}

// ── Controlli ──────────────────────────────────────────────────────────────
let debTimer;
document.getElementById('q').addEventListener('input', (e) => {
  clearTimeout(debTimer);
  const v = e.target.value;
  /* La citazione si riconosce SUBITO, senza attesa: è un riscontro sul catalogo
     già in memoria, non costa nulla. La ricerca testuale segue col suo ritardo,
     e resta comunque disponibile sotto — se l'interpretazione è sbagliata non si
     è perso niente. */
  paintCitation(v);
  debTimer = setTimeout(() => runSearch(v), 260);
});
let afTimer;
document.getElementById('authorfilter').addEventListener('input', (e) => {
  clearTimeout(afTimer);
  const v = e.target.value;
  afTimer = setTimeout(() => renderAuthors(v), 140);
});
document.getElementById('mobtoggle').onclick = (e) => {
  const b = document.getElementById('browser'); const open = b.classList.toggle('open');
  e.currentTarget.setAttribute('aria-expanded', String(open));
};

/* L'aggancio della colonna autori si MISURA, non si indovina: era scritto a mano
   a 132 px mentre la testata ne occupa 158, e in quella fessura il testo scorreva
   sotto la barra di ricerca. Si ricalcola anche al ridimensionamento, perché
   l'altezza cambia quando il suggerimento va a capo. */
function syncHeadHeight() {
  const bottom = document.querySelector('.searchwrap').getBoundingClientRect().bottom
               + window.scrollY;
  document.documentElement.style.setProperty('--head-h', Math.round(bottom) + 'px');
}
addEventListener('resize', syncHeadHeight);
syncHeadHeight();

document.getElementById('tvclear').onclick = () => {
  if (!tavolo().length) return;
  salvaTavolo([]); toast('Tavolo svuotato');
  if (state.view === 'reader' && state.work) openWork(state.work.id);   // i «✓» tornano «+»
  else if (state.view === 'results') paintHits();
};
document.getElementById('tvexport').onclick = esportaTavolo;
document.getElementById('tvsend').onclick = inviaTavolo;
renderTavolo();

document.getElementById('openrecog').onclick = () => {
  document.getElementById('q').value = '';
  renderRecognizeView();
};

// ── Avvio ──────────────────────────────────────────────────────────────────
(async function init() {
  try {
    await loadIndex();
    // Cucitura dalla pagina-lingua (?lang=la|grc): il ramo è già scelto a monte,
    // quindi il corpus entra direttamente in quella lingua (niente filtro interno).
    const p = new URLSearchParams(location.search);
    const ul = (p.get('lang') || '').toLowerCase();
    const branch = (ul === 'la' || ul === 'latino') ? 'la' : (ul === 'grc' || ul === 'greco') ? 'grc' : null;
    if (branch) state.lang = branch;
    const work = p.get('opera') || p.get('work');
    // Cucitura d'ingresso per il RICONOSCIMENTO: ?riconosci=<testo> apre il
    // brano già incollato e avvia il confronto. È il ponte che il Translator
    // userà per chiedere «da dove viene la versione su cui sto lavorando?».
    const brano = p.get('riconosci') || p.get('text');
    if (brano && p.has('riconosci')) {
      renderAuthors('');
      renderRecognizeView(brano);
    } else if (work && state.index.works.some(w => w.id === work)) {
      renderAuthors('');
      await openWork(work, p.get('loc') || undefined);
    } else {
      renderWelcome();
    }
    loadManifest();                         // si scalda l'indice senza bloccare
  } catch (err) {
    $stage.innerHTML = `<div class="empty">Non riesco a caricare il catalogo del corpus.<br><small>${escapeHtml(String(err))}</small><br><br>Apri la pagina tramite un server locale (es. <code>python -m http.server</code>): i <code>fetch</code> dei dati non funzionano da <code>file://</code>.</div>`;
    console.error(err);
  }
})();
