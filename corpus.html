<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Poetrify · Corpus dei testi antichi</title>
<!-- Anti-flash tema (D2): imposta [data-theme] prima del paint -->
<script>(function(){try{var t=localStorage.getItem('poetrify-theme');if(t!=='dark'&&t!=='light'){t=matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';}document.documentElement.setAttribute('data-theme',t);}catch(e){}})();</script>
<!-- Font self-hosted (vendor/fonts/) — GreekTimes copre il greco POLITONICO -->
<link rel="stylesheet" href="vendor/fonts/fonts.css">
<!-- Token condivisi (fonte unica del design system · shared/) -->
<link rel="stylesheet" href="shared/poetrify-tokens.css">
<style>
/* I token vivono in shared/poetrify-tokens.css (armonizzazione strutturale).
   Qui restano solo le regole specifiche del Corpus. */
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  font-family: var(--font-read);
  color: var(--ink);
  background: var(--ivory);
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
}
body { display: flex; flex-direction: column; }
button { font-family: inherit; cursor: pointer; }
/* colore=lingua del lettore: in shared/poetrify-tokens.css (body[data-lang]). */

/* ── Accessibilità: selezione, fuoco, altezza della testata ───────
   La selezione segue tema E lingua: era un indaco fisso al 14%, che sul fondo
   scuro spariva (1,02:1) e nel ramo latino restava blu mentre tutto il resto
   era rosso. `--head-h` la misura JS: la colonna si agganciava a 132 px contro
   una testata che ne occupa 158, lasciando una fessura in cui il testo scorreva. */
:root { --select-bg: rgba(24,0,172,.20); --head-h: 158px; --hit-bg: rgba(251,227,138,.5); }
:root[data-theme="dark"] { --select-bg: rgba(169,156,255,.34); --hit-bg: rgba(240,198,116,.15); }
body[data-lang="la"] { --select-bg: rgba(162,46,55,.22); }
:root[data-theme="dark"] body[data-lang="la"] { --select-bg: rgba(229,138,144,.32); }
::selection { background: var(--select-bg); }

/* Un solo indicatore di fuoco per tutta la pagina, sull'accento della lingua.
   Prima due campi lo toglievano con `outline: none` senza rimpiazzarlo: chi
   naviga da tastiera perdeva del tutto il segno di dov'era. */
:where(a, button, input, [tabindex]):focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
  border-radius: var(--radius-sm);
}

/* ── Masthead ─────────────────────────────────────────────────── */
.topbar {
  display: flex; align-items: center; gap: 20px;
  padding: 14px clamp(16px, 4vw, 40px);
  border-bottom: 1px solid var(--rule-soft);
  background: var(--paper);
  position: sticky; top: 0; z-index: 20;
}
.home {
  display: inline-flex; align-items: center; gap: 6px;
  font-family: var(--font-ui); font-size: 13px; font-weight: 600;
  color: var(--sepia); text-decoration: none; white-space: nowrap;
  padding: 6px 10px; border-radius: 8px; transition: background .15s, color .15s;
}
.home:hover { background: var(--cream); color: var(--primary); }
.brand { display: flex; flex-direction: column; line-height: 1.05; }
.brand .mark {
  font-family: var(--font-display); font-size: 24px; font-weight: 700;
  color: var(--primary); letter-spacing: -.01em;
}
.brand .sub {
  font-family: var(--font-ui); font-size: 10.5px; font-weight: 600;
  text-transform: uppercase; letter-spacing: .18em; color: var(--sepia); margin-top: 3px;
}

/* ── Barra di ricerca ─────────────────────────────────────────── */
.searchwrap { padding: 18px clamp(16px, 4vw, 40px) 6px; background: var(--paper); }
.searchbox { position: relative; max-width: 760px; margin: 0 auto; }
.searchbox svg { position: absolute; left: 16px; top: 50%; transform: translateY(-50%); width: 19px; height: 19px; color: var(--sepia); pointer-events: none; }
#q {
  width: 100%; font-family: var(--font-read); font-size: 17px; color: var(--ink);
  padding: 13px 16px 13px 46px; border: 1.5px solid var(--rule);
  border-radius: 12px; background: var(--ivory); transition: border-color .15s, box-shadow .15s;
}
/* Anello esplicito sui campi: `:focus-visible` dipende da un'euristica del
   browser, e su un campo di ricerca non deve esserci dubbio su dove sia il fuoco. */
#q:focus, #authorfilter:focus { outline: 2px solid var(--accent); outline-offset: 2px; }
#q:focus { border-color: var(--primary); box-shadow: 0 0 0 4px var(--primary-pale); }
#q::placeholder { color: var(--sepia); }
.searchhint {
  max-width: 760px; margin: 6px auto 0; text-align: center;
  font-family: var(--font-ui); font-size: 11.5px; color: var(--sepia);
}
.searchhint b { color: var(--primary); font-weight: 700; }

/* ── La citazione riconosciuta ────────────────────────────────────
   Sta sotto la casella e dichiara come ha capito: un campo che indovina in
   silenzio è magico finché non sbaglia, uno che lo dice resta prevedibile. */
#cite { max-width: 760px; margin: 8px auto 0; }
.citebox {
  border: 1.5px solid var(--accent); border-radius: var(--radius-lg);
  background: var(--paper); overflow: hidden; box-shadow: var(--shadow-sm);
}
.cite-cap {
  display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap;
  padding: 9px 14px; background: var(--cream); border-bottom: 1px solid var(--rule-soft);
}
.cite-kind {
  font-family: var(--font-ui); font-size: 10px; font-weight: 700; letter-spacing: .06em;
  text-transform: uppercase; color: var(--accent);
}
.cite-who { font-family: var(--font-display); font-size: 15px; font-weight: 700; color: var(--ink); }
.cite-row {
  display: flex; align-items: baseline; gap: 12px; width: 100%; text-align: left;
  padding: 9px 14px; background: none; border: none; border-top: 1px solid var(--rule-soft);
  transition: background .12s;
}
.cite-row:first-of-type { border-top: none; }
.cite-row:hover { background: var(--cream); }
.cite-row .ck {
  font-family: var(--font-mono); font-size: 11px; color: var(--sepia);
  flex: 0 0 76px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.cite-row .cv { font-family: var(--font-read); font-size: 14.5px; color: var(--ink); }
.cite-row .cgo { margin-left: auto; font-family: var(--font-ui); font-size: 11px; font-weight: 700; color: var(--accent); }
.searchhint .recog {
  font: inherit; font-weight: 700; color: var(--accent); background: none;
  border: none; padding: 0 0 0 6px; text-decoration: underline; text-underline-offset: 3px;
}

/* ── Riconoscimento di un brano ───────────────────────────────── */
.recog-head { margin-bottom: 4px; }
.recog-head h1 { font-family: var(--font-display); font-size: clamp(25px, 3.6vw, 34px); font-weight: 700; letter-spacing: -.015em; }
.recog-head p { max-width: 60ch; margin-top: 10px; font-size: 16px; color: var(--sepia); line-height: 1.55; }
#brano {
  width: 100%; min-height: 168px; margin-top: 18px; resize: vertical;
  font-family: var(--font-read); font-size: 17px; line-height: 1.65; color: var(--ink);
  padding: 16px 18px; border: 1.5px solid var(--rule); border-radius: var(--radius-lg);
  background: var(--parchment);
}
#brano:focus { outline: 2px solid var(--accent); outline-offset: 2px; border-color: var(--accent); }
#brano::placeholder { color: var(--sepia); }
.recog-bar { display: flex; gap: 12px; align-items: center; margin-top: 12px; flex-wrap: wrap; }
.btn-primary {
  font-family: var(--font-ui); font-size: 14px; font-weight: 700; color: var(--on-primary);
  background: var(--accent); border: none; border-radius: var(--radius-md); padding: 10px 20px;
  transition: filter .13s;
}
.btn-primary:hover { filter: brightness(1.08); }
.btn-primary[disabled] { opacity: .5; cursor: default; }
.recog-note { font-family: var(--font-ui); font-size: 12px; color: var(--sepia); }

.match {
  width: 100%; text-align: left; background: var(--paper); border: 1px solid var(--rule-soft);
  border-left: 4px solid var(--rule); border-radius: var(--radius-lg);
  padding: 15px 18px; margin: 12px 0; transition: box-shadow .13s, border-color .13s;
}
.match:hover { box-shadow: var(--shadow); }
.match.la { --accent: var(--accent-lat); } .match.grc { --accent: var(--accent-gr); }
.match.top { border-left-color: var(--accent); border-color: var(--accent); }
.match-top { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.score {
  font-family: var(--font-display); font-size: 26px; font-weight: 700; color: var(--accent);
  font-variant-numeric: tabular-nums; line-height: 1;
}
.score small { font-size: 13px; font-weight: 600; }
.match-who { font-family: var(--font-display); font-size: 18px; font-weight: 700; }
.match-loc { font-family: var(--font-mono); font-size: 11.5px; color: var(--sepia); margin-left: auto; }
.meter { height: 5px; background: var(--cream); border-radius: 3px; margin-top: 10px; overflow: hidden; }
.meter i { display: block; height: 100%; background: var(--accent); border-radius: 3px; }
.match-snip { font-family: var(--font-read); font-size: 15.5px; line-height: 1.55; color: var(--ink-soft); margin-top: 10px; }
.match.grc .match-snip { font-family: var(--font-classical); font-size: 16.5px; }
.match-why { font-family: var(--font-ui); font-size: 11.5px; color: var(--sepia); margin-top: 9px; }
.match-why b { color: var(--accent); }

/* ── Layout a due pannelli ────────────────────────────────────── */
.layout {
  display: grid; grid-template-columns: 300px minmax(0, 1fr);
  gap: 0; flex: 1; min-height: 0;
}
.browser {
  border-right: 1px solid var(--rule-soft); background: var(--paper);
  padding: 20px 16px 60px; overflow-y: auto; max-height: calc(100vh - var(--head-h));
  position: sticky; top: var(--head-h);
}
.browser h2 {
  font-family: var(--font-ui); font-size: 10.5px; font-weight: 700;
  text-transform: uppercase; letter-spacing: .1em; color: var(--sepia);
  margin: 0 6px 10px; display: flex; align-items: baseline; gap: 6px;
}
.browser h2 .n { margin-left: auto; font-family: var(--font-mono); font-size: 10px; color: var(--sepia); }
#authorfilter {
  width: 100%; font-family: var(--font-ui); font-size: 13px; color: var(--ink);
  padding: 7px 11px; border: 1px solid var(--rule); border-radius: 8px;
  background: var(--ivory); margin-bottom: 10px;
}
#authorfilter:focus { border-color: var(--primary); }
#authorfilter::placeholder { color: var(--sepia); }
.arow {
  display: flex; align-items: baseline; gap: 8px; width: 100%; text-align: left;
  background: none; border: none; padding: 6px 9px; border-radius: 8px;
  color: var(--ink); transition: background .12s;
}
.arow:hover { background: var(--cream); }
.arow[aria-current="true"] { background: var(--cream); box-shadow: inset 3px 0 0 var(--accent); }
.arow .aname { font-family: var(--font-display); font-size: 15px; font-weight: 600; }
.arow.la .aname { color: var(--accent-lat); }
.arow.grc .aname { color: var(--accent-gr); }
.arow .an { margin-left: auto; font-family: var(--font-mono); font-size: 10px; color: var(--sepia); }

/* ── Stage ────────────────────────────────────────────────────── */
.stage { padding: clamp(20px, 3vw, 40px) clamp(16px, 4vw, 48px) 80px; overflow-x: hidden; }
.stage-inner { max-width: 900px; margin: 0 auto; }

.welcome-hero { text-align: center; padding: 18px 0 6px; }
.welcome-hero h1 { font-family: var(--font-display); font-size: clamp(30px, 5vw, 44px); font-weight: 700; color: var(--ink); letter-spacing: -.015em; }
.welcome-hero p { max-width: 32rem; margin: 14px auto 0; font-size: 17px; line-height: 1.6; color: var(--sepia); }
.stats-row { display: flex; justify-content: center; flex-wrap: wrap; gap: 10px; margin: 24px 0 8px; }
.stat { background: var(--paper); border: 1px solid var(--rule-soft); border-radius: var(--radius-lg); padding: 10px 18px; text-align: center; }
.stat .n { font-family: var(--font-display); font-size: 23px; font-weight: 700; color: var(--primary); font-variant-numeric: tabular-nums; }
.stat .l { font-family: var(--font-ui); font-size: 10.5px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; color: var(--sepia); margin-top: 1px; }

/* ── Faccette ─────────────────────────────────────────────────── */
.facetbar { display: flex; gap: 7px; flex-wrap: wrap; align-items: center; margin-top: 14px; }
.facetbar + .facetbar { margin-top: 8px; }
.facet-lbl {
  font-family: var(--font-ui); font-size: 10px; font-weight: 700; letter-spacing: .09em;
  text-transform: uppercase; color: var(--sepia); margin-right: 2px; min-width: 52px;
}
.facet {
  font-family: var(--font-ui); font-size: 11.5px; font-weight: 600; padding: 5px 11px;
  border-radius: var(--radius-pill); border: 1px solid var(--rule); color: var(--ink-soft);
  background: var(--paper); transition: all .13s;
}
.facet:hover { border-color: var(--accent); color: var(--accent); }
.facet .c { color: var(--sepia); font-variant-numeric: tabular-nums; font-size: 10px; margin-left: 5px; }
.facet[aria-pressed="true"] { background: var(--primary); border-color: var(--primary); color: var(--on-primary); }
.facet[aria-pressed="true"] .c { color: var(--on-primary); opacity: .75; }
.resultline {
  font-family: var(--font-ui); font-size: 12.5px; color: var(--sepia);
  margin: 20px 0 12px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
}
.resultline b { color: var(--ink); }
.clearf {
  font-family: var(--font-ui); font-size: 11px; font-weight: 600; color: var(--accent);
  background: none; border: none; text-decoration: underline; padding: 0;
}

/* ══ HOME ESSENZIALE · riprendi + categorie ══════════════════════ */
.band { margin-top: 30px; }
.band-h {
  display: flex; align-items: baseline; gap: 10px; margin-bottom: 13px; flex-wrap: wrap;
  font-family: var(--font-ui); font-size: 10.5px; font-weight: 700;
  letter-spacing: .11em; text-transform: uppercase; color: var(--sepia);
}
.band-h .more {
  margin-left: auto; font-family: var(--font-ui); font-size: 11.5px; font-weight: 700;
  letter-spacing: 0; text-transform: none; color: var(--accent);
  background: none; border: none; padding: 0; text-decoration: underline; text-underline-offset: 3px;
}
/* Riprendi */
.resume { display: grid; grid-template-columns: repeat(auto-fill, minmax(228px, 1fr)); gap: 12px; }
.rcard {
  text-align: left; background: var(--paper); border: 1px solid var(--rule-soft);
  border-left: 3px solid var(--rule); border-radius: var(--radius-lg); padding: 14px 15px;
  transition: box-shadow .15s, transform .15s;
}
.rcard:hover { box-shadow: var(--shadow-lift); transform: translateY(-2px); }
.rcard.la { border-left-color: var(--accent-lat); }
.rcard.grc { border-left-color: var(--accent-gr); }
.rcard .rt { font-family: var(--font-display); font-size: 17.5px; font-weight: 700; line-height: 1.18; }
.rcard .ra { font-family: var(--font-ui); font-size: 11.5px; color: var(--sepia); margin-top: 3px; }
.rcard .rw {
  font-family: var(--font-mono); font-size: 10px; color: var(--sepia); margin-top: 10px;
  display: flex; justify-content: space-between; gap: 8px;
}
.rcard .rp { height: 4px; background: var(--cream); border-radius: 2px; margin-top: 6px; overflow: hidden; }
.rcard .rp i { display: block; height: 100%; border-radius: 2px; background: var(--accent); }
.rcard.la .rp i { background: var(--accent-lat); }
.rcard.grc .rp i { background: var(--accent-gr); }

/* Categorie del catalogo */
.axis { display: flex; gap: 5px; flex-wrap: wrap; margin-bottom: 13px; }
.axis button {
  font-family: var(--font-ui); font-size: 11.5px; font-weight: 700; padding: 6px 14px;
  border-radius: var(--radius-pill); border: 1px solid var(--rule); color: var(--sepia);
  background: var(--paper); transition: all .13s;
}
.axis button:hover { border-color: var(--accent); color: var(--accent); }
.axis button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--on-primary); }
.cats { display: grid; grid-template-columns: repeat(auto-fill, minmax(156px, 1fr)); gap: 11px; }
.cat {
  text-align: left; background: var(--paper); border: 1px solid var(--rule-soft);
  border-radius: var(--radius-lg); padding: 13px 14px 11px;
  transition: border-color .15s, box-shadow .15s, transform .15s;
}
.cat:hover { border-color: var(--accent); box-shadow: var(--shadow-lift); transform: translateY(-2px); }
.cat .cn { font-family: var(--font-display); font-size: 17px; font-weight: 700; line-height: 1.15; }
.cat .cc { font-family: var(--font-ui); font-size: 11.5px; color: var(--sepia); margin-top: 3px; }
/* Il filetto è in ottone, non nel colore-lingua: qui il colore significherebbe
   una lingua che la categoria non ha (l'oratoria è greca e latina insieme). */
.cat .cb { height: 3px; background: var(--cream); border-radius: 2px; margin-top: 10px; overflow: hidden; }
.cat .cb i { display: block; height: 100%; background: var(--brass); opacity: .75; border-radius: 2px; }
.cat.all { background: var(--cream); border-style: dashed; }
.cat.all .cn { color: var(--accent); }

/* ══ SFOGLIO RAMIFICATO ══════════════════════════════════════════ */
.crumb {
  display: flex; align-items: center; gap: 7px; flex-wrap: wrap;
  font-family: var(--font-ui); font-size: 12px; color: var(--sepia); margin-bottom: 18px;
}
.crumb button {
  font: inherit; color: var(--accent); background: none; border: none; padding: 2px 0;
  font-weight: 600; text-decoration: underline; text-underline-offset: 3px;
}
.crumb .sep { opacity: .5; }
.crumb .cur { color: var(--ink); font-weight: 700; }
.crumb .cnt { margin-left: auto; font-family: var(--font-mono); font-size: 10.5px; }

.lits { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 14px; }
.lit {
  text-align: left; background: var(--paper); border: 1px solid var(--rule-soft);
  border-top: 4px solid var(--rule); border-radius: var(--radius-lg);
  padding: 22px 22px 18px; transition: box-shadow .15s, transform .15s;
}
.lit:hover { box-shadow: var(--shadow-lift); transform: translateY(-2px); }
.lit.la { border-top-color: var(--accent-lat); }
.lit.grc { border-top-color: var(--accent-gr); }
.lit .ln { font-family: var(--font-display); font-size: 24px; font-weight: 700; line-height: 1.1; }
.lit.la .ln { color: var(--accent-lat); }
.lit.grc .ln { color: var(--accent-gr); }
.lit .lo { font-family: var(--font-classical); font-size: 15.5px; color: var(--sepia); margin-top: 4px; }
.lit .lc { font-family: var(--font-ui); font-size: 12.5px; color: var(--sepia); margin-top: 12px; }
.lit .le { display: flex; gap: 5px; flex-wrap: wrap; margin-top: 9px; font-family: var(--font-ui); font-size: 10.5px; color: var(--sepia); }
.lit .le span { background: var(--cream); border-radius: var(--radius-pill); padding: 2px 9px; }

/* Le colonne si allargano da 158 a 268: da quando la card porta la didascalia,
   a 158px il testo usciva a canne d'organo, due o tre parole per riga. */
.epochs { display: grid; grid-template-columns: repeat(auto-fit, minmax(268px, 1fr)); gap: 11px; }
.ep {
  text-align: left; background: var(--paper); border: 1px solid var(--rule-soft);
  border-radius: var(--radius-lg); padding: 14px 15px 12px;
  transition: border-color .15s, box-shadow .15s, transform .15s;
}
.ep:hover { border-color: var(--accent); box-shadow: var(--shadow-lift); transform: translateY(-2px); }
.ep .ew { font-family: var(--font-mono); font-size: 9.5px; color: var(--brass); }
.ep .en { font-family: var(--font-display); font-size: 18px; font-weight: 700; margin-top: 4px; line-height: 1.15; }
.ep .ec { font-family: var(--font-ui); font-size: 11.5px; color: var(--sepia); margin-top: 3px; }
/* La didascalia è prosa, non etichetta: va in serif di lettura, con la misura
   di riga larga che il testo di pensiero vuole. Sta sopra al conteggio perché
   il contesto viene prima del numero. */
.ep .ed {
  font-family: var(--font-read); font-size: 13px; line-height: 1.5;
  color: var(--ink-soft); margin-top: 7px; text-wrap: pretty;
}
.ep .ed i { font-style: italic; }
.ep .ed i[lang="grc"] { font-family: var(--font-classical); font-style: normal; }
.ep .ec { margin-top: 9px; }
.ep .eb { height: 3px; background: var(--cream); border-radius: 2px; margin-top: 10px; overflow: hidden; }
.ep .eb i { display: block; height: 100%; background: var(--brass); opacity: .7; border-radius: 2px; }

.alpha { display: flex; gap: 3px; flex-wrap: wrap; margin-bottom: 14px; }
.alpha button {
  font-family: var(--font-ui); font-size: 11px; font-weight: 700; width: 25px; height: 25px;
  border-radius: var(--radius-sm); color: var(--sepia); border: 1px solid var(--rule-soft);
  background: var(--paper); padding: 0;
}
.alpha button:hover:not([disabled]) { border-color: var(--accent); color: var(--accent); }
.alpha button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--on-primary); }
.alpha button[disabled] { opacity: .3; cursor: default; }
.auths { display: grid; grid-template-columns: repeat(auto-fill, minmax(186px, 1fr)); gap: 9px; }
.auth {
  display: block; text-align: left;
  padding: 9px 12px; border: 1px solid var(--rule-soft); border-radius: var(--radius-md);
  background: var(--paper); transition: border-color .15s;
}
.auth:hover { border-color: var(--accent); }
.auth .ar { display: flex; align-items: baseline; gap: 8px; }
.auth .an { font-family: var(--font-display); font-size: 16px; font-weight: 600; }
.auth .ac { margin-left: auto; font-family: var(--font-mono); font-size: 10px; color: var(--sepia); }
/* Il nome per esteso · in tono minore, perché è l'apposizione del nome d'uso e
   non deve contendergli la testa. Il grassetto rialza l'elemento corrente:
   sulla riga smorzata è lui che si legge per primo. */
.auth .af {
  font-family: var(--font-read); font-size: 12px; line-height: 1.35;
  color: var(--sepia); margin-top: 2px;
}
.auth .af[lang="grc"] { font-family: var(--font-classical); font-size: 13px; }
.auth .af b { font-weight: 700; color: var(--ink-soft); }

.sortbar { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; margin-bottom: 14px; }
.sortbar .sl {
  font-family: var(--font-ui); font-size: 10px; font-weight: 700; letter-spacing: .09em;
  text-transform: uppercase; color: var(--sepia); margin-right: 3px;
}
.sortbar button {
  font-family: var(--font-ui); font-size: 11.5px; font-weight: 700; padding: 5px 13px;
  border-radius: var(--radius-pill); border: 1px solid var(--rule); color: var(--sepia); background: var(--paper);
  transition: all .13s;
}
.sortbar button:hover { border-color: var(--accent); color: var(--accent); }
.sortbar button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--on-primary); }

/* ── Griglia opere ────────────────────────────────────────────── */
.catalog { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 14px; }
.catcard {
  text-align: left; background: var(--paper); border: 1px solid var(--rule-soft);
  border-radius: var(--radius-lg); padding: 16px 16px 14px; border-left: 4px solid var(--rule);
  transition: border-color .15s, box-shadow .15s, transform .15s;
  display: flex; flex-direction: column;   /* vedi «fasce disuguali» qui sotto */
}
/* Fasce disuguali · le card di una riga non hanno tutte lo stesso numero di
   fasce (chi ha il titolo italiano ne ha una in più di chi non ce l'ha), e la
   griglia le pareggia in altezza: senza accorgimenti autore e targhette
   galleggerebbero ad altezze diverse lungo la riga. Lo spazio in eccesso lo
   assorbe il blocco dei titoli, così la riga dell'autore fa da riga di base
   comune. Il `nth-last-child(3)` è l'ultima fascia di titolo qualunque sia la
   forma della card: [titolo, originale?, autore, targhette]. */
.catcard > div:nth-last-child(3) { padding-bottom: 7px; }
.catcard:hover { box-shadow: var(--shadow-lift); transform: translateY(-2px); }
.catcard.la  { border-left-color: var(--accent-lat); }
.catcard.grc { border-left-color: var(--accent-gr); }
/* ── Card dell'opera · TRE FASCE ────────────────────────────────
   1ª titolo d'uso italiano · 2ª titolo in lingua originale · 3ª autore.
   La seconda compare solo quando dice qualcosa di diverso dalla prima: se
   l'uso italiano È il titolo originale (De rerum natura, Satyricon) ripeterla
   sarebbe rumore. Il font classico va sulla fascia che porta davvero il greco,
   non sul titolo italiano. */
.catcard .ctitle { font-family: var(--font-display); font-size: 18.5px; font-weight: 700; color: var(--ink); line-height: 1.15; }
.catcard .ctitle.orig { font-family: var(--font-classical); }
.catcard .corig { font-family: var(--font-read); font-size: 14px; font-style: italic; color: var(--ink-soft); margin-top: 3px; line-height: 1.3; }
.catcard .corig.gr { font-family: var(--font-classical); font-style: normal; font-size: 15px; }
.catcard .corig .en {
  font-family: var(--font-ui); font-size: 8.5px; font-weight: 700; letter-spacing: .05em;
  text-transform: uppercase; border: 1px dashed var(--rule); border-radius: var(--radius-pill);
  padding: 1px 6px; color: var(--sepia); margin-left: 5px; vertical-align: 1px; font-style: normal;
}
.catcard .cauthor {
  font-family: var(--font-ui); font-size: 12px; font-weight: 600; color: var(--sepia);
  margin-top: auto; padding-top: 7px; border-top: 1px solid var(--rule-soft);
}
.catcard .cmeta { font-family: var(--font-ui); font-size: 10.5px; color: var(--sepia); margin-top: 9px; display: flex; gap: 5px; flex-wrap: wrap; }
.catcard .cmeta span { padding: 2px 8px; border-radius: var(--radius-pill); background: var(--cream); }
.catcard .cmeta span.inf { border: 1px dashed var(--rule); background: transparent; }
/* L'anno · in cifre monospaziate, così le date si incolonnano all'occhio
   quando si scorre un elenco cronologico, e in ottone perché è un dato
   d'edizione — la stessa famiglia dei filetti e delle testatine. */
.catcard .cmeta span.yr {
  font-family: var(--font-mono); background: transparent;
  border: 1px solid var(--brass); color: var(--brass); padding: 1px 7px;
}
/* La riga che dichiara su cosa si regge l'ordine cronologico. */
.sortnote {
  font-family: var(--font-ui); font-size: 11px; color: var(--sepia);
  margin: -6px 0 12px; padding-left: 2px;
}
/* Separatore di genere · attraversa tutta la griglia (`1 / -1`), altrimenti si
   accomoderebbe in una colonna come se fosse una scheda. Filetto d'ottone e
   testatina in maiuscoletto: è un'intestazione d'edizione, non un'etichetta di
   interfaccia — l'ottone qui fa quello che gli compete, il filetto, non la
   campitura. */
.gsep {
  grid-column: 1 / -1; display: flex; align-items: center; gap: 11px;
  margin: 8px 0 2px;
}
.gsep:first-child { margin-top: 0; }
.gsep span {
  font-family: var(--font-ui); font-size: 10.5px; font-weight: 700;
  letter-spacing: .11em; text-transform: uppercase; color: var(--brass);
  white-space: nowrap;
}
.gsep::after {
  content: ''; flex: 1; height: 1px; background: var(--brass); opacity: .35;
}
.sentinel { height: 1px; }
.moreline {
  text-align: center; font-family: var(--font-ui); font-size: 12px; color: var(--sepia);
  padding: 18px 0; display: flex; gap: 12px; align-items: center; justify-content: center; flex-wrap: wrap;
}
/* Comando esplicito accanto allo scorrimento automatico: un caricamento che si
   attiva SOLO scorrendo è inoperabile da tastiera e con lo screen reader. */
.btn-more {
  font-family: var(--font-ui); font-size: 12.5px; font-weight: 700; color: var(--accent);
  background: var(--paper); border: 1.5px solid var(--rule); border-radius: var(--radius-pill);
  padding: 6px 16px; transition: border-color .13s;
}
.btn-more:hover { border-color: var(--accent); }

/* ── Pagina autore ────────────────────────────────────────────── */
.author-head { border-bottom: 2px solid var(--accent); padding-bottom: 14px; margin-bottom: 6px; }
.author-head .rk { font-family: var(--font-ui); font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .1em; color: var(--accent); }
.author-head h1 { font-family: var(--font-display); font-size: clamp(26px, 4vw, 36px); font-weight: 700; line-height: 1.1; margin-top: 5px; }
.author-head .byline { font-family: var(--font-ui); font-size: 13px; color: var(--sepia); margin-top: 7px; }
.backlink {
  font-family: var(--font-ui); font-size: 12px; font-weight: 600; color: var(--sepia);
  background: none; border: none; padding: 4px 0; margin-bottom: 12px;
}
.backlink:hover { color: var(--accent); }

/* ── Risultati ricerca ────────────────────────────────────────── */
.results-head { display: flex; align-items: baseline; gap: 10px; margin-bottom: 4px; flex-wrap: wrap; }
.results-head h1 { font-family: var(--font-display); font-size: 24px; font-weight: 700; }
.results-head .count { font-family: var(--font-ui); font-size: 13px; color: var(--sepia); }
.sect-lbl {
  font-family: var(--font-ui); font-size: 10.5px; font-weight: 700; letter-spacing: .1em;
  text-transform: uppercase; color: var(--sepia); margin: 26px 0 10px;
  display: flex; align-items: center; gap: 9px;
}
.sect-lbl::after { content: ""; flex: 1; height: 1px; background: var(--rule-soft); }
.stageline {
  font-family: var(--font-ui); font-size: 12px; color: var(--sepia);
  display: flex; align-items: center; gap: 9px; padding: 9px 13px; background: var(--cream);
  border-radius: var(--radius-md); flex-wrap: wrap; margin-bottom: 4px;
}
.stageline b { color: var(--ink); }
.prog { height: 3px; background: var(--rule-soft); border-radius: 2px; flex: 1; min-width: 60px; overflow: hidden; }
.prog i { display: block; height: 100%; background: var(--accent); border-radius: 2px; transition: width .2s; }
/* ══ CONCORDANZA (KWIC) ══════════════════════════════════════════
   La forma con cui la filologia legge cento occorrenze insieme da un secolo:
   le occorrenze incolonnate sulla parola, il contesto a destra e a sinistra.
   L'occhio si àncora a un asse fisso e scorre in verticale. */
.modes { margin-left: auto; display: flex; gap: 4px; }
.modes button {
  font-family: var(--font-ui); font-size: 10.5px; font-weight: 700; padding: 4px 11px;
  border-radius: var(--radius-pill); border: 1px solid var(--rule); color: var(--sepia);
  background: var(--paper); transition: all .13s;
}
.modes button:hover { border-color: var(--accent); color: var(--accent); }
.modes button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--on-primary); }

/* Distribuzione per autore. I colori sono quelli della LINGUA — la sola
   semantica cromatica del prodotto — ma nello «scalino da grafico»: il blu
   d'inchiostro #1800AC, nato per il testo, come barra risulta molto più scuro
   del rosso e falserebbe il confronto fra le proporzioni. */
:root { --lat-chart: #A22E37; --grc-chart: #4a3fd0; }
:root[data-theme="dark"] { --lat-chart: #d2727a; --grc-chart: #8b7dff; }
.dist { display: flex; flex-direction: column; gap: 5px; margin: 4px 0 18px; }
.dist-row { display: grid; grid-template-columns: 132px 1fr 46px; gap: 10px; align-items: center; }
.dist-lab {
  font-family: var(--font-ui); font-size: 11.5px; color: var(--ink-soft); text-align: right;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.dist-track { height: 13px; background: var(--cream); border-radius: var(--radius-sm); overflow: hidden; }
.dist-fill { height: 100%; border-radius: 3px; }
.dist-fill.la { background: var(--lat-chart); }
.dist-fill.grc { background: var(--grc-chart); }
.dist-val { font-family: var(--font-mono); font-size: 11px; color: var(--sepia); font-variant-numeric: tabular-nums; }
.dist-leg { font-family: var(--font-ui); font-size: 11px; color: var(--sepia); display: flex; gap: 16px; flex-wrap: wrap; margin-top: 2px; }
.dist-leg i { display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin-right: 5px; }

.kwic-wrap { overflow-x: auto; }
table.kwic { border-collapse: collapse; width: 100%; font-size: 15px; }
table.kwic td { padding: 5px 6px; border-top: 1px solid var(--rule-soft); vertical-align: baseline; }
table.kwic tr { cursor: pointer; }
table.kwic tr:hover td { background: var(--cream); }
table.kwic tr:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
.kw-ref { font-family: var(--font-mono); font-size: 10.5px; color: var(--sepia); white-space: nowrap; }
.kw-ref b { color: var(--accent); font-weight: 700; }
.kw-l { text-align: right; white-space: nowrap; color: var(--ink-soft); }
.kw-k { text-align: center; white-space: nowrap; font-weight: 700; background: var(--mark); border-radius: 3px; padding: 0 5px !important; }
.kw-r { text-align: left; white-space: nowrap; color: var(--ink-soft); }
tr.la .kw-ref b { color: var(--accent-lat); }
tr.grc .kw-ref b { color: var(--accent-gr); }
tr.grc .kw-l, tr.grc .kw-k, tr.grc .kw-r { font-family: var(--font-classical); font-size: 16px; }

.res {
  width: 100%; text-align: left; background: var(--paper); border: 1px solid var(--rule-soft);
  border-left: 3px solid var(--rule); border-radius: var(--radius-md); padding: 12px 15px; margin: 9px 0;
  transition: border-color .13s, box-shadow .13s;
}
.res:hover { box-shadow: var(--shadow-sm); border-left-color: var(--accent); }
.res.la  { --accent: var(--accent-lat); }
.res.grc { --accent: var(--accent-gr); }
.res .rref { font-family: var(--font-ui); font-size: 11.5px; font-weight: 600; color: var(--sepia); margin-bottom: 5px; }
.res .rref b { color: var(--accent); }
.res .rtext { font-family: var(--font-read); font-size: 16px; line-height: 1.5; color: var(--ink); }
.res.grc .rtext { font-family: var(--font-classical); font-size: 17px; }
mark { background: var(--mark); color: inherit; border-radius: 3px; padding: 0 1px; }

/* ── Lettore ──────────────────────────────────────────────────── */
.reader-head { border-bottom: 2px solid var(--accent); padding-bottom: 16px; margin-bottom: 4px; }
.reader-head .rk { font-family: var(--font-ui); font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .1em; color: var(--accent); }
.reader-head h1 { font-family: var(--font-display); font-size: clamp(28px, 4vw, 38px); font-weight: 700; color: var(--ink); line-height: 1.1; margin-top: 6px; }
/* Il carattere classico va SOLO sulla riga che porta davvero l'antico: se in
   testa c'è il titolo italiano, deve restare nel font da display. */
body[data-lang="grc"] .reader-head h1.antico { font-family: var(--font-classical); font-weight: 700; }
.reader-head .rtitle-orig { font-family: var(--font-read); font-size: 19px; font-style: italic; color: var(--ink-soft); margin-top: 4px; }
body[data-lang="grc"] .reader-head .rtitle-orig { font-family: var(--font-classical); font-style: normal; font-size: 20px; }
.reader-head .byline { font-family: var(--font-read); font-size: 17px; font-style: italic; color: var(--sepia); margin-top: 6px; }
.reader-head .byline button { font: inherit; color: inherit; background: none; border: none; text-decoration: underline; text-underline-offset: 3px; padding: 0; }
.reader-head .byline button:hover { color: var(--accent); }
.reader-head .src { font-family: var(--font-mono); font-size: 10.5px; color: var(--sepia); margin-top: 10px; word-break: break-all; }
.reader-head .src a { color: var(--accent); text-decoration: none; }
.book-nav { display: flex; flex-wrap: wrap; gap: 6px; margin: 18px 0 8px; }
.book-nav .blabel { font-family: var(--font-ui); font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; color: var(--sepia); align-self: center; margin-right: 4px; }
.book-nav button {
  font-family: var(--font-ui); font-size: 13px; font-weight: 600; min-width: 34px;
  padding: 5px 11px; border-radius: var(--radius-md); border: 1.5px solid var(--rule); background: transparent; color: var(--ink); transition: all .13s;
}
.book-nav button:hover { border-color: var(--accent); }
.book-nav button[aria-current="true"] { background: var(--accent); border-color: var(--accent); color: #fff; }

.scroll {
  background: var(--parchment); border: 1px solid var(--parchment-edge);
  border-radius: 14px; padding: clamp(20px, 3vw, 40px) clamp(18px, 3vw, 44px);
  margin-top: 12px; box-shadow: inset 0 1px 0 rgba(255,255,255,.5);
}
.para { position: relative; margin: 0 0 14px; padding-left: 8px; }
.para .loc {
  font-family: var(--font-mono); font-size: 10.5px; color: var(--sepia);
  user-select: none; margin-right: 8px; font-weight: 500;
}
.para .txt { font-family: var(--font-read); font-size: 18px; line-height: 1.72; color: var(--ink); }
body[data-lang="grc"] .para .txt { font-family: var(--font-classical); font-size: 20px; line-height: 1.85; }
.verse { display: flex; align-items: baseline; gap: 14px; padding: 1px 0; }
.verse .ln { flex: 0 0 34px; text-align: right; font-family: var(--font-mono); font-size: 10.5px; color: var(--sepia); user-select: none; }
.verse .vt { font-family: var(--font-read); font-size: 18px; line-height: 1.62; color: var(--ink); }
body[data-lang="grc"] .verse .vt { font-family: var(--font-classical); font-size: 20px; line-height: 1.72; }
/* Il passo raggiunto dalla ricerca si segnala su DUE canali: un fondo tenue e un
   filetto d'accento. Col solo fondo è impossibile soddisfare insieme i due
   vincoli nel tema scuro — distinguersi dalla pergamena (≥3:1) e lasciare
   leggibile il testo che ci sta sopra (≥4,5:1): schiarendolo si perde il testo,
   scurendolo si perde il segnale. Il filetto porta il «sei qui», il fondo resta
   discreto, e il colore segue la lingua. */
.verse:target, .para:target, .unit.flash {
  background: var(--hit-bg);
  box-shadow: inset 3px 0 0 var(--accent);
  border-radius: 6px;
}
.unit.flash { animation: flash 1.8s ease; }
@keyframes flash {
  0%, 45% { background: var(--hit-bg); box-shadow: inset 3px 0 0 var(--accent); }
  100%    { background: transparent;   box-shadow: inset 3px 0 0 transparent; }
}

.unit { border-radius: 6px; }
.unit .acts { display: inline-flex; gap: 4px; margin-left: 8px; opacity: 0; transition: opacity .12s; vertical-align: middle; }
/* `:focus-within` non è un di più: senza, in un libro dell'Iliade restavano
   centinaia di fermate di tabulazione su bottoni invisibili — chi naviga da
   tastiera attraversava il testo a vuoto senza sapere dove si trovava. */
.unit:hover .acts, .unit:focus-within .acts { opacity: 1; }
.acts button {
  font-family: var(--font-ui); font-size: 10.5px; font-weight: 600; color: var(--sepia);
  border: 1px solid var(--rule-soft); background: var(--paper); border-radius: 6px; padding: 2px 7px;
  transition: all .12s;
}
.acts button:hover { color: var(--accent); border-color: var(--accent); }

.loading, .empty { text-align: center; color: var(--sepia); padding: 60px 20px; font-size: 15px; }
.spinner { width: 26px; height: 26px; border: 3px solid var(--rule-soft); border-top-color: var(--accent); border-radius: 50%; margin: 0 auto 14px; animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

/* ══ IL TAVOLO DEI PASSI ═════════════════════════════════════════
   Quando si prepara una versione o una lezione sul lessico non si cerca UN
   passo: se ne raccolgono sei o sette, da autori diversi. Il ripiano resta a
   fondo pagina, sempre visibile finché ha qualcosa dentro. */
.tavolo {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 50;
  background: var(--paper); border-top: 1px solid var(--rule);
  box-shadow: 0 -6px 22px rgba(44,53,57,.10);
}
:root[data-theme="dark"] .tavolo { box-shadow: 0 -6px 22px rgba(0,0,0,.45); }
.tavolo[hidden] { display: none; }
.tv-bar {
  display: flex; align-items: center; gap: 11px; flex-wrap: wrap;
  padding: 10px clamp(14px, 4vw, 40px);
  font-family: var(--font-ui); font-size: 12.5px; color: var(--ink);
}
.tv-bar b { font-weight: 700; }
.tv-cnt {
  background: var(--brass); color: #fff; font-size: 10.5px; font-weight: 700;
  padding: 2px 9px; border-radius: var(--radius-pill);
}
:root[data-theme="dark"] .tv-cnt { color: #14121c; }
.tv-sub { color: var(--sepia); }
.tv-acts { margin-left: auto; display: flex; gap: 7px; flex-wrap: wrap; }
.tv-acts button {
  font-family: var(--font-ui); font-size: 11.5px; font-weight: 700;
  padding: 6px 13px; border-radius: var(--radius-md);
  border: 1px solid var(--rule); color: var(--ink-soft); background: var(--paper);
  transition: all .13s;
}
.tv-acts button:hover { border-color: var(--accent); color: var(--accent); }
.tv-acts button.pri { background: var(--brass); border-color: var(--brass); color: #fff; }
:root[data-theme="dark"] .tv-acts button.pri { color: #14121c; }
.tv-list {
  display: flex; gap: 9px; overflow-x: auto; padding: 0 clamp(14px, 4vw, 40px) 13px;
}
.tv-card {
  flex: 0 0 216px; background: var(--paper); border: 1px solid var(--rule-soft);
  border-left: 3px solid var(--rule); border-radius: var(--radius-md);
  padding: 9px 11px; position: relative;
}
.tv-card.la { border-left-color: var(--accent-lat); }
.tv-card.grc { border-left-color: var(--accent-gr); }
.tv-card .tr { font-family: var(--font-mono); font-size: 9.5px; color: var(--sepia); padding-right: 18px; }
.tv-card .ts { font-family: var(--font-read); font-size: 13px; line-height: 1.45; margin-top: 4px; color: var(--ink-soft);
  display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.tv-card.grc .ts { font-family: var(--font-classical); font-size: 14px; }
.tv-card .tx {
  position: absolute; top: 5px; right: 6px; width: 20px; height: 20px; line-height: 1;
  border: none; background: none; color: var(--sepia); font-size: 15px; border-radius: var(--radius-sm);
}
.tv-card .tx:hover { color: var(--danger-ink); background: var(--cream); }

/* il pulsante «raccogli», nel lettore e nei risultati */
.pick {
  font-family: var(--font-ui); font-size: 10.5px; font-weight: 700;
  border: 1px solid var(--rule-soft); background: var(--paper); color: var(--sepia);
  border-radius: var(--radius-sm); padding: 2px 7px; transition: all .12s;
}
.pick:hover { color: var(--brass); border-color: var(--brass); }
.pick[aria-pressed="true"] { background: var(--brass); border-color: var(--brass); color: #fff; }
:root[data-theme="dark"] .pick[aria-pressed="true"] { color: #14121c; }
td.kw-pick { width: 26px; padding-left: 0 !important; }
/* il ripiano copre il fondo: il contenuto deve poterci scorrere sotto */
body.con-tavolo .stage { padding-bottom: 190px; }

<script>
'use strict';
// ───────────────────────────────────────────────────────────────────────────
// Poetrify · Corpus — biblioteca dei testi antichi (local-first, senza build)
//
// ARCHITETTURA DELLA RICERCA (fase C5 di _build/CORPUS_SPEC.md)
// Con 1.157 opere e ~16 milioni di parole non si può più scandire tutto: si
// interroga un INDICE INVERSO (forma → opere) diviso a spicchi, si restringe il
// campo alle poche opere candidate e solo QUELLE si scaricano e si scandiscono
// per trovare il passo esatto. Il costo dipende da quanto è rara la parola
// cercata, non da quanto è grande il corpus.
// ───────────────────────────────────────────────────────────────────────────
const BASE = 'data/corpus';
const PAGE = 60;              // opere disegnate per volta nel catalogo
const MAX_WORKS_SCAN = 60;    // tetto di opere aperte per una ricerca
const MAX_HITS = 200;         // tetto di passi mostrati

const state = {
  lang: 'all', index: null, docs: {},
  manifest: null, shards: {},
  view: 'home', work: null, book: null, author: null,
  browse: { lang: null, epoch: null, author: null, genre: null },
  axis: 'epoch',        // asse delle card in home: l'EPOCA è il primo taglio
  autOrd: 'crono',      // ordine degli autori: 'crono' (per tempo) | 'alfa'
  /* null = «non l'ho ancora scelto io», e allora decide il gruppo che si sta
     guardando (cronologico se le date coprono almeno metà delle opere). Un
     valore iniziale qui dentro scavalcherebbe sempre quella scelta: e infatti
     con `'trad'` cablato Orazio usciva in ordine tradizionale pur avendo tutte
     e sei le opere datate. */
  sort: null,           // ordinamento delle opere nello sfoglio
  alpha: null,          // iniziale selezionata nella striscia degli autori
  searchMode: 'kwic',   // 'kwic' (concordanza) | 'estesi'
  modeForced: false,    // true quando la vista l'ha scelta l'utente
  lastHits: [], searchTail: null,
  shown: 0, filtered: [],
};

const el = (t, c, txt) => { const e = document.createElement(t); if (c) e.className = c; if (txt != null) e.textContent = txt; return e; };
const $stage = document.getElementById('stage');
const $authors = document.getElementById('authors');
const langName = { la: 'Latino', grc: 'Greco' };
const nf = new Intl.NumberFormat('it-IT');

// Folding accent/case-insensitive con MAPPA verso gli indici originali, per
// evidenziare la porzione esatta anche saltando i diacritici. Deve restare
// IDENTICA a fold() in _build/build_corpus_index.py, o l'indice non combacia.
const COMBINING = /[̀-ͯ]/g;
/* L'apostrofo di elisione (ʼ U+02BC e simili) è per Unicode una LETTERA
   modificatrice: `\p{L}` lo tiene dentro la parola, così «μυρίʼ» non combaciava
   mai con «μυρι». Nella ricerca il danno restava nascosto — il confronto per
   prefisso li trovava lo stesso — ma il riconoscimento confronta insiemi esatti
   e perdeva proprio le parole elise, frequentissime in poesia. Va tolto QUI e
   nello stesso punto di build_corpus_index.py, o indice e ricerca divergono. */
const ELISION = /[ʼ’ʹ᾽᾿῾´'’]/g;
const SWAP = (s) => s.toLowerCase().replace(ELISION, '')
  .replace(/ς/g, 'σ').replace(/v/g, 'u').replace(/j/g, 'i');

/* fold() lavora sull'INTERA stringa: chiamare normalize() una volta per carattere
   costava secondi di CPU su un'opera intera, e rendeva il riconoscimento — che
   normalizza ogni unità di dieci opere — semplicemente inutilizzabile. */
const fold = (s) => SWAP(s.normalize('NFD').replace(COMBINING, ''));

/* foldMap() serve solo dove occorre risalire alla posizione ORIGINALE (per
   evidenziare la forma accentata nei risultati), quindi mantiene la mappa —
   ma salta normalize() sui caratteri ASCII, che normalizzano a sé stessi.
   Deve restare d'accordo con fold(): stesse sostituzioni, stesso ordine. */
function foldMap(s) {
  const out = []; const map = [];
  for (let i = 0; i < s.length; i++) {
    const ch = s[i];
    let f = ch.charCodeAt(0) < 128 ? ch : ch.normalize('NFD').replace(COMBINING, '');
    f = SWAP(f);
    for (const c of f) { out.push(c); map.push(i); }
  }
  return { norm: out.join(''), map };
}
const escapeHtml = (s) => s.replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' }[m]));

let toastTimer;
function toast(msg) {
  const t = document.getElementById('toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 1600);
}

// ── Dati ───────────────────────────────────────────────────────────────────
async function loadIndex() {
  /* `no-cache` = si rivalida sempre col server (che risponde 304 se nulla è
     cambiato: costa un giro, non un download). Serve perché il catalogo si
     rigenera a ogni import: senza, dopo una pubblicazione il browser continua
     a mostrare il catalogo vecchio — titoli e generi di ieri su testi di oggi.
     I JSON delle singole opere restano in cache: quelli non cambiano. */
  const r = await fetch(`${BASE}/_index.json`, { cache: 'no-cache' });
  if (!r.ok) throw new Error('catalogo non trovato');
  state.index = await r.json();
}
async function loadWork(id) {
  if (state.docs[id]) return state.docs[id];
  const meta = state.index.works.find(w => w.id === id);
  if (!meta) throw new Error('opera sconosciuta: ' + id);
  const r = await fetch(`${BASE}/${meta.lang}/${id}.json`);
  if (!r.ok) throw new Error('opera non caricata: ' + id);
  const doc = await r.json();
  state.docs[id] = doc;
  return doc;
}
/* Si mette in cache SOLO l'esito buono e il 404 (spicchio che davvero non esiste).
   Un errore di rete o un 5xx transitorio NON va memorizzato: memorizzandolo, una
   connessione caduta a metà di uno spicchio da 3 MB faceva rispondere «nessuna
   opera contiene questa forma» — una bugia autorevole — per tutto il resto della
   sessione, anche a rete tornata perfetta. Le richieste in volo si condividono,
   così digitare «ε», «ελ», «ελε» non scarica tre volte lo stesso spicchio. */
const inflight = new Map();

async function loadManifest() {
  if (state.manifest) return state.manifest;
  try {
    const r = await fetch(`${BASE}/_idx/_manifest.json`, { cache: 'no-cache' });
    if (!r.ok) return r.status === 404 ? (state.manifest = false) : false;
    state.manifest = await r.json();
  } catch { return false; }           // transitorio: si ritenta alla prossima ricerca
  return state.manifest;
}

async function loadShard(ch) {
  const key = ch.codePointAt(0).toString(16).padStart(4, '0');
  if (key in state.shards) return state.shards[key];
  if (inflight.has(key)) return inflight.get(key);
  const p = (async () => {
    const r = await fetch(`${BASE}/_idx/${key}.json`);
    if (!r.ok) {
      if (r.status === 404) { state.shards[key] = null; return null; }
      throw new Error('spicchio non raggiungibile: ' + r.status);
    }
    const data = await r.json();
    state.shards[key] = data;
    return data;
  })();
  inflight.set(key, p);
  try { return await p; }
  finally { inflight.delete(key); }
}

// ── Selezione corrente ─────────────────────────────────────────────────────
function inBranch(w) { return state.lang === 'all' || w.lang === state.lang; }

// ── Colonna autori ─────────────────────────────────────────────────────────
function renderAuthors(filter) {
  const f = fold(filter || '');
  const authors = state.index.authors
    .filter(a => (state.lang === 'all' || a.lang === state.lang) && (!f || fold(a.name).includes(f)));
  document.getElementById('acount').textContent = authors.length;
  $authors.innerHTML = '';
  const frag = document.createDocumentFragment();
  for (const a of authors) {
    const b = el('button', `arow ${a.lang}`);
    if (state.author === a.id) b.setAttribute('aria-current', 'true');
    b.appendChild(el('span', 'aname', a.name));
    b.appendChild(el('span', 'an', a.works));
    b.onclick = () => openAuthor(a.id);
    frag.appendChild(b);
  }
  if (!authors.length) {
    const e = el('div', 'moreline', 'Nessun autore con questo nome.');
    frag.appendChild(e);
  }
  $authors.appendChild(frag);
}

// ══════════════════════════════════════════════════════════════════════════
// MEMORIA DI LETTURA — «Riprendi»
// ══════════════════════════════════════════════════════════════════════════
/* Sta sul dispositivo, come il tema: opera, libro, ultimo locus visto e quando.
   Non è statistica d'uso, è il segnalibro — l'unica cosa che una biblioteca
   deve ricordare al posto di chi legge. */
const LETTURE_KEY = 'poetrify-corpus-letture';
const LETTURE_MAX = 12;

function letture() {
  try { return JSON.parse(localStorage.getItem(LETTURE_KEY) || '[]'); }
  catch { return []; }
}
function segnaLettura(doc, bookKey, units, drawn) {
  try {
    const list = letture().filter(x => x.id !== doc.id);
    list.unshift({
      id: doc.id, lang: doc.lang, title: doc.title, author: doc.author,
      book: bookKey, tot: doc.stats ? doc.stats.units : units,
      pos: drawn || 0, ts: Date.now(),
    });
    localStorage.setItem(LETTURE_KEY, JSON.stringify(list.slice(0, LETTURE_MAX)));
  } catch { /* spazio esaurito o modalità privata: il segnalibro è un di più */ }
}

// ══════════════════════════════════════════════════════════════════════════
// HOME ESSENZIALE — cerca · riprendi · sfoglia
// ══════════════════════════════════════════════════════════════════════════
const AXES = [
  { key: 'genre', label: 'Genere' },
  { key: 'epoch', label: 'Epoca' },
  { key: 'authorId', label: 'Autore' },
  { key: 'lang', label: 'Lingua' },
];
const LANG_LABEL = { la: 'Latino', grc: 'Greco' };

/* ════════════════════════════════════════════════════════════════════════════
   CRONOLOGIA DELLE VISTE · l'indietro vale anche dentro il Corpus
   ────────────────────────────────────────────────────────────────────────────
   Anche qui una pagina sola contiene più stanze (home, sfoglio, lettore,
   risultati, riconoscimento): senza voci in cronologia il tasto indietro — e la
   gesture del telefono — usciva dal Corpus invece di tornare all'elenco da cui
   si era aperta un'opera. Ogni vista lascia ora la sua voce; il pulsante in
   testata percorre prima le stanze e solo dopo lascia la pagina. */
let _vistaChiaveCorpus = null, _ripristinoCorpus = false, _visteCorpus = 0;

function segnaVistaCorpus() {
  if (_ripristinoCorpus) return;
  const d = { view: state.view, work: state.work ? state.work.id : null,
              author: state.author || null, lang: state.lang || 'all',
              q: (document.getElementById('q') || {}).value || '' };
  const chiave = JSON.stringify(d);
  if (chiave === _vistaChiaveCorpus) return;
  const prima = _vistaChiaveCorpus === null;
  _vistaChiaveCorpus = chiave;
  try {
    if (prima) history.replaceState({ corpusVista: d }, '', location.href);
    else { history.pushState({ corpusVista: d }, '', location.href); _visteCorpus++; }
  } catch (e) {}
}

function applicaVistaCorpus(d) {
  if (!d) return;
  _ripristinoCorpus = true;
  try {
    if (d.lang) state.lang = d.lang;
    if (d.view === 'reader' && d.work) openWork(d.work);
    else if (d.view === 'browse') renderBrowse();
    else if (d.view === 'results' && d.q) runSearch(d.q);
    else renderWelcome();
    _vistaChiaveCorpus = JSON.stringify(d);
  } finally { _ripristinoCorpus = false; }
}

window.addEventListener('popstate', function (e) {
  if (_visteCorpus > 0) _visteCorpus--;
  if (e.state && e.state.corpusVista) applicaVistaCorpus(e.state.corpusVista);
});

/* Il pulsante in testata: prima le stanze, poi fuori dalla pagina. */
function indietroCorpus() {
  if (_visteCorpus > 0) { history.back(); return; }
  if (window.PoetrifyIndietro) PoetrifyIndietro.torna('app.html');
  else location.href = 'app.html';
}


function renderWelcome() {          // la home; il nome resta per le chiamate esistenti
  state.view = 'home'; state.work = null; state.author = null; segnaVistaCorpus();
  state.browse = { lang: null, epoch: null, author: null, genre: null };
  if (state.lang === 'la' || state.lang === 'grc') document.body.dataset.lang = state.lang;
  else document.body.removeAttribute('data-lang');

  const base = state.index.works.filter(inBranch);
  const wrap = el('div');

  const hero = el('div', 'welcome-hero');
  hero.appendChild(el('h1', null, state.lang === 'all'
    ? 'La biblioteca dei classici'
    : `${nf.format(base.length)} opere ${state.lang === 'la' ? 'latine' : 'greche'}`));
  hero.appendChild(el('p', null,
    'Cerca una parola, scrivi una citazione, o incolla una versione. Oppure sfoglia il catalogo qui sotto.'));
  wrap.appendChild(hero);

  // ── Riprendi · o, la prima volta, da dove cominciare ────────────────────
  const storiche = letture().filter(x => state.index.works.some(w => w.id === x.id) &&
    (state.lang === 'all' || x.lang === state.lang));
  const bandR = el('div', 'band');
  const hR = el('div', 'band-h');
  hR.appendChild(el('span', null, storiche.length ? 'Riprendi' : 'Da dove cominciare'));
  bandR.appendChild(hR);
  const grid = el('div', 'resume');
  if (storiche.length) {
    const clr = el('button', 'more', 'dimentica la cronologia');
    clr.onclick = () => { try { localStorage.removeItem(LETTURE_KEY); } catch {} renderWelcome(); };
    hR.appendChild(clr);
    for (const r of storiche.slice(0, 4)) grid.appendChild(resumeCard(r));
  } else {
    /* Stato vuoto che lavora: alla prima visita non c'è una storia, ma c'è
       comunque una risposta alla domanda «da che parte si comincia». */
    const semi = ['phi0448.phi001', 'tlg0032.tlg006', 'phi0690.phi003', 'tlg0012.tlg001'];
    for (const id of semi) {
      const w = state.index.works.find(x => x.id === id && inBranch(x));
      if (w) grid.appendChild(workCard(w));
    }
  }
  bandR.appendChild(grid);
  wrap.appendChild(bandR);

  // ── Sfoglia il catalogo · card di categoria ─────────────────────────────
  const bandC = el('div', 'band');
  const hC = el('div', 'band-h');
  hC.appendChild(el('span', null, 'Sfoglia il catalogo'));
  const tutte = el('button', 'more', `tutte le ${nf.format(base.length)} opere →`);
  tutte.onclick = () => openBrowse({});
  hC.appendChild(tutte);
  bandC.appendChild(hC);

  const axisBar = el('div', 'axis');
  for (const a of AXES) {
    if (a.key === 'lang' && state.lang !== 'all') continue;   // ramo già scelto
    const b = el('button', null, a.label);
    b.setAttribute('aria-pressed', String(state.axis === a.key));
    b.onclick = () => { state.axis = a.key; renderWelcome(); };
    axisBar.appendChild(b);
  }
  bandC.appendChild(axisBar);
  bandC.appendChild(buildCategoryCards(base));
  wrap.appendChild(bandC);

  $stage.innerHTML = ''; $stage.appendChild(wrap);
  renderAuthors(document.getElementById('authorfilter').value);
}

function resumeCard(r) {
  const card = el('button', `rcard ${r.lang}`);
  card.appendChild(el('div', 'rt', r.title));
  card.appendChild(el('div', 'ra', r.author + (r.book && r.book !== '·' ? ' · libro ' + r.book : '')));
  const pct = r.tot ? Math.min(100, Math.round(100 * (r.pos || 0) / r.tot)) : 0;
  const w = el('div', 'rw');
  w.appendChild(el('span', null, r.pos ? `${nf.format(r.pos)} di ${nf.format(r.tot)}` : 'aperta'));
  w.appendChild(el('span', null, pct + '%'));
  card.appendChild(w);
  const p = el('div', 'rp'); const i = el('i'); i.style.width = Math.max(2, pct) + '%';
  p.appendChild(i); card.appendChild(p);
  card.onclick = () => openWork(r.id);
  return card;
}

/* Le categorie NON sono colorate: nel Corpus il colore significa la lingua, e
   «oratoria» è greca e latina insieme. Il filetto proporzionale è in ottone. */
function buildCategoryCards(base) {
  const axis = state.axis || 'genre';
  const tally = {};
  for (const w of base) {
    const k = w[axis];
    if (!tally[k]) tally[k] = { n: 0, words: 0 };
    tally[k].n++; tally[k].words += w.words;
  }
  let voci = Object.entries(tally);
  // epoca in ordine cronologico, il resto per numerosità
  if (axis === 'epoch') voci.sort((a, b) => (EPOCH_ORDER[a[0]] ?? 9) - (EPOCH_ORDER[b[0]] ?? 9));
  else voci.sort((a, b) => b[1].n - a[1].n);

  const max = Math.max(...voci.map(v => v[1].n), 1);
  const CAP = axis === 'genre' ? 11 : (axis === 'authorId' ? 11 : 99);
  const mostrate = voci.slice(0, CAP);
  const resto = voci.slice(CAP);

  const grid = el('div', 'cats');
  for (const [k, v] of mostrate) {
    const c = el('button', 'cat');
    c.appendChild(el('div', 'cn', labelFor(axis, k)));
    c.appendChild(el('div', 'cc', `${nf.format(v.n)} oper${v.n === 1 ? 'a' : 'e'}`));
    const bar = el('div', 'cb'); const i = el('i');
    i.style.width = Math.round(100 * v.n / max) + '%'; bar.appendChild(i);
    c.appendChild(bar);
    c.onclick = () => openBrowse(axis === 'lang' ? { lang: k }
      : axis === 'authorId' ? { lang: langOfAuthor(k), author: k }
      : { [axis]: k });
    grid.appendChild(c);
  }
  if (resto.length) {
    const n = resto.reduce((s, v) => s + v[1].n, 0);
    const c = el('button', 'cat all');
    c.appendChild(el('div', 'cn', `Altri ${resto.length}`));
    c.appendChild(el('div', 'cc', `${nf.format(n)} opere`));
    c.onclick = () => openBrowse({});
    grid.appendChild(c);
  }
  return grid;
}

const EPOCH_ORDER = { arcaica: 0, repubblicana: 1, classica: 1, augustea: 2, ellenistica: 2, imperiale: 3, tarda: 4 };
const EPOCH_WHEN = {
  arcaica: 'le origini', repubblicana: 'età repubblicana', augustea: 'età augustea',
  classica: 'V–IV sec. a.C.', ellenistica: 'III–I sec. a.C.',
  imperiale: 'età imperiale', tarda: 'tarda antichità',
};
/* Didascalie d'epoca · il contesto storico-letterario in tre frasi, perché una
   fascia di secoli non dice nulla a chi non ce l'ha già in testa: «ellenistica»
