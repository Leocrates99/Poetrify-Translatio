<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Poetrify · Scegli la lingua</title>
<!-- Anti-flash tema (D2): imposta [data-theme] prima del paint -->
<script>(function(){try{var t=localStorage.getItem('poetrify-theme');if(t!=='dark'&&t!=='light'){t=matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';}document.documentElement.setAttribute('data-theme',t);}catch(e){}})();</script>
<!-- Font self-hosted (vendor/fonts/) -->
<link rel="stylesheet" href="vendor/fonts/fonts.css">
<!-- Token condivisi (fonte unica del design system · shared/) -->
<link rel="stylesheet" href="shared/poetrify-tokens.css">
<style>
/* Stessa impalcatura di app.html: la pagina-lingua è l'hub con due sole card.
   Nessuno stile proprio inventato — riuso i componenti già in produzione. */
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  font-family: 'Source Serif 4', Georgia, serif;
  color: var(--ink);
  background: var(--ivory);
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
}
body { display: flex; flex-direction: column; align-items: center; padding: 0 20px 64px; }

/* ── Testata (identica ad app.html) ───────────────────────────── */
.lg-top { text-align: center; margin-top: clamp(56px, 12vh, 130px); }
.brand-mark {
  display: block; font-family: 'Playfair Display', Georgia, serif;
  font-size: clamp(40px, 8vw, 60px); font-weight: 700; letter-spacing: -0.015em;
  color: var(--primary); line-height: 1;
}
.brand-sub {
  display: block; margin-top: 14px; font-family: 'Source Sans 3', sans-serif;
  font-size: 12px; font-weight: 600; text-transform: uppercase;
  letter-spacing: 0.22em; color: var(--sepia);
}
.lg-intro {
  max-width: 30rem; text-align: center; margin: 24px auto 0;
  font-size: 17px; line-height: 1.6; color: var(--ink);
}

/* ── Due card (componente .hub-card di app.html) ──────────────── */
.hub {
  display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
  gap: 20px; width: 100%; max-width: 660px; margin: 44px auto 0;
}
.hub-card {
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 16px; padding: 42px 30px; min-height: 190px;
  background: var(--paper); border: 1px solid var(--rule-soft); border-radius: 12px;
  text-decoration: none; color: inherit; text-align: center;
  transition: border-color 0.18s ease, box-shadow 0.18s ease, transform 0.18s ease;
}
.hub-card:hover { border-color: var(--accent); box-shadow: var(--shadow-lift); transform: translateY(-3px); }
.hub-card:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
.hub-card-icon { color: var(--accent); width: 46px; height: 46px; }
.hub-card-title { font-family: 'Playfair Display', Georgia, serif; font-size: 28px; font-weight: 700; color: var(--ink); line-height: 1.1; }
.hub-card.lat { --accent: var(--accent-lat); }
.hub-card.gr  { --accent: var(--accent-gr); }

/* ── Torna indietro ───────────────────────────────────────────── */
.lg-back { margin: 30px auto 0; font-family: 'Source Sans 3', sans-serif; font-size: 12.5px; color: var(--sepia); text-decoration: none; }
.lg-back:hover { color: var(--primary); }
</style>
</head>
<body>

<header class="lg-top">
  <a href="app.html" style="text-decoration:none"><span class="brand-mark">Poetrify</span></a>
  <span class="brand-sub" id="lg-sub">Scegli la lingua</span>
  <p class="lg-intro">In che lingua vuoi lavorare?</p>
</header>

<main class="hub">
  <a class="hub-card lat" id="card-lat" data-lang="la" href="translator.html?lang=la" aria-label="Entra nel ramo latino">
    <!-- Arco romano (arco a tutto sesto entro il monumento): l'innovazione di Roma -->
    <svg class="hub-card-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M3 20.5V7h18v13.5"/>
      <path d="M3 11h18"/>
      <path d="M8 20.5v-6a4 4 0 0 1 8 0v6"/>
    </svg>
    <span class="hub-card-title">Latino</span>
  </a>
  <a class="hub-card gr" id="card-gr" data-lang="grc" href="translator.html?lang=grc" aria-label="Entra nel ramo greco antico">
    <!-- Tempio greco (colonne + timpano): la Partenone -->
    <svg class="hub-card-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M2.5 9 12 3.5 21.5 9Z"/>
      <path d="M5 9v9M9.5 9v9M14.5 9v9M19 9v9"/>
      <path d="M3 18.5h18"/>
    </svg>
    <span class="hub-card-title">Greco antico</span>
  </a>
</main>

<a class="lg-back" href="app.html">← Torna agli strumenti</a>

<!-- Tema condiviso (D2): toggle flottante -->
<script src="shared/poetrify-theme.js" data-inject-toggle></script>

<script>
/* Routing: ?to=<scopo> decide destinazione e sottotitolo.
   Al clic su una card apre <destinazione>.html?lang=<la|grc>. */
(function () {
  var DEST  = { translator: 'translator.html', dizionario: 'dictionary.html', corpus: 'corpus.html', grammatica: 'grammatica.html' };
  var LABEL = { translator: 'Translator', dizionario: 'Dizionario', corpus: 'Corpus', grammatica: 'Grammatica' };
  var to = (new URLSearchParams(location.search).get('to') || 'translator').toLowerCase();
  if (!DEST[to]) to = 'translator';
  var dest = DEST[to];
  document.getElementById('lg-sub').textContent = LABEL[to] + ' · scegli la lingua';
  document.title = 'Poetrify · ' + LABEL[to] + ' · scegli la lingua';
  ['card-lat', 'card-gr'].forEach(function (id) {
    var el = document.getElementById(id);
    el.setAttribute('href', dest + '?lang=' + el.dataset.lang);
  });
}());
</script>
</body>
</html>
